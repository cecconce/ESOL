 schermi"]]},{"t":"fix","h":"Errori da evitare","items":[["The technology is important.","Technology is important.","Concetto generale → niente articolo.","art"],["I use internet every day.","I use the internet every day.","“The internet” vuole l'articolo.","art"],["It depends from the situation.","It depends on the situation.","Depend <strong>on<\/strong>, mai “from”.","prep"]]},{"t":"task","html":"<p>Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda.<\/p><ol><li>What was the last thing you bought online?<\/li><li>Do you think we spend too much time on screens?<\/li><li>Which app do you use most?<\/li><li>How will technology change schools in the future?<\/li><\/ol>","timer":150,"prep":null,"h":"Allenati adesso"}],"ch":"p1","_text":"How important is technology in your life? Very important, both at work and at home. I teach electronics, so technology is literally my job. But I try not to depend on it too much in my free time. What piece of technology couldn't you live without? Probably my laptop. I use it to prepare lessons, correct tests and keep in touch with colleagues. My smartphone is important too, but I could manage without it for a few days. Do you think technology makes people's lives better? In most ways, yes. It saves us time and gives us access to information. However, it can also make us more isolated, and I think many people find it difficult to switch off. How do you use the internet for learning? A lot. I watch tutorials when I need to learn something practical, and at the moment I'm using an app to practise my English speaking. I think it's great that you can learn almost anything online for free. Should children use technology at school? Yes, but with limits. Students need to learn how to use computers properly, because they'll need them for work. But I still think they should write by hand and read real books, too. Domande d'esame con risposta modello Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura. Lessico utile to switch off staccare (anche mentalmente) to keep in touch with restare in contatto con a device un dispositivo to download / upload scaricare / caricare tech-savvy esperto di tecnologia screen time tempo davanti agli schermi Errori da evitare The technology is important. Technology is important. Concetto generale → niente articolo. art I use internet every day. I use the internet every day. “The internet” vuole l'articolo. art It depends from the situation. It depends on the situation. Depend on , mai “from”. prep Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda. What was the last thing you bought online? Do you think we spend too much time on screens? Which app do you use most? How will technology change schools in the future? Allenati adesso Esprimere opinioni bilanciate (vantaggi / svantaggi) sulla tecnologia."},{"id":"p1-shopping","n":"1.10","title":"Acquisti e soldi","sub":"Negozi, online, risparmiare","tags":["shopping","tech"],"min":15,"day":9,"goal":"Confrontare negozi e acquisti online con strutture comparative corrette.","blocks":[{"t":"qa","items":[{"q":"Do you enjoy shopping?","a":"Not really, to be honest. I only go shopping when I need something. I'm the kind of person who knows what he wants, goes in, buys it and leaves as quickly as possible."},{"q":"Do you prefer shopping online or in shops?","a":"It depends on what I'm buying. For clothes and shoes I prefer going to a shop, because I want to try them on. For books or electronic components I usually order online, because it's cheaper and quicker."},{"q":"What was the last thing you bought?","a":"The last thing I bought was a new pair of running shoes. My old ones were completely worn out. I went to a sports shop so that the assistant could check the way I run."},{"q":"Is it easy to save money these days?","a":"No, it isn't. Prices have gone up a lot in the last few years, especially energy and food. I try to save a bit every month, but it's harder than it used to be."},{"q":"Have you ever bought something you regretted?","a":"Yes, I have. A few years ago I bought an expensive exercise bike because I was sure I would use it every day. I used it about five times and then it became a place to hang clothes!"}],"h":"Domande d'esame con risposta modello","note":"Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura."},{"t":"vocab","h":"Lessico utile","items":[["to try something on","provare (un vestito)"],["worn out","consumato"],["a bargain","un affare"],["the sales","i saldi"],["to go up / to rise","aumentare (prezzi)"],["a receipt","scontrino / ricevuta"]]},{"t":"fix","h":"Errori da evitare","items":[["Online is more cheap.","Online it's cheaper.","Comparativo breve: cheap → cheaper.",""],["I bought a new shoes.","I bought a new pair of shoes.","“Shoes” è plurale: niente “a”.","art"],["The prices are increased.","Prices have gone up. / Prices have increased.","Calco del passivo italiano “sono aumentati”.","calque"]]},{"t":"task","html":"<p>Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda.<\/p><ol><li>Where do you usually buy your clothes?<\/li><li>Do you like giving presents?<\/li><li>Is money important for happiness?<\/li><li>Did you get pocket money as a child?<\/li><\/ol>","timer":150,"prep":null,"h":"Allenati adesso"}],"ch":"p1","_text":"Do you enjoy shopping? Not really, to be honest. I only go shopping when I need something. I'm the kind of person who knows what he wants, goes in, buys it and leaves as quickly as possible. Do you prefer shopping online or in shops? It depends on what I'm buying. For clothes and shoes I prefer going to a shop, because I want to try them on. For books or electronic components I usually order online, because it's cheaper and quicker. What was the last thing you bought? The last thing I bought was a new pair of running shoes. My old ones were completely worn out. I went to a sports shop so that the assistant could check the way I run. Is it easy to save money these days? No, it isn't. Prices have gone up a lot in the last few years, especially energy and food. I try to save a bit every month, but it's harder than it used to be. Have you ever bought something you regretted? Yes, I have. A few years ago I bought an expensive exercise bike because I was sure I would use it every day. I used it about five times and then it became a place to hang clothes! Domande d'esame con risposta modello Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura. Lessico utile to try something on provare (un vestito) worn out consumato a bargain un affare the sales i saldi to go up / to rise aumentare (prezzi) a receipt scontrino / ricevuta Errori da evitare Online is more cheap. Online it's cheaper. Comparativo breve: cheap → cheaper. I bought a new shoes. I bought a new pair of shoes. “Shoes” è plurale: niente “a”. art The prices are increased. Prices have gone up. / Prices have increased. Calco del passivo italiano “sono aumentati”. calque Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda. Where do you usually buy your clothes? Do you like giving presents? Is money important for happiness? Did you get pocket money as a child? Allenati adesso Confrontare negozi e acquisti online con strutture comparative corrette."},{"id":"p1-weather","n":"1.11","title":"Tempo atmosferico e stagioni","sub":"Stagioni, clima, attività all'aperto","tags":["weather","environment","freetime"],"min":15,"day":5,"goal":"Parlare del tempo e delle stagioni collegandoli alle tue abitudini.","blocks":[{"t":"qa","items":[{"q":"What's your favourite season?","a":"Autumn, I think. It isn't too hot or too cold, which is perfect for running, and the colours of the trees are beautiful. I also like the food: chestnuts, mushrooms and new wine!"},{"q":"What's the weather usually like where you live?","a":"It's quite humid. The summers are hot and sticky, and in winter we often have fog, especially in the morning. It doesn't snow much in the plain, but the mountains are only an hour away."},{"q":"Does the weather affect your mood?","a":"Yes, it does. When it's grey and rainy for days, I feel more tired and less motivated. On the other hand, a sunny morning always puts me in a good mood."},{"q":"Has the weather changed in your area in recent years?","a":"Yes, a lot. Summers have become much hotter and there have been more extreme storms. A few years ago we had a terrible hailstorm that damaged lots of cars and roofs in my town.","tip":"<em>have become / have been<\/em> (cambiamento fino a oggi) poi <em>we had<\/em> (evento con data)."},{"q":"What do you like doing when it rains?","a":"I usually stay at home and read, or I catch up on work. If I really need to move, I go to the gym instead of running outside."}],"h":"Domande d'esame con risposta modello","note":"Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura."},{"t":"vocab","h":"Lessico utile","items":[["humid / sticky","umido / afoso"],["fog / foggy","nebbia / nebbioso"],["a hailstorm","grandinata"],["it's pouring (with rain)","piove a dirotto"],["mild","mite"],["to put someone in a good mood","mettere di buon umore"]]},{"t":"fix","h":"Errori da evitare","items":[["It makes very hot in summer.","It's very hot in summer.","Calco di “fa caldo”: in inglese “it is”.","calque"],["In the winter there is a lot of fog.","In winter there's a lot of fog.","Le stagioni in generale: di solito senza “the”.","art"],["The weather is changed.","The weather has changed.","Calco di “è cambiato”: serve “has”.","tense"]]},{"t":"task","html":"<p>Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda.<\/p><ol><li>What do you do on hot summer days?<\/li><li>Do you check the weather forecast every day?<\/li><li>Would you like to live in a hotter or colder country?<\/li><li>What was the weather like last weekend?<\/li><\/ol>","timer":150,"prep":null,"h":"Allenati adesso"}],"ch":"p1","_text":"What's your favourite season? Autumn, I think. It isn't too hot or too cold, which is perfect for running, and the colours of the trees are beautiful. I also like the food: chestnuts, mushrooms and new wine! What's the weather usually like where you live? It's quite humid. The summers are hot and sticky, and in winter we often have fog, especially in the morning. It doesn't snow much in the plain, but the mountains are only an hour away. Does the weather affect your mood? Yes, it does. When it's grey and rainy for days, I feel more tired and less motivated. On the other hand, a sunny morning always puts me in a good mood. Has the weather changed in your area in recent years? Yes, a lot. Summers have become much hotter and there have been more extreme storms. A few years ago we had a terrible hailstorm that damaged lots of cars and roofs in my town. have become / have been (cambiamento fino a oggi) poi we had (evento con data). What do you like doing when it rains? I usually stay at home and read, or I catch up on work. If I really need to move, I go to the gym instead of running outside. Domande d'esame con risposta modello Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura. Lessico utile humid / sticky umido / afoso fog / foggy nebbia / nebbioso a hailstorm grandinata it's pouring (with rain) piove a dirotto mild mite to put someone in a good mood mettere di buon umore Errori da evitare It makes very hot in summer. It's very hot in summer. Calco di “fa caldo”: in inglese “it is”. calque In the winter there is a lot of fog. In winter there's a lot of fog. Le stagioni in generale: di solito senza “the”. art The weather is changed. The weather has changed. Calco di “è cambiato”: serve “has”. tense Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda. What do you do on hot summer days? Do you check the weather forecast every day? Would you like to live in a hotter or colder country? What was the weather like last weekend? Allenati adesso Parlare del tempo e delle stagioni collegandoli alle tue abitudini."},{"id":"p1-family","n":"1.12","title":"Famiglia e amici","sub":"Relazioni, tempo insieme, amicizia","tags":["family","freetime"],"min":15,"day":7,"goal":"Descrivere persone e relazioni senza errori di pronomi e possessivi.","blocks":[{"t":"qa","items":[{"q":"Tell me about your family.","a":"It's a fairly small family. My parents still live nearby, so I see them almost every week. I have a brother who lives in another city; we don't see each other often, but we speak on the phone regularly."},{"q":"Who are you closest to in your family?","a":"Probably my mother. She's a very practical person and she always gives me good advice, even if I don't always follow it!"},{"q":"How often do you see your friends?","a":"Not as often as I'd like. Most of my friends have busy lives, like me. We usually meet up once or twice a month for dinner, and I see some of them at the judo club."},{"q":"What makes a good friend?","a":"For me, a good friend is someone you can rely on, who tells you the truth even when it's not what you want to hear. I also think it's important to have fun together."},{"q":"How did you meet your best friend?","a":"We met at secondary school. We sat next to each other in the lab on the first day, and we became friends almost immediately. We've known each other for more than thirty years now.","tip":"<em>We met<\/em> (quando) e <em>we've known each other for<\/em> (da quanto tempo)."}],"h":"Domande d'esame con risposta modello","note":"Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura."},{"t":"vocab","h":"Lessico utile","items":[["to rely on","contare su"],["to get on well with","andare d'accordo con"],["to meet up","vedersi (con amici)"],["close to","legato a"],["relatives","parenti"],["to grow up","crescere"]]},{"t":"fix","h":"Errori da evitare","items":[["My parents are my relatives more close.","My parents are my closest relatives.","Superlativo breve: close → closest.",""],["I know him since 30 years.","I've known him for 30 years.","“Conosco da” = present perfect + for.","tense"],["She gives me good advices.","She gives me good advice.","“Advice” non è numerabile: niente -s.","vocab"]]},{"t":"task","html":"<p>Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda.<\/p><ol><li>Do you come from a big family?<\/li><li>Is it easy to make friends as an adult?<\/li><li>What do you usually do with your family at weekends?<\/li><li>Do you keep in touch with old school friends?<\/li><\/ol>","timer":150,"prep":null,"h":"Allenati adesso"}],"ch":"p1","_text":"Tell me about your family. It's a fairly small family. My parents still live nearby, so I see them almost every week. I have a brother who lives in another city; we don't see each other often, but we speak on the phone regularly. Who are you closest to in your family? Probably my mother. She's a very practical person and she always gives me good advice, even if I don't always follow it! How often do you see your friends? Not as often as I'd like. Most of my friends have busy lives, like me. We usually meet up once or twice a month for dinner, and I see some of them at the judo club. What makes a good friend? For me, a good friend is someone you can rely on, who tells you the truth even when it's not what you want to hear. I also think it's important to have fun together. How did you meet your best friend? We met at secondary school. We sat next to each other in the lab on the first day, and we became friends almost immediately. We've known each other for more than thirty years now. We met (quando) e we've known each other for (da quanto tempo). Domande d'esame con risposta modello Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura. Lessico utile to rely on contare su to get on well with andare d'accordo con to meet up vedersi (con amici) close to legato a relatives parenti to grow up crescere Errori da evitare My parents are my relatives more close. My parents are my closest relatives. Superlativo breve: close → closest. I know him since 30 years. I've known him for 30 years. “Conosco da” = present perfect + for. tense She gives me good advices. She gives me good advice. “Advice” non è numerabile: niente -s. vocab Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda. Do you come from a big family? Is it easy to make friends as an adult? What do you usually do with your family at weekends? Do you keep in touch with old school friends? Allenati adesso Descrivere persone e relazioni senza errori di pronomi e possessivi."},{"id":"p1-health","n":"1.13","title":"Salute e stile di vita","sub":"Abitudini sane, stress, sonno","tags":["health","sport","food"],"min":15,"day":8,"goal":"Dare consigli e parlare di abitudini con should, try to, used to.","blocks":[{"t":"qa","items":[{"q":"What do you do to stay healthy?","a":"I try to stay active: I go running and I do judo. I also try to eat well, although I'm not always strict about it. The thing I find hardest is getting enough sleep during the school year."},{"q":"Do you think people today are healthier than in the past?","a":"In some ways, yes: we know more about nutrition and medicine is much better. But people also spend more time sitting down, and stress is a big problem, especially at work."},{"q":"How do you deal with stress?","a":"Exercise is the best solution for me. After a run or a judo session I always feel calmer. I also try not to check work emails in the evening, although it's not always easy."},{"q":"Have you changed any habits recently to be healthier?","a":"Yes, I have. I've started going to bed earlier, and I've stopped drinking coffee after lunch. I've noticed that I sleep much better now."},{"q":"What advice would you give to someone who wants to get fit?","a":"I'd tell them to start slowly and choose an activity they actually enjoy. If you hate the gym, you won't go. It's better to walk for thirty minutes every day than to train hard once a month."}],"h":"Domande d'esame con risposta modello","note":"Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura."},{"t":"vocab","h":"Lessico utile","items":[["to get fit / to keep fit","rimettersi / tenersi in forma"],["to deal with","gestire / affrontare"],["a habit","un'abitudine"],["to take up (a sport)","iniziare (uno sport)"],["a sedentary lifestyle","vita sedentaria"],["to give up (smoking)","smettere di (fumare)"]]},{"t":"fix","h":"Errori da evitare","items":[["I try to make sport every day.","I try to do some exercise every day.","Si “does” sport/exercise, non si “make”.","calque"],["I have stopped to drink coffee.","I've stopped drinking coffee.","Stop + -ing = smettere di fare; stop + to = fermarsi per fare.",""],["The stress is a big problem.","Stress is a big problem.","Sostantivo astratto in generale: niente “the”.","art"]]},{"t":"task","html":"<p>Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda.<\/p><ol><li>How many hours do you usually sleep?<\/li><li>Is it expensive to live a healthy life?<\/li><li>Should the government do more to keep people healthy?<\/li><li>What's the healthiest thing you did last week?<\/li><\/ol>","timer":150,"prep":null,"h":"Allenati adesso"}],"ch":"p1","_text":"What do you do to stay healthy? I try to stay active: I go running and I do judo. I also try to eat well, although I'm not always strict about it. The thing I find hardest is getting enough sleep during the school year. Do you think people today are healthier than in the past? In some ways, yes: we know more about nutrition and medicine is much better. But people also spend more time sitting down, and stress is a big problem, especially at work. How do you deal with stress? Exercise is the best solution for me. After a run or a judo session I always feel calmer. I also try not to check work emails in the evening, although it's not always easy. Have you changed any habits recently to be healthier? Yes, I have. I've started going to bed earlier, and I've stopped drinking coffee after lunch. I've noticed that I sleep much better now. What advice would you give to someone who wants to get fit? I'd tell them to start slowly and choose an activity they actually enjoy. If you hate the gym, you won't go. It's better to walk for thirty minutes every day than to train hard once a month. Domande d'esame con risposta modello Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura. Lessico utile to get fit / to keep fit rimettersi / tenersi in forma to deal with gestire / affrontare a habit un'abitudine to take up (a sport) iniziare (uno sport) a sedentary lifestyle vita sedentaria to give up (smoking) smettere di (fumare) Errori da evitare I try to make sport every day. I try to do some exercise every day. Si “does” sport/exercise, non si “make”. calque I have stopped to drink coffee. I've stopped drinking coffee. Stop + -ing = smettere di fare; stop + to = fermarsi per fare. The stress is a big problem. Stress is a big problem. Sostantivo astratto in generale: niente “the”. art Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda. How many hours do you usually sleep? Is it expensive to live a healthy life? Should the government do more to keep people healthy? What's the healthiest thing you did last week? Allenati adesso Dare consigli e parlare di abitudini con should, try to, used to."},{"id":"p1-festivals","n":"1.14","title":"Feste e celebrazioni","sub":"Natale, compleanni, tradizioni locali","tags":["festivals","family","food"],"min":15,"day":7,"goal":"Descrivere una tradizione e raccontare una festa passata.","blocks":[{"t":"qa","items":[{"q":"What's the most important celebration in your country?","a":"I'd say Christmas. It's a time when families get together, usually for a very long lunch on Christmas Day. In my region we also celebrate Epiphany, on the sixth of January, with big bonfires called “pignarûl”."},{"q":"How did you celebrate your last birthday?","a":"Nothing special, to be honest. I had dinner with my family at home, and my colleagues brought a cake to school. I'm not a big fan of parties, so that was perfect for me."},{"q":"Do you prefer big parties or small gatherings?","a":"Small gatherings, definitely. I prefer spending time with a few close friends, where you can actually talk to people. At big parties it's often too noisy to have a real conversation."},{"q":"Is there a local festival in your area?","a":"Yes, several. In many towns there are summer festivals called “sagre”, where volunteers cook local food and there's live music. They're a great way to meet people and support local associations."},{"q":"Have traditions changed since you were young?","a":"Yes, a bit. Some traditions have become more commercial, like Halloween, which we didn't celebrate at all when I was a child. But the family meals at Christmas are still the same."}],"h":"Domande d'esame con risposta modello","note":"Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura."},{"t":"vocab","h":"Lessico utile","items":[["to get together","riunirsi"],["a bonfire","falò"],["a gathering","ritrovo / riunione"],["a volunteer","volontario"],["to celebrate","festeggiare"],["Christmas Eve / Day","vigilia / giorno di Natale"]]},{"t":"fix","h":"Errori da evitare","items":[["At Christmas we make a big lunch.","At Christmas we have a big lunch.","Il pasto: have, non make (a meno che tu non lo cucini).","calque"],["In the 6 January.","On the sixth of January.","Date e giorni: <strong>on<\/strong>.","prep"],["I have celebrated my birthday last week.","I celebrated my birthday last week.","“Last week” → past simple.","tense"]]},{"t":"task","html":"<p>Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda.<\/p><ol><li>What do you usually do on New Year's Eve?<\/li><li>Do you give presents at Christmas?<\/li><li>Which festival from another country would you like to see?<\/li><li>What's the best party you've ever been to?<\/li><\/ol>","timer":150,"prep":null,"h":"Allenati adesso"}],"ch":"p1","_text":"What's the most important celebration in your country? I'd say Christmas. It's a time when families get together, usually for a very long lunch on Christmas Day. In my region we also celebrate Epiphany, on the sixth of January, with big bonfires called “pignarûl”. How did you celebrate your last birthday? Nothing special, to be honest. I had dinner with my family at home, and my colleagues brought a cake to school. I'm not a big fan of parties, so that was perfect for me. Do you prefer big parties or small gatherings? Small gatherings, definitely. I prefer spending time with a few close friends, where you can actually talk to people. At big parties it's often too noisy to have a real conversation. Is there a local festival in your area? Yes, several. In many towns there are summer festivals called “sagre”, where volunteers cook local food and there's live music. They're a great way to meet people and support local associations. Have traditions changed since you were young? Yes, a bit. Some traditions have become more commercial, like Halloween, which we didn't celebrate at all when I was a child. But the family meals at Christmas are still the same. Domande d'esame con risposta modello Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura. Lessico utile to get together riunirsi a bonfire falò a gathering ritrovo / riunione a volunteer volontario to celebrate festeggiare Christmas Eve / Day vigilia / giorno di Natale Errori da evitare At Christmas we make a big lunch. At Christmas we have a big lunch. Il pasto: have, non make (a meno che tu non lo cucini). calque In the 6 January. On the sixth of January. Date e giorni: on . prep I have celebrated my birthday last week. I celebrated my birthday last week. “Last week” → past simple. tense Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda. What do you usually do on New Year's Eve? Do you give presents at Christmas? Which festival from another country would you like to see? What's the best party you've ever been to? Allenati adesso Descrivere una tradizione e raccontare una festa passata."},{"id":"p1-media","n":"1.15","title":"Media, notizie, film","sub":"Come ti informi, cosa guardi e leggi","tags":["media","tech","freetime"],"min":15,"day":3,"goal":"Parlare di notizie, film e libri dando opinioni e motivazioni.","blocks":[{"t":"qa","items":[{"q":"How do you usually get the news?","a":"Mostly online. I read a couple of news websites in the morning, and I listen to the radio in the car on the way to school. I rarely buy a newspaper these days."},{"q":"Do you trust the news you read on social media?","a":"Not really. There's a lot of fake news on social media, so if I read something surprising, I try to check it on a reliable website before I believe it."},{"q":"What kind of films do you like?","a":"I like thrillers and science fiction, because they keep you thinking. I'm not a big fan of romantic comedies. The last film I saw was a documentary about space exploration, and it was fascinating."},{"q":"Do you prefer reading books or watching films?","a":"It depends on how tired I am! In the evening, after a long day, I usually watch something. But on holiday I love reading, and I often think the book is better than the film."},{"q":"Tell me about a TV programme you enjoyed recently.","a":"Recently I watched a series about the history of engineering, how big bridges and tunnels were built. I enjoyed it because it's connected to my job and I learnt a lot of things I can tell my students."}],"h":"Domande d'esame con risposta modello","note":"Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura."},{"t":"vocab","h":"Lessico utile","items":[["fake news","notizie false"],["reliable","affidabile"],["a series (sing. e pl.)","una serie TV"],["a documentary","documentario"],["headlines","titoli (dei giornali)"],["to keep up with the news","tenersi aggiornato"]]},{"t":"fix","h":"Errori da evitare","items":[["I have seen a film yesterday.","I saw a film yesterday.","“Yesterday” → past simple.","tense"],["The news are bad.","The news is bad.","“News” è singolare.","vocab"],["I informate myself on internet.","I keep up with the news online.","“Informate” non esiste; “online” evita anche il problema dell'articolo.","calque"]]},{"t":"task","html":"<p>Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda.<\/p><ol><li>Do you listen to podcasts?<\/li><li>What was the last book you read?<\/li><li>Do you think newspapers will disappear?<\/li><li>Do you prefer watching films at home or at the cinema?<\/li><\/ol>","timer":150,"prep":null,"h":"Allenati adesso"}],"ch":"p1","_text":"How do you usually get the news? Mostly online. I read a couple of news websites in the morning, and I listen to the radio in the car on the way to school. I rarely buy a newspaper these days. Do you trust the news you read on social media? Not really. There's a lot of fake news on social media, so if I read something surprising, I try to check it on a reliable website before I believe it. What kind of films do you like? I like thrillers and science fiction, because they keep you thinking. I'm not a big fan of romantic comedies. The last film I saw was a documentary about space exploration, and it was fascinating. Do you prefer reading books or watching films? It depends on how tired I am! In the evening, after a long day, I usually watch something. But on holiday I love reading, and I often think the book is better than the film. Tell me about a TV programme you enjoyed recently. Recently I watched a series about the history of engineering, how big bridges and tunnels were built. I enjoyed it because it's connected to my job and I learnt a lot of things I can tell my students. Domande d'esame con risposta modello Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura. Lessico utile fake news notizie false reliable affidabile a series (sing. e pl.) una serie TV a documentary documentario headlines titoli (dei giornali) to keep up with the news tenersi aggiornato Errori da evitare I have seen a film yesterday. I saw a film yesterday. “Yesterday” → past simple. tense The news are bad. The news is bad. “News” è singolare. vocab I informate myself on internet. I keep up with the news online. “Informate” non esiste; “online” evita anche il problema dell'articolo. calque Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda. Do you listen to podcasts? What was the last book you read? Do you think newspapers will disappear? Do you prefer watching films at home or at the cinema? Allenati adesso Parlare di notizie, film e libri dando opinioni e motivazioni."},{"id":"p1-environment","n":"1.16","title":"Ambiente e natura","sub":"Riciclo, clima, piccoli gesti","tags":["environment","weather","town"],"min":15,"day":6,"goal":"Esprimere opinioni sull'ambiente senza restare nel vago: fatti concreti della tua vita.","blocks":[{"t":"qa","items":[{"q":"Do you do anything to help the environment?","a":"I try to. We recycle everything at home, because in my town the collection is very strict. I also try to use the car less, and in summer I sometimes cycle to school."},{"q":"Is there a lot of pollution where you live?","a":"Quite a lot, unfortunately. The Po Valley is one of the most polluted areas in Europe, especially in winter, because the mountains block the wind. On some days the air quality is really bad."},{"q":"Do you spend much time in nature?","a":"Yes, quite a lot, mostly when I go running. There's a beautiful path along the river near my house. At the weekend we sometimes go hiking in the mountains, which are only an hour away."},{"q":"Who should do more to protect the environment: governments or individuals?","a":"Both, but I think governments and big companies have the biggest responsibility, because their decisions have a much larger impact. Individuals can help, but they need good public transport and clear rules."},{"q":"Have you changed anything in your life for environmental reasons?","a":"Yes. A few years ago we installed solar panels on the roof, and I've stopped buying plastic bottles. It's not much, but I think small changes add up."}],"h":"Domande d'esame con risposta modello","note":"Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura."},{"t":"vocab","h":"Lessico utile","items":[["to recycle / recycling","riciclare / raccolta differenziata"],["pollution / polluted","inquinamento / inquinato"],["solar panels","pannelli solari"],["to add up","sommarsi, fare la differenza"],["waste","rifiuti / spreco"],["to reduce your carbon footprint","ridurre l'impronta di CO₂"]]},{"t":"fix","h":"Errori da evitare","items":[["I make the differentiated collection.","I recycle. / I separate my rubbish.","Calco diretto: in inglese si dice semplicemente “recycle”.","calque"],["The nature is important.","Nature is important.","Nature in generale: niente “the”.","art"],["We have installed solar panels two years ago.","We installed solar panels two years ago.","“Two years ago” → past simple.","tense"]]},{"t":"task","html":"<p>Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda.<\/p><ol><li>What's the biggest environmental problem in your area?<\/li><li>Would you buy an electric car?<\/li><li>Should plastic bags be banned?<\/li><li>Do young people care more about the environment?<\/li><\/ol>","timer":150,"prep":null,"h":"Allenati adesso"}],"ch":"p1","_text":"Do you do anything to help the environment? I try to. We recycle everything at home, because in my town the collection is very strict. I also try to use the car less, and in summer I sometimes cycle to school. Is there a lot of pollution where you live? Quite a lot, unfortunately. The Po Valley is one of the most polluted areas in Europe, especially in winter, because the mountains block the wind. On some days the air quality is really bad. Do you spend much time in nature? Yes, quite a lot, mostly when I go running. There's a beautiful path along the river near my house. At the weekend we sometimes go hiking in the mountains, which are only an hour away. Who should do more to protect the environment: governments or individuals? Both, but I think governments and big companies have the biggest responsibility, because their decisions have a much larger impact. Individuals can help, but they need good public transport and clear rules. Have you changed anything in your life for environmental reasons? Yes. A few years ago we installed solar panels on the roof, and I've stopped buying plastic bottles. It's not much, but I think small changes add up. Domande d'esame con risposta modello Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura. Lessico utile to recycle / recycling riciclare / raccolta differenziata pollution / polluted inquinamento / inquinato solar panels pannelli solari to add up sommarsi, fare la differenza waste rifiuti / spreco to reduce your carbon footprint ridurre l'impronta di CO₂ Errori da evitare I make the differentiated collection. I recycle. / I separate my rubbish. Calco diretto: in inglese si dice semplicemente “recycle”. calque The nature is important. Nature is important. Nature in generale: niente “the”. art We have installed solar panels two years ago. We installed solar panels two years ago. “Two years ago” → past simple. tense Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda. What's the biggest environmental problem in your area? Would you buy an electric car? Should plastic bags be banned? Do young people care more about the environment? Allenati adesso Esprimere opinioni sull'ambiente senza restare nel vago: fatti concreti della tua vita."},{"id":"p2-howto","n":"2.0","title":"Come funziona la Part 2","sub":"Due mini-dialoghi: reagire e iniziare","tags":["functions","strategy","format"],"min":10,"day":4,"goal":"Capire il meccanismo dei role-play e la regola dei 3 passi: reagisci, sviluppa, chiudi.","blocks":[{"t":"p","html":"<p>L'esaminatore legge una situazione breve: <em>“I'm your neighbour. You're going to have a party on Saturday. Tell me about it.”<\/em> oppure <em>“I'm your colleague. I'll start.”<\/em>. Ogni role-play dura circa un minuto e mezzo, con 3–4 battute a testa.<\/p>\n<p>La Part 2 non valuta cosa dici, ma <strong>se usi la funzione giusta<\/strong> (scusarti, proporre, lamentarti…) con il registro adatto: cortese ma naturale.<\/p>","h":null},{"t":"list","items":["<strong>1. Reagisci<\/strong> alla situazione con la frase funzionale giusta (<em>I'm so sorry…<\/em>, <em>Congratulations!<\/em>, <em>Could you possibly…?<\/em>).","<strong>2. Sviluppa<\/strong>: dai un motivo, una proposta concreta o una domanda. È qui che mostri il livello B2.","<strong>3. Chiudi<\/strong> o rilancia: <em>Does that sound OK?<\/em> · <em>Let me know.<\/em> · <em>Thanks again.<\/em>"],"h":"La regola dei 3 passi"},{"t":"fix","h":"Errori da evitare","items":[["I'm sorry for the delay, I have had a problem with the car.","Sorry I'm late — I had a problem with the car.","Il problema è finito: past simple. E “sorry I'm late” è più naturale.","tense"],["You must come to my party!","You should come to my party! / I'd love you to come.","“Must” suona come un ordine. Usa forme più morbide.",""],["Can you give me the salt?","Could you pass me the salt, please?","Con persone che non conosci bene: “could” + “please”.",""]]},{"t":"task","html":"<p>Per ogni situazione, di' <em>solo la prima battuta<\/em> con i 3 passi (reazione + sviluppo + domanda):<br>1. Your friend tells you they've just got engaged.<br>2. You need to leave a meeting early.<br>3. A colleague offers to help you move house.<\/p>","timer":60,"prep":null,"h":"Allenati adesso"}],"ch":"p2","_text":" L'esaminatore legge una situazione breve: “I'm your neighbour. You're going to have a party on Saturday. Tell me about it.” oppure “I'm your colleague. I'll start.” . Ogni role-play dura circa un minuto e mezzo, con 3–4 battute a testa. La Part 2 non valuta cosa dici, ma se usi la funzione giusta (scusarti, proporre, lamentarti…) con il registro adatto: cortese ma naturale. 1. Reagisci alla situazione con la frase funzionale giusta ( I'm so sorry… , Congratulations! , Could you possibly…? ). 2. Sviluppa : dai un motivo, una proposta concreta o una domanda. È qui che mostri il livello B2. 3. Chiudi o rilancia: Does that sound OK? · Let me know. · Thanks again. La regola dei 3 passi Errori da evitare I'm sorry for the delay, I have had a problem with the car. Sorry I'm late — I had a problem with the car. Il problema è finito: past simple. E “sorry I'm late” è più naturale. tense You must come to my party! You should come to my party! / I'd love you to come. “Must” suona come un ordine. Usa forme più morbide. Can you give me the salt? Could you pass me the salt, please? Con persone che non conosci bene: “could” + “please”. Per ogni situazione, di' solo la prima battuta con i 3 passi (reazione + sviluppo + domanda): 1. Your friend tells you they've just got engaged. 2. You need to leave a meeting early. 3. A colleague offers to help you move house. Allenati adesso Capire il meccanismo dei role-play e la regola dei 3 passi: reagisci, sviluppa, chiudi."},{"id":"p2-phrases","n":"2.1","title":"Kit di frasi funzionali","sub":"Proporre, scusarsi, rassicurare, chiedere e altro","tags":["functions","fluency"],"min":20,"day":4,"goal":"Avere in bocca, senza pensarci, 2–3 frasi per ogni funzione della Part 2.","blocks":[{"t":"p","html":"<p>Questa è la lezione da ripassare più spesso. Non serve impararle tutte: scegline <strong>due per gruppo<\/strong> e usale finché diventano automatiche. Premi <em>ascolta<\/em> per sentire l'intonazione.<\/p>","h":null},{"t":"phrases","h":"Le frasi, per funzione","groups":[{"name":"Proporre / suggerire","items":[["Why don't we…?",""],["How about + -ing…?","How about going by train?"],["What if we…?",""],["Shall I…?","offrirsi"],["It might be a good idea to…",""]]},{"name":"Scusarsi","items":[["I'm really sorry about…",""],["I'm so sorry, I completely forgot.",""],["I feel terrible about it.",""],["It won't happen again, I promise.",""]]},{"name":"Rassicurare / accettare le scuse","items":[["Don't worry about it.",""],["It's not a big deal.",""],["These things happen.",""],["No harm done.","nessun danno"]]},{"name":"Chiedere un favore / un permesso","items":[["Could you possibly…?","molto cortese"],["Would you mind + -ing…?","Would you mind lending me…?"],["Is it OK if I…?",""],["I was wondering if you could…","il più cortese"]]},{"name":"Rispondere a un favore","items":[["Sure, no problem.",""],["Of course, go ahead.",""],["I'd like to help, but…","rifiutare con gentilezza"],["I'm afraid I can't, because…",""]]},{"name":"Invitare / accettare / rifiutare","items":[["Would you like to come to…?",""],["I'd love to, thanks!",""],["That sounds great!",""],["I'd love to, but I'm afraid I've already got plans.",""]]},{"name":"Lamentarsi con cortesia","items":[["I'm afraid there's a problem with…",""],["I'm sorry to bother you, but…",""],["I'd like to make a complaint about…","formale"],["Would it be possible to…?","chiedere una soluzione"]]},{"name":"Consigliare","items":[["If I were you, I'd…",""],["You should / You could…",""],["Have you thought about + -ing…?",""],["It's worth + -ing…","vale la pena"]]},{"name":"Congratularsi / consolare","items":[["Congratulations! That's fantastic news!",""],["Well done, you deserve it.",""],["Oh no, I'm sorry to hear that.",""],["That must be really hard for you.",""]]},{"name":"Ringraziare e chiudere","items":[["Thanks a lot, I really appreciate it.",""],["That's really kind of you.",""],["Let me know if you need anything.",""],["See you then!",""]]}]},{"t":"fix","h":"Errori da evitare","items":[["Would you mind to lend me your car?","Would you mind lending me your car?","Would you mind + -ing.",""],["How about to go to the cinema?","How about going to the cinema?","How about + -ing.",""],["If I would be you, I would…","If I were you, I'd…","Nella frase con if: “were”, non “would be”.",""]]},{"t":"task","html":"<p>Timer di 2 minuti: per ogni gruppo di frasi qui sopra, inventa ad alta voce una frase completa su una situazione della tua scuola o della palestra di judo.<\/p>","timer":120,"prep":null,"h":"Allenati adesso"}],"ch":"p2","_text":" Questa è la lezione da ripassare più spesso. Non serve impararle tutte: scegline due per gruppo e usale finché diventano automatiche. Premi ascolta per sentire l'intonazione. Le frasi, per funzione Proporre / suggerire Why don't we…? How about + -ing…? How about going by train? What if we…? Shall I…? offrirsi It might be a good idea to… Scusarsi I'm really sorry about… I'm so sorry, I completely forgot. I feel terrible about it. It won't happen again, I promise. Rassicurare / accettare le scuse Don't worry about it. It's not a big deal. These things happen. No harm done. nessun danno Chiedere un favore / un permesso Could you possibly…? molto cortese Would you mind + -ing…? Would you mind lending me…? Is it OK if I…? I was wondering if you could… il più cortese Rispondere a un favore Sure, no problem. Of course, go ahead. I'd like to help, but… rifiutare con gentilezza I'm afraid I can't, because… Invitare / accettare / rifiutare Would you like to come to…? I'd love to, thanks! That sounds great! I'd love to, but I'm afraid I've already got plans. Lamentarsi con cortesia I'm afraid there's a problem with… I'm sorry to bother you, but… I'd like to make a complaint about… formale Would it be possible to…? chiedere una soluzione Consigliare If I were you, I'd… You should / You could… Have you thought about + -ing…? It's worth + -ing… vale la pena Congratularsi / consolare Congratulations! That's fantastic news! Well done, you deserve it. Oh no, I'm sorry to hear that. That must be really hard for you. Ringraziare e chiudere Thanks a lot, I really appreciate it. That's really kind of you. Let me know if you need anything. See you then! Errori da evitare Would you mind to lend me your car? Would you mind lending me your car? Would you mind + -ing. How about to go to the cinema? How about going to the cinema? How about + -ing. If I would be you, I would… If I were you, I'd… Nella frase con if: “were”, non “would be”. Timer di 2 minuti: per ogni gruppo di frasi qui sopra, inventa ad alta voce una frase completa su una situazione della tua scuola o della palestra di judo. Allenati adesso Avere in bocca, senza pensarci, 2–3 frasi per ogni funzione della Part 2."},{"id":"p2-apologise","n":"2.2","title":"Scusarsi e rassicurare","sub":"Ritardi, danni, dimenticanze","tags":["functions","work","manners"],"min":15,"day":4,"goal":"Scusarti in modo credibile (scusa + motivo + rimedio) e accettare le scuse degli altri.","blocks":[{"t":"phrases","h":"Frasi pronte","groups":[{"name":"Scusarsi bene: scusa + motivo + rimedio","items":[["I'm really sorry I'm late. The traffic was terrible.",""],["Let me make it up to you.","lascia che mi faccia perdonare"],["I'll pay for the repair, of course.",""]]},{"name":"Accettare le scuse","items":[["Honestly, don't worry about it.",""],["It could happen to anyone.",""],["Never mind, we can sort it out.",""]]}]},{"t":"dlg","h":"Role-play A · inizia l'esaminatore","ctx":"I'm your colleague. You borrowed my laptop charger yesterday and you've lost it. I'll start.","lines":[["Examiner","Hi! Have you still got my charger? I need it for the meeting this afternoon."],["You","Oh, I'm really sorry, I'm afraid I've lost it. I'm sure I left it in the lab, but it isn't there any more."],["Examiner","Oh no. That's a problem — my battery is almost dead."],["You","I feel terrible about it. Look, why don't you use my laptop for the meeting? And I'll buy you a new charger today, I promise."],["Examiner","Well, OK, that would help. Thanks."],["You","It's the least I can do. Again, I'm really sorry."]]},{"t":"dlg","h":"Role-play B · inizi tu","ctx":"I'm your friend. You were supposed to meet me for dinner last night, but you forgot. You start.","lines":[["You","Hi Marco, listen, I'm so sorry about last night. I completely forgot about our dinner."],["Examiner","Yes, I waited for half an hour at the restaurant!"],["You","I know, I feel awful. I had a really busy day at school and it went out of my head. Let me make it up to you — dinner's on me this weekend. How about Saturday?"],["Examiner","Hmm, Saturday could work."],["You","Great. I'll book the table this time, and I'll set a reminder on my phone!"]]},{"t":"fix","h":"Errori da evitare","items":[["Sorry for arriving late.","Sorry I'm late.","Più naturale e diretto nel parlato.","calque"],["I have forgotten our appointment yesterday.","I forgot our appointment yesterday.","“Yesterday” → past simple.","tense"]]},{"t":"task","html":"<p>Leggi la situazione, pensa 10 secondi, poi recita <em>entrambe<\/em> le parti ad alta voce (o chiedi a qualcuno di fare l'esaminatore). Ogni role-play dura circa 90 secondi.<\/p><ol><li>I'm your neighbour. Your dog has damaged my garden. I'll start.<\/li><li>You broke a friend's favourite mug when you were at their house. You start.<\/li><li>I'm your manager. You missed an important deadline. I'll start.<\/li><\/ol>","timer":90,"prep":10,"h":"Allenati adesso"}],"ch":"p2","_text":"Frasi pronte Scusarsi bene: scusa + motivo + rimedio I'm really sorry I'm late. The traffic was terrible. Let me make it up to you. lascia che mi faccia perdonare I'll pay for the repair, of course. Accettare le scuse Honestly, don't worry about it. It could happen to anyone. Never mind, we can sort it out. Role-play A · inizia l'esaminatore I'm your colleague. You borrowed my laptop charger yesterday and you've lost it. I'll start. Examiner Hi! Have you still got my charger? I need it for the meeting this afternoon. You Oh, I'm really sorry, I'm afraid I've lost it. I'm sure I left it in the lab, but it isn't there any more. Examiner Oh no. That's a problem — my battery is almost dead. You I feel terrible about it. Look, why don't you use my laptop for the meeting? And I'll buy you a new charger today, I promise. Examiner Well, OK, that would help. Thanks. You It's the least I can do. Again, I'm really sorry. Role-play B · inizi tu I'm your friend. You were supposed to meet me for dinner last night, but you forgot. You start. You Hi Marco, listen, I'm so sorry about last night. I completely forgot about our dinner. Examiner Yes, I waited for half an hour at the restaurant! You I know, I feel awful. I had a really busy day at school and it went out of my head. Let me make it up to you — dinner's on me this weekend. How about Saturday? Examiner Hmm, Saturday could work. You Great. I'll book the table this time, and I'll set a reminder on my phone! Errori da evitare Sorry for arriving late. Sorry I'm late. Più naturale e diretto nel parlato. calque I have forgotten our appointment yesterday. I forgot our appointment yesterday. “Yesterday” → past simple. tense Leggi la situazione, pensa 10 secondi, poi recita entrambe le parti ad alta voce (o chiedi a qualcuno di fare l'esaminatore). Ogni role-play dura circa 90 secondi. I'm your neighbour. Your dog has damaged my garden. I'll start. You broke a friend's favourite mug when you were at their house. You start. I'm your manager. You missed an important deadline. I'll start. Allenati adesso Scusarti in modo credibile (scusa + motivo + rimedio) e accettare le scuse degli altri."},{"id":"p2-invite","n":"2.3","title":"Invitare, accettare, rifiutare","sub":"Feste, uscite, eventi","tags":["functions","freetime","family"],"min":15,"day":4,"goal":"Invitare in modo concreto (quando, dove, cosa) e rifiutare senza sembrare scortese.","blocks":[{"t":"phrases","h":"Frasi pronte","groups":[{"name":"Invitare","items":[["I'm having a few friends over on Saturday. Would you like to come?",""],["Are you free on Friday evening?",""],["It'd be great if you could make it.",""]]},{"name":"Rifiutare con gentilezza","items":[["Thanks for asking, but I'm afraid I can't make it.",""],["I'd love to, but I've already promised…",""],["Can I take a rain check?","rimandiamo a un'altra volta"]]}]},{"t":"dlg","h":"Role-play A · inizia l'esaminatore","ctx":"I'm your colleague. I'm inviting you to my birthday party on Saturday. I'll start.","lines":[["Examiner","I'm having a birthday party on Saturday night at my place. Would you like to come?"],["You","Oh, thanks for inviting me! I'd love to, but I'm afraid I've got a judo competition on Saturday and I usually get home really late."],["Examiner","Oh, what a shame. Are you sure you can't come, even for an hour?"],["You","Well, maybe I could come by after the competition, around ten. Would that be too late?"],["Examiner","Not at all, the party won't finish before midnight!"],["You","Perfect, then I'll try. Shall I bring anything? Some drinks, maybe?"]]},{"t":"dlg","h":"Role-play B · inizi tu","ctx":"You want to invite a friend to watch a basketball match with you next week. You start.","lines":[["You","Hi Laura, are you free next Thursday evening? I've got two tickets for the basketball match in Trieste."],["Examiner","Oh, I'm not really into basketball…"],["You","I know, but the atmosphere is amazing, even if you don't follow the sport. We could have dinner in town before the match."],["Examiner","Dinner sounds good. What time would we leave?"],["You","Around six. I can pick you up, so you don't have to drive. What do you think?"],["Examiner","OK, why not? Count me in."]]},{"t":"task","html":"<p>Leggi la situazione, pensa 10 secondi, poi recita <em>entrambe<\/em> le parti ad alta voce (o chiedi a qualcuno di fare l'esaminatore). Ogni role-play dura circa 90 secondi.<\/p><ol><li>I'm your friend. I'm inviting you to go camping next weekend, but you hate camping. I'll start.<\/li><li>You want to invite your colleagues to a small dinner at your house to celebrate the end of the school year. You start.<\/li><li>I'm your cousin. I'm inviting you to my wedding, but it's the same day as your exam. I'll start.<\/li><\/ol>","timer":90,"prep":10,"h":"Allenati adesso"}],"ch":"p2","_text":"Frasi pronte Invitare I'm having a few friends over on Saturday. Would you like to come? Are you free on Friday evening? It'd be great if you could make it. Rifiutare con gentilezza Thanks for asking, but I'm afraid I can't make it. I'd love to, but I've already promised… Can I take a rain check? rimandiamo a un'altra volta Role-play A · inizia l'esaminatore I'm your colleague. I'm inviting you to my birthday party on Saturday. I'll start. Examiner I'm having a birthday party on Saturday night at my place. Would you like to come? You Oh, thanks for inviting me! I'd love to, but I'm afraid I've got a judo competition on Saturday and I usually get home really late. Examiner Oh, what a shame. Are you sure you can't come, even for an hour? You Well, maybe I could come by after the competition, around ten. Would that be too late? Examiner Not at all, the party won't finish before midnight! You Perfect, then I'll try. Shall I bring anything? Some drinks, maybe? Role-play B · inizi tu You want to invite a friend to watch a basketball match with you next week. You start. You Hi Laura, are you free next Thursday evening? I've got two tickets for the basketball match in Trieste. Examiner Oh, I'm not really into basketball… You I know, but the atmosphere is amazing, even if you don't follow the sport. We could have dinner in town before the match. Examiner Dinner sounds good. What time would we leave? You Around six. I can pick you up, so you don't have to drive. What do you think? Examiner OK, why not? Count me in. Leggi la situazione, pensa 10 secondi, poi recita entrambe le parti ad alta voce (o chiedi a qualcuno di fare l'esaminatore). Ogni role-play dura circa 90 secondi. I'm your friend. I'm inviting you to go camping next weekend, but you hate camping. I'll start. You want to invite your colleagues to a small dinner at your house to celebrate the end of the school year. You start. I'm your cousin. I'm inviting you to my wedding, but it's the same day as your exam. I'll start. Allenati adesso Invitare in modo concreto (quando, dove, cosa) e rifiutare senza sembrare scortese."},{"id":"p2-complain","n":"2.4","title":"Lamentarsi con cortesia","sub":"Ristoranti, hotel, vicini, negozi","tags":["functions","shopping","home"],"min":15,"day":5,"goal":"Lamentarsi in modo fermo ma educato e chiedere una soluzione concreta.","blocks":[{"t":"phrases","h":"Frasi pronte","groups":[{"name":"Aprire il reclamo","items":[["Excuse me, I'm sorry to bother you, but…",""],["I'm afraid there's a problem with my room.",""],["I'm not very happy with…",""]]},{"name":"Chiedere una soluzione","items":[["Would it be possible to change it?",""],["Could you do something about it, please?",""],["I'd like a refund, please.","rimborso"],["I'd appreciate it if you could…",""]]}]},{"t":"dlg","h":"Role-play A · inizia l'esaminatore","ctx":"I'm a hotel receptionist. You're a guest and you come to reception. I'll start.","lines":[["Examiner","Good evening. How can I help you?"],["You","Good evening. I'm sorry to bother you, but I'm afraid there's a problem with my room. The air conditioning isn't working and it's really hot."],["Examiner","Oh, I'm sorry about that. I can send someone to look at it tomorrow morning."],["You","Tomorrow morning? I'm afraid that's a bit late — I won't be able to sleep tonight. Would it be possible to move to another room?"],["Examiner","Let me check… Yes, we have a room on the third floor."],["You","That would be great, thank you. I really appreciate it."]]},{"t":"dlg","h":"Role-play B · inizi tu","ctx":"Your neighbour plays loud music every night until very late. You start.","lines":[["You","Hi, sorry to bother you. Have you got a minute? It's about the music in the evening."],["Examiner","Oh, is it too loud?"],["You","Well, a little. It's fine during the day, but I have to get up at six for work, and at midnight it's still quite loud."],["Examiner","I'm sorry, I didn't realise you could hear it so well."],["You","Don't worry, I'm sure you didn't mean to. Would it be possible to turn it down after eleven, maybe?"],["Examiner","Of course, no problem."],["You","Thanks a lot, I really appreciate it."]]},{"t":"fix","h":"Errori da evitare","items":[["I want to speak with the responsible.","I'd like to speak to the manager, please.","“Il responsabile” = the manager / the person in charge.","calque"],["The air conditioner doesn't work since yesterday.","The air conditioning hasn't worked since yesterday.","Da ieri fino ad ora → present perfect.","tense"]]},{"t":"task","html":"<p>Leggi la situazione, pensa 10 secondi, poi recita <em>entrambe<\/em> le parti ad alta voce (o chiedi a qualcuno di fare l'esaminatore). Ogni role-play dura circa 90 secondi.<\/p><ol><li>I'm a waiter. You ordered a vegetarian dish, but it has meat in it. I'll start.<\/li><li>You bought a pair of headphones last week and one side has stopped working. You go back to the shop. You start.<\/li><li>I'm your flatmate. I never clean the kitchen. You start.<\/li><\/ol>","timer":90,"prep":10,"h":"Allenati adesso"}],"ch":"p2","_text":"Frasi pronte Aprire il reclamo Excuse me, I'm sorry to bother you, but… I'm afraid there's a problem with my room. I'm not very happy with… Chiedere una soluzione Would it be possible to change it? Could you do something about it, please? I'd like a refund, please. rimborso I'd appreciate it if you could… Role-play A · inizia l'esaminatore I'm a hotel receptionist. You're a guest and you come to reception. I'll start. Examiner Good evening. How can I help you? You Good evening. I'm sorry to bother you, but I'm afraid there's a problem with my room. The air conditioning isn't working and it's really hot. Examiner Oh, I'm sorry about that. I can send someone to look at it tomorrow morning. You Tomorrow morning? I'm afraid that's a bit late — I won't be able to sleep tonight. Would it be possible to move to another room? Examiner Let me check… Yes, we have a room on the third floor. You That would be great, thank you. I really appreciate it. Role-play B · inizi tu Your neighbour plays loud music every night until very late. You start. You Hi, sorry to bother you. Have you got a minute? It's about the music in the evening. Examiner Oh, is it too loud? You Well, a little. It's fine during the day, but I have to get up at six for work, and at midnight it's still quite loud. Examiner I'm sorry, I didn't realise you could hear it so well. You Don't worry, I'm sure you didn't mean to. Would it be possible to turn it down after eleven, maybe? Examiner Of course, no problem. You Thanks a lot, I really appreciate it. Errori da evitare I want to speak with the responsible. I'd like to speak to the manager, please. “Il responsabile” = the manager / the person in charge. calque The air conditioner doesn't work since yesterday. The air conditioning hasn't worked since yesterday. Da ieri fino ad ora → present perfect. tense Leggi la situazione, pensa 10 secondi, poi recita entrambe le parti ad alta voce (o chiedi a qualcuno di fare l'esaminatore). Ogni role-play dura circa 90 secondi. I'm a waiter. You ordered a vegetarian dish, but it has meat in it. I'll start. You bought a pair of headphones last week and one side has stopped working. You go back to the shop. You start. I'm your flatmate. I never clean the kitchen. You start. Allenati adesso Lamentarsi in modo fermo ma educato e chiedere una soluzione concreta."},{"id":"p2-request","n":"2.5","title":"Chiedere favori e permessi","sub":"Prestiti, cambi di turno, aiuti","tags":["functions","work","family"],"min":15,"day":5,"goal":"Chiedere qualcosa con le forme più cortesi e dare un motivo convincente.","blocks":[{"t":"phrases","h":"Frasi pronte","groups":[{"name":"Chiedere","items":[["I was wondering if you could help me with something.",""],["Would you mind swapping shifts with me on Friday?",""],["Is there any chance I could borrow your car?",""]]},{"name":"Offrire qualcosa in cambio","items":[["I'd be happy to do the same for you.",""],["I owe you one!","ti devo un favore"],["I'll return it by Sunday, I promise.",""]]}]},{"t":"dlg","h":"Role-play A · inizia l'esaminatore","ctx":"I'm your neighbour. You are going on holiday and you need someone to water your plants. You start.","lines":[["You","Hi, Anna. I was wondering if you could do me a favour."],["Examiner","Sure, what is it?"],["You","I'm going on holiday next week, and I need someone to water my plants. Would you mind doing it, maybe every two or three days?"],["Examiner","How long are you going to be away?"],["You","Just ten days. I can leave you the keys on Sunday. And of course I'd be happy to do the same for you when you go away."],["Examiner","No problem, I'll do it."],["You","Thanks so much, I owe you one!"]]},{"t":"dlg","h":"Role-play B · inizi tu","ctx":"I'm your colleague. I need you to cover my lesson tomorrow. I'll start.","lines":[["Examiner","Hi, sorry, I need a big favour. Could you cover my lesson tomorrow at ten? I have a medical appointment."],["You","Tomorrow at ten… Let me check. I've got a free hour then, so yes, I think I can do it."],["Examiner","Oh, thank you so much."],["You","No problem. What class is it? And have you prepared something for them to do?"],["Examiner","It's 3B. I'll leave some exercises on the desk."],["You","Perfect. Just send me a message with the page numbers, so I'm ready."]]},{"t":"task","html":"<p>Leggi la situazione, pensa 10 secondi, poi recita <em>entrambe<\/em> le parti ad alta voce (o chiedi a qualcuno di fare l'esaminatore). Ogni role-play dura circa 90 secondi.<\/p><ol><li>You need to borrow a friend's car for the weekend because yours is at the mechanic's. You start.<\/li><li>I'm your colleague. I'm asking you to lend me some money for lunch. I'll start.<\/li><li>You want to leave work an hour early on Friday. Ask your head teacher. You start.<\/li><\/ol>","timer":90,"prep":10,"h":"Allenati adesso"}],"ch":"p2","_text":"Frasi pronte Chiedere I was wondering if you could help me with something. Would you mind swapping shifts with me on Friday? Is there any chance I could borrow your car? Offrire qualcosa in cambio I'd be happy to do the same for you. I owe you one! ti devo un favore I'll return it by Sunday, I promise. Role-play A · inizia l'esaminatore I'm your neighbour. You are going on holiday and you need someone to water your plants. You start. You Hi, Anna. I was wondering if you could do me a favour. Examiner Sure, what is it? You I'm going on holiday next week, and I need someone to water my plants. Would you mind doing it, maybe every two or three days? Examiner How long are you going to be away? You Just ten days. I can leave you the keys on Sunday. And of course I'd be happy to do the same for you when you go away. Examiner No problem, I'll do it. You Thanks so much, I owe you one! Role-play B · inizi tu I'm your colleague. I need you to cover my lesson tomorrow. I'll start. Examiner Hi, sorry, I need a big favour. Could you cover my lesson tomorrow at ten? I have a medical appointment. You Tomorrow at ten… Let me check. I've got a free hour then, so yes, I think I can do it. Examiner Oh, thank you so much. You No problem. What class is it? And have you prepared something for them to do? Examiner It's 3B. I'll leave some exercises on the desk. You Perfect. Just send me a message with the page numbers, so I'm ready. Leggi la situazione, pensa 10 secondi, poi recita entrambe le parti ad alta voce (o chiedi a qualcuno di fare l'esaminatore). Ogni role-play dura circa 90 secondi. You need to borrow a friend's car for the weekend because yours is at the mechanic's. You start. I'm your colleague. I'm asking you to lend me some money for lunch. I'll start. You want to leave work an hour early on Friday. Ask your head teacher. You start. Allenati adesso Chiedere qualcosa con le forme più cortesi e dare un motivo convincente."},{"id":"p2-advice","n":"2.6","title":"Dare consigli e suggerire","sub":"Amici in difficoltà, decisioni","tags":["functions","education","health"],"min":15,"day":6,"goal":"Ascoltare il problema, mostrare empatia e dare 2 consigli concreti.","blocks":[{"t":"phrases","h":"Frasi pronte","groups":[{"name":"Mostrare empatia","items":[["That sounds really stressful.",""],["I know how you feel.",""],["I can see why you're worried.",""]]},{"name":"Consigliare","items":[["If I were you, I'd talk to him directly.",""],["Have you thought about asking for help?",""],["Maybe you could try…","morbido"],["It might be worth + -ing…",""]]}]},{"t":"dlg","h":"Role-play A · inizia l'esaminatore","ctx":"I'm your friend. I have an important exam next week and I'm really stressed. I'll start.","lines":[["Examiner","I've got my exam next week and I'm so stressed. I can't sleep and I can't concentrate."],["You","Oh, I know how you feel — I'm preparing for an exam too! Have you made a study plan?"],["Examiner","Not really, I just study whatever I can."],["You","If I were you, I'd write a plan for each day, with short breaks. It really helps. And maybe you could go for a walk or a run in the evening, to clear your mind."],["Examiner","That's a good idea. I haven't done any exercise for weeks."],["You","Try it, I'm sure you'll sleep better. And let me know if you want to study together one evening."]]},{"t":"dlg","h":"Role-play B · inizi tu","ctx":"Your friend can't decide whether to accept a job in another city. You start.","lines":[["You","So, have you decided about the job in Milan?"],["Examiner","No, I still don't know. The salary is much better, but my family is here."],["You","I can see why it's a difficult decision. Have you thought about asking them if you could work from home some days?"],["Examiner","No, I haven't. That's an interesting idea."],["You","It might be worth asking. That way you could spend long weekends here. Why don't you write down the pros and cons, too?"]]},{"t":"fix","h":"Errori da evitare","items":[["I suggest you to talk to him.","I suggest (that) you talk to him. / I suggest talking to him.","Suggest non vuole “you to”.","calque"],["You should to rest.","You should rest.","Dopo should: verbo base, senza “to”.",""]]},{"t":"task","html":"<p>Leggi la situazione, pensa 10 secondi, poi recita <em>entrambe<\/em> le parti ad alta voce (o chiedi a qualcuno di fare l'esaminatore). Ogni role-play dura circa 90 secondi.<\/p><ol><li>I'm your colleague. I want to get fit but I never have time. I'll start.<\/li><li>Your friend's teenage son spends all day playing video games. Give some advice. You start.<\/li><li>I'm your friend. I want to learn English but I don't know how to start. I'll start.<\/li><\/ol>","timer":90,"prep":10,"h":"Allenati adesso"}],"ch":"p2","_text":"Frasi pronte Mostrare empatia That sounds really stressful. I know how you feel. I can see why you're worried. Consigliare If I were you, I'd talk to him directly. Have you thought about asking for help? Maybe you could try… morbido It might be worth + -ing… Role-play A · inizia l'esaminatore I'm your friend. I have an important exam next week and I'm really stressed. I'll start. Examiner I've got my exam next week and I'm so stressed. I can't sleep and I can't concentrate. You Oh, I know how you feel — I'm preparing for an exam too! Have you made a study plan? Examiner Not really, I just study whatever I can. You If I were you, I'd write a plan for each day, with short breaks. It really helps. And maybe you could go for a walk or a run in the evening, to clear your mind. Examiner That's a good idea. I haven't done any exercise for weeks. You Try it, I'm sure you'll sleep better. And let me know if you want to study together one evening. Role-play B · inizi tu Your friend can't decide whether to accept a job in another city. You start. You So, have you decided about the job in Milan? Examiner No, I still don't know. The salary is much better, but my family is here. You I can see why it's a difficult decision. Have you thought about asking them if you could work from home some days? Examiner No, I haven't. That's an interesting idea. You It might be worth asking. That way you could spend long weekends here. Why don't you write down the pros and cons, too? Errori da evitare I suggest you to talk to him. I suggest (that) you talk to him. / I suggest talking to him. Suggest non vuole “you to”. calque You should to rest. You should rest. Dopo should: verbo base, senza “to”. Leggi la situazione, pensa 10 secondi, poi recita entrambe le parti ad alta voce (o chiedi a qualcuno di fare l'esaminatore). Ogni role-play dura circa 90 secondi. I'm your colleague. I want to get fit but I never have time. I'll start. Your friend's teenage son spends all day playing video games. Give some advice. You start. I'm your friend. I want to learn English but I don't know how to start. I'll start. Allenati adesso Ascoltare il problema, mostrare empatia e dare 2 consigli concreti."},{"id":"p2-feelings","n":"2.7","title":"Congratularsi e consolare","sub":"Buone e cattive notizie","tags":["functions","family","work"],"min":15,"day":7,"goal":"Reagire con l'emozione giusta e fare una domanda di interesse.","blocks":[{"t":"phrases","h":"Frasi pronte","groups":[{"name":"Buone notizie","items":[["That's brilliant news! Congratulations!",""],["You must be so pleased!",""],["Well done — you really deserve it.",""],["We should celebrate!",""]]},{"name":"Cattive notizie","items":[["Oh no, I'm so sorry to hear that.",""],["That's such a shame.",""],["Is there anything I can do?",""],["Try not to worry too much.",""]]}]},{"t":"dlg","h":"Role-play A · inizia l'esaminatore","ctx":"I'm your friend. I've just passed my driving test. I'll start.","lines":[["Examiner","Guess what? I passed my driving test this morning!"],["You","That's brilliant news! Congratulations! You must be so pleased. Was it difficult?"],["Examiner","A bit. I was really nervous at the beginning."],["You","Well, you did it, that's what matters. Are you going to buy a car now?"],["Examiner","I hope so, a small second-hand one."],["You","Great! We should celebrate — let's go out for a pizza this weekend. You can drive!"]]},{"t":"dlg","h":"Role-play B · inizi tu","ctx":"Your colleague didn't get the promotion they were hoping for. You start.","lines":[["You","Hi, I heard about the promotion. I'm really sorry, I know how much you wanted it."],["Examiner","Thanks. I'm quite disappointed, to be honest."],["You","Of course you are. It's such a shame, because everyone knows how hard you work."],["Examiner","Maybe next year."],["You","I'm sure there'll be other chances. And if you want to talk about it over a coffee, just let me know."]]},{"t":"fix","h":"Errori da evitare","items":[["I'm happy for you have passed.","I'm really happy you passed!","Struttura semplice: happy + frase.",""],["I'm sorry for your cat.","I'm sorry to hear about your cat.","“Sorry to hear about” è l'espressione naturale.","prep"]]},{"t":"task","html":"<p>Leggi la situazione, pensa 10 secondi, poi recita <em>entrambe<\/em> le parti ad alta voce (o chiedi a qualcuno di fare l'esaminatore). Ogni role-play dura circa 90 secondi.<\/p><ol><li>I'm your friend. My cat is very ill. I'll start.<\/li><li>Your colleague has just become a grandfather. You start.<\/li><li>I'm your cousin. I didn't get into the university I wanted. I'll start.<\/li><\/ol>","timer":90,"prep":10,"h":"Allenati adesso"}],"ch":"p2","_text":"Frasi pronte Buone notizie That's brilliant news! Congratulations! You must be so pleased! Well done — you really deserve it. We should celebrate! Cattive notizie Oh no, I'm so sorry to hear that. That's such a shame. Is there anything I can do? Try not to worry too much. Role-play A · inizia l'esaminatore I'm your friend. I've just passed my driving test. I'll start. Examiner Guess what? I passed my driving test this morning! You That's brilliant news! Congratulations! You must be so pleased. Was it difficult? Examiner A bit. I was really nervous at the beginning. You Well, you did it, that's what matters. Are you going to buy a car now? Examiner I hope so, a small second-hand one. You Great! We should celebrate — let's go out for a pizza this weekend. You can drive! Role-play B · inizi tu Your colleague didn't get the promotion they were hoping for. You start. You Hi, I heard about the promotion. I'm really sorry, I know how much you wanted it. Examiner Thanks. I'm quite disappointed, to be honest. You Of course you are. It's such a shame, because everyone knows how hard you work. Examiner Maybe next year. You I'm sure there'll be other chances. And if you want to talk about it over a coffee, just let me know. Errori da evitare I'm happy for you have passed. I'm really happy you passed! Struttura semplice: happy + frase. I'm sorry for your cat. I'm sorry to hear about your cat. “Sorry to hear about” è l'espressione naturale. prep Leggi la situazione, pensa 10 secondi, poi recita entrambe le parti ad alta voce (o chiedi a qualcuno di fare l'esaminatore). Ogni role-play dura circa 90 secondi. I'm your friend. My cat is very ill. I'll start. Your colleague has just become a grandfather. You start. I'm your cousin. I didn't get into the university I wanted. I'll start. Allenati adesso Reagire con l'emozione giusta e fare una domanda di interesse."},{"id":"p2-plans","n":"2.8","title":"Organizzare e cambiare programmi","sub":"Appuntamenti, spostamenti, disdette","tags":["functions","events","freetime"],"min":15,"day":10,"goal":"Fissare, spostare o annullare un impegno proponendo un'alternativa concreta.","blocks":[{"t":"phrases","h":"Frasi pronte","groups":[{"name":"Fissare","items":[["What time suits you?",""],["Shall we say seven o'clock?",""],["Let's meet outside the station.",""]]},{"name":"Spostare / annullare","items":[["I'm afraid something's come up.","è saltato fuori un imprevisto"],["Would it be OK if we met on Thursday instead?",""],["Could we move it to next week?",""],["I'll have to cancel, I'm really sorry.",""]]}]},{"t":"dlg","h":"Role-play A · inizia l'esaminatore","ctx":"I'm your friend. We planned to go to the cinema tonight, but I want to change the plan. I'll start.","lines":[["Examiner","Hi, listen, about tonight — would you mind if we didn't go to the cinema? I'm really tired."],["You","No, of course not. Is everything OK?"],["Examiner","Yes, it's just been a long week."],["You","I understand. How about staying in and watching a film at your place instead? I could bring a pizza."],["Examiner","That sounds perfect."],["You","Great. Shall we say eight o'clock? Then you can relax a bit first."]]},{"t":"dlg","h":"Role-play B · inizi tu","ctx":"You arranged to have lunch with a colleague tomorrow, but you have a meeting. You start.","lines":[["You","Hi Paolo, I'm afraid something's come up for tomorrow. The head teacher has called a meeting at lunchtime."],["Examiner","Oh, never mind. These things happen."],["You","Thanks for understanding. Would it be OK if we had lunch on Thursday instead? Same place?"],["Examiner","Thursday's fine for me."],["You","Great, I'll book a table for one o'clock. See you then!"]]},{"t":"fix","h":"Errori da evitare","items":[["We can see us at seven?","Shall we meet at seven? / Can we meet at seven?","“Vederci” = meet. Niente “see us”.","calque"],["I have an appointment with the dentist tomorrow at 3.","I've got a dentist's appointment at 3 tomorrow.","“Dentist's appointment” è la forma naturale.","vocab"]]},{"t":"task","html":"<p>Leggi la situazione, pensa 10 secondi, poi recita <em>entrambe<\/em> le parti ad alta voce (o chiedi a qualcuno di fare l'esaminatore). Ogni role-play dura circa 90 secondi.<\/p><ol><li>I'm your friend. We are organising a trip to the mountains. Decide when and where to meet. I'll start.<\/li><li>You have to cancel a dentist's appointment. Phone the receptionist. You start.<\/li><li>I'm your colleague. I want to move our project meeting to next week. I'll start.<\/li><\/ol>","timer":90,"prep":10,"h":"Allenati adesso"}],"ch":"p2","_text":"Frasi pronte Fissare What time suits you? Shall we say seven o'clock? Let's meet outside the station. Spostare / annullare I'm afraid something's come up. è saltato fuori un imprevisto Would it be OK if we met on Thursday instead? Could we move it to next week? I'll have to cancel, I'm really sorry. Role-play A · inizia l'esaminatore I'm your friend. We planned to go to the cinema tonight, but I want to change the plan. I'll start. Examiner Hi, listen, about tonight — would you mind if we didn't go to the cinema? I'm really tired. You No, of course not. Is everything OK? Examiner Yes, it's just been a long week. You I understand. How about staying in and watching a film at your place instead? I could bring a pizza. Examiner That sounds perfect. You Great. Shall we say eight o'clock? Then you can relax a bit first. Role-play B · inizi tu You arranged to have lunch with a colleague tomorrow, but you have a meeting. You start. You Hi Paolo, I'm afraid something's come up for tomorrow. The head teacher has called a meeting at lunchtime. Examiner Oh, never mind. These things happen. You Thanks for understanding. Would it be OK if we had lunch on Thursday instead? Same place? Examiner Thursday's fine for me. You Great, I'll book a table for one o'clock. See you then! Errori da evitare We can see us at seven? Shall we meet at seven? / Can we meet at seven? “Vederci” = meet. Niente “see us”. calque I have an appointment with the dentist tomorrow at 3. I've got a dentist's appointment at 3 tomorrow. “Dentist's appointment” è la forma naturale. vocab Leggi la situazione, pensa 10 secondi, poi recita entrambe le parti ad alta voce (o chiedi a qualcuno di fare l'esaminatore). Ogni role-play dura circa 90 secondi. I'm your friend. We are organising a trip to the mountains. Decide when and where to meet. I'll start. You have to cancel a dentist's appointment. Phone the receptionist. You start. I'm your colleague. I want to move our project meeting to next week. I'll start. Allenati adesso Fissare, spostare o annullare un impegno proponendo un'alternativa concreta."},{"id":"p2-info","n":"2.9","title":"Chiedere informazioni","sub":"Palestra, corsi, stazione, servizi","tags":["functions","town","travel","phone"],"min":15,"day":11,"goal":"Fare domande indirette e cortesi e chiedere chiarimenti.","blocks":[{"t":"phrases","h":"Frasi pronte","groups":[{"name":"Domande indirette (più cortesi)","items":[["Could you tell me wh
