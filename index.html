<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B2 Speaking Lab</title>
<meta name="description" content="Lezioni per l'esame LanguageCert / EISOL Communicator B2 Speaking, divise per capitolo, argomento e tempo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme: light;
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#E8ECF2; --line:#D3DAE4;
  --ink:#172233; --muted:#566377; --accent:#1F4E8C; --accent-ink:#FFFFFF;
  --p0:#4A5568; --p1:#1F6FD1; --p2:#C77800; --p3:#1C8A5A; --p4:#C2413B; --p5:#7A4CC2; --p6:#2E3B4E;
  --good:#1C8A5A; --bad:#B8322C; --bad-bg:#FBECEA; --good-bg:#E6F4EC;
  --timer:#E0A100;
  --radius:10px;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#10151D; --surface:#171E29; --surface-2:#1F2835; --line:#2C3746;
    --ink:#E6EBF2; --muted:#9AA7B8; --accent:#7FB0F0; --accent-ink:#0E1520;
    --p0:#9AA7B8; --p1:#6FA8F2; --p2:#F0B04A; --p3:#4FC48D; --p4:#F07C74; --p5:#B393F0; --p6:#A9B6C8;
    --good:#4FC48D; --bad:#F07C74; --bad-bg:#3A1F1F; --good-bg:#16301F; --timer:#F0B04A;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#10151D; --surface:#171E29; --surface-2:#1F2835; --line:#2C3746;
  --ink:#E6EBF2; --muted:#9AA7B8; --accent:#7FB0F0; --accent-ink:#0E1520;
  --p0:#9AA7B8; --p1:#6FA8F2; --p2:#F0B04A; --p3:#4FC48D; --p4:#F07C74; --p5:#B393F0; --p6:#A9B6C8;
  --good:#4FC48D; --bad:#F07C74; --bad-bg:#3A1F1F; --good-bg:#16301F; --timer:#F0B04A;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink);margin-right:auto}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.brand span{font-size:.8rem;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:3px;border-radius:999px}
.tabs a{padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{flex:1 1 200px;max-width:280px;position:relative}
.search input{width:100%;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:inherit;font-size:.9rem}

main{padding-block:28px 64px}
@media (max-width:640px){.top{position:static}}

/* hero / exam strip */
.hero{display:grid;gap:18px;margin-bottom:34px}
.hero h1{font-size:clamp(1.9rem,4.2vw,2.8rem);font-weight:800;letter-spacing:-.02em}
.hero p{margin:0;max-width:62ch;color:var(--muted)}
.strip{display:grid;grid-template-columns:3fr 3fr 3.5fr 4fr;gap:4px;border-radius:var(--radius);overflow:hidden}
.strip a{display:block;padding:10px 12px;color:#fff;text-decoration:none;min-width:0}
.strip a small{display:block;font-family:var(--f-mono);font-size:.72rem;opacity:.9}
.strip a strong{font-family:var(--f-display);font-size:1rem}
.strip a span{display:block;font-size:.78rem;opacity:.92;line-height:1.3}
.s1{background:#1F6FD1}.s2{background:#B86E00}.s3{background:#1C7C51}.s4{background:#B23A35}
.strip-legend{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
@media (max-width:640px){.strip{grid-template-columns:1fr 1fr}}

.progress-line{display:flex;align-items:center;gap:12px;font-size:.9rem;color:var(--muted)}
.bar{flex:1;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;max-width:320px}
.bar i{display:block;height:100%;background:var(--good);width:0}

/* chapter list */
.chapters{display:grid;gap:30px}
.chapter{display:grid;grid-template-columns:220px 1fr;gap:18px;padding-top:20px;border-top:1px solid var(--line)}
@media (max-width:760px){.chapter{grid-template-columns:1fr}}
.ch-head .num{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.ch-head h2{font-size:1.45rem;margin:4px 0 6px}
.ch-head p{margin:0;font-size:.9rem;color:var(--muted)}
.ch-head .count{margin-top:8px;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;align-content:start}
.lcard{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:start;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;color:var(--ink);border-left:4px solid var(--c)}
.lcard:hover{border-color:var(--c)}
.lcard .n{font-family:var(--f-mono);font-size:.78rem;color:var(--c);padding-top:2px}
.lcard .t{font-weight:700;line-height:1.3}
.lcard .m{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);white-space:nowrap;padding-top:2px}
.lcard .d{grid-column:2 / 4;font-size:.84rem;color:var(--muted);line-height:1.35}
.lcard.done{background:var(--good-bg)}
.lcard.done .n::after{content:" ✓";color:var(--good)}

/* topics */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:.9rem}
.chip b{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);font-weight:500}
.chip[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-current="true"] b{color:var(--bg)}
.group-title{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.section-h{font-size:1.5rem;margin:30px 0 12px}

/* time */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.day header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.day h3{font-size:1.05rem}
.day .tot{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap}
.day p{margin:0 0 8px;font-size:.85rem;color:var(--muted)}
.day ol{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.day li a{display:grid;grid-template-columns:auto 1fr auto;gap:8px;text-decoration:none;color:var(--ink);font-size:.92rem;padding:4px 6px;border-radius:6px}
.day li a:hover{background:var(--surface-2)}
.day li .n{font-family:var(--f-mono);font-size:.75rem;color:var(--c);padding-top:3px}
.day li .m{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);padding-top:3px}
.day li.done a{color:var(--muted);text-decoration:line-through}
.buckets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.buckets button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.9rem}
.buckets button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* lesson */
.lesson{max-width:760px;margin:0 auto}
.crumbs{font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{color:var(--muted)}
.lhead{margin:10px 0 22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.lhead .num{font-family:var(--f-mono);font-size:.8rem;color:var(--c);letter-spacing:.06em}
.lhead h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800;letter-spacing:-.015em;margin:4px 0 8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted);align-items:center}
.meta .pill{font-family:var(--f-mono);font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink)}
.meta a.pill{text-decoration:none}
.goal{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--radius);padding:12px 16px;margin:0 0 26px}
.goal b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--c);display:block}
.blk{margin:0 0 30px}
.blk > h2{font-size:1.25rem;margin-bottom:10px}
.blk p{margin:0 0 10px}
.blk ul.plain{margin:0;padding-left:1.2em}
.blk ul.plain li{margin:3px 0}
.note{font-size:.9rem;color:var(--muted)}

.qa{display:grid;gap:8px}
.qa details{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.qa summary{cursor:pointer;padding:11px 14px;font-weight:700;list-style:none;display:flex;gap:10px;align-items:flex-start}
.qa summary::-webkit-details-marker{display:none}
.qa summary::before{content:"Q";font-family:var(--f-mono);font-size:.75rem;color:var(--c);padding-top:3px}
.qa summary .hint{margin-left:auto;font-family:var(--f-mono);font-size:.7rem;color:var(--muted);font-weight:500;white-space:nowrap;padding-top:3px}
.qa details[open] summary .hint{visibility:hidden}
.qa .ans{padding:0 14px 12px 36px}
.qa .ans p{margin:0 0 6px}
.qa .ans .tip{font-size:.85rem;color:var(--muted)}

.say{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:1px 9px;font-size:.75rem;cursor:pointer;color:var(--muted);vertical-align:middle}
.say:hover{color:var(--ink)}
.no-tts .say{display:none}

.phr{display:grid;gap:14px}
.phr h3{font-size:.95rem;font-family:var(--f-mono);font-weight:700;letter-spacing:.02em;color:var(--c);text-transform:uppercase;margin-bottom:6px}
.phr ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.phr li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.phr li .en{font-weight:700}
.phr li .it{font-size:.84rem;color:var(--muted)}
.phr li .say{margin-left:auto}

.fix{display:grid;gap:8px}
.fix .row{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;display:grid;gap:3px}
.fix .w{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.fix .w::before{content:"✗ ";text-decoration:none;display:inline-block}
.fix .r{color:var(--good);font-weight:700}
.fix .r::before{content:"✓ "}
.fix .why{font-size:.86rem;color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:.68rem;padding:1px 6px;border-radius:4px;background:var(--bad-bg);color:var(--bad);margin-left:6px;white-space:nowrap}

.vocab{width:100%;border-collapse:collapse;font-size:.93rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.vocab td{padding:6px 12px;border-top:1px solid var(--line);vertical-align:top}
.vocab tr:first-child td{border-top:0}
.vocab td:first-child{font-weight:700;width:48%}
.vocab td:last-child{color:var(--muted)}

.dlg{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:grid;gap:6px}
.dlg .line{display:grid;grid-template-columns:92px 1fr;gap:10px}
.dlg .who{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);padding-top:3px;text-transform:uppercase;letter-spacing:.04em}
.dlg .line.you .who{color:var(--c);font-weight:700}
.dlg .ctx{font-size:.88rem;color:var(--muted);font-style:italic;margin-bottom:4px}
@media (max-width:520px){.dlg .line{grid-template-columns:1fr;gap:0}}

.card-task{background:var(--surface);border:2px dashed var(--line);border-radius:var(--radius);padding:14px 16px}
.card-task .lbl{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px}
.timer .clock{font-family:var(--f-mono);font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums;min-width:4.5ch}
.timer .phase{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.timer .tbar{flex:1 1 140px;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.timer .tbar i{display:block;height:100%;width:0;background:var(--timer);transition:width .25s linear}
.timer.prep .tbar i{background:var(--muted)}
.timer.over .clock{color:var(--bad)}
.btn{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:700;font-size:.9rem}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.split{grid-template-columns:1fr}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.sheet h3{font-size:.8rem;font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.sheet ul{margin:0;padding-left:1.1em}

.mono-model{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.mono-model p{margin:0 0 8px}
.mono-model mark{background:color-mix(in srgb,var(--c) 18%,transparent);color:inherit;padding:0 2px;border-radius:3px}
details.reveal{margin-top:8px}
details.reveal > summary{cursor:pointer;font-weight:700;color:var(--accent);padding:4px 0}

.lfoot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.lfoot .nav{display:flex;gap:8px;flex-wrap:wrap}
.lfoot a.btn{text-decoration:none;color:var(--ink)}
.empty{color:var(--muted)}
footer.site{border-top:1px solid var(--line);padding-block:18px;font-size:.82rem;color:var(--muted)}
/* feedback */
.fb{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:8px}
.fb label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fb textarea{width:100%;min-height:96px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.95rem;line-height:1.5}
.fb .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fb .hint{font-size:.8rem;color:var(--muted)}
.fb-out{display:grid;gap:10px}
.fb-out:empty{display:none}
.fb-out .status{font-size:.9rem;color:var(--muted);margin:0}
.fb-card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:12px}
.fb-card p{margin:0}
.fb-card h4{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:4px}
.fb-card .lvl{display:inline-block;font-family:var(--f-mono);font-weight:700;padding:2px 10px;border-radius:99px;background:var(--ink);color:var(--bg)}
.fb-card .focus{border-left:3px solid var(--c);padding-left:10px}
.fb-card .fix .row{background:var(--surface);display:grid}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#capitoli"><b>B2 Speaking Lab</b><span>LanguageCert · EISOL</span></a>
    <nav class="tabs" aria-label="Viste">
      <a href="#capitoli" data-view="capitoli">Capitoli</a>
      <a href="#argomenti" data-view="argomenti">Argomenti</a>
      <a href="#tempo" data-view="tempo">Tempo</a>
    </nav>
    <div class="search"><input id="q" type="search" placeholder="Cerca lezioni, frasi, temi…" aria-label="Cerca"></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer class="site"><div class="wrap">Materiale di studio per LanguageCert Communicator B2 (Speaking). Spiegazioni in italiano, esercizi e modelli in inglese. I progressi si salvano solo su questo browser.</div></footer>

<script>
const DATA = {"chapters":[{"id":"c0","label":"Capitolo 0","color":"p0","title":"Si parte da qui","desc":"Com'è fatto l'esame, come viene valutato e la strategia per il terzo tentativo."},{"id":"p1","label":"Capitolo 1 · Part 1","color":"p1","title":"Domande personali","desc":"Rispondere subito e bene su temi di vita quotidiana: risposta + motivo + esempio."},{"id":"p2","label":"Capitolo 2 · Part 2","color":"p2","title":"Role-play sociali","desc":"Frasi funzionali e situazioni: quando inizi tu e quando reagisci all'esaminatore."},{"id":"p3","label":"Capitolo 3 · Part 3","color":"p3","title":"Discussione e negoziazione","desc":"Confrontare idee diverse, trovare un compromesso e arrivare a una decisione."},{"id":"p4","label":"Capitolo 4 · Part 4","color":"p4","title":"Monologo di 2 minuti","desc":"Appunti in 30 secondi, una storia semplice e ben strutturata, poi le domande."},{"id":"gr","label":"Capitolo 5","color":"p5","title":"Grammatica per parlare","desc":"Solo gli errori che ti sono costati l'esame: tempi, articoli, preposizioni, calchi, connettori."},{"id":"mk","label":"Capitolo 6","color":"p6","title":"Simulazioni complete","desc":"Tre prove d'esame intere da 13 minuti, con autovalutazione finale."}],"lessons":[{"id":"c0-format","n":"0.1","title":"Com'è fatto l'esame","sub":"Le 4 parti, i tempi e cosa guarda davvero l'esaminatore","tags":["format","strategy"],"min":10,"day":1,"goal":"Sapere esattamente cosa succede in ognuno dei 13 minuti, così niente ti coglie di sorpresa.","blocks":[{"t":"p","html":"<p>Lo Speaking di LanguageCert Communicator B2 dura circa <strong>13 minuti<\/strong> ed è un colloquio a tu per tu con un esaminatore (l'interlocutore), di solito registrato. Le parti sono sempre quattro e sempre nello stesso ordine.<\/p>","h":"Le quattro parti"},{"t":"list","items":["<strong>Part 1 · 3 min<\/strong> — domande personali su 4–5 temi diversi (casa, lavoro, tempo libero, cibo…). Risposte brevi ma sviluppate: 2–4 frasi, con un motivo o un esempio.","<strong>Part 2 · 3 min<\/strong> — due role-play sociali. In uno l'esaminatore apre e tu reagisci; nell'altro devi iniziare tu (proporre, scusarti, chiedere, lamentarti…).","<strong>Part 3 · 3–4 min<\/strong> — tu e l'esaminatore avete due liste di idee diverse per lo stesso progetto o evento. Dovete confrontarle e <em>decidere insieme<\/em>.","<strong>Part 4 · 4 min<\/strong> — ricevi un argomento, hai circa 30 secondi per prendere appunti, parli per 2 minuti, poi rispondi a qualche domanda di approfondimento."],"h":"Minuto per minuto"},{"t":"p","html":"<p>In sintesi i criteri sono quattro, con lo stesso peso:<\/p>\n<ul class=\"plain\">\n<li><strong>Svolgimento del compito e coerenza<\/strong> — rispondi a ciò che ti chiedono, con risposte collegate e della lunghezza giusta.<\/li>\n<li><strong>Grammatica<\/strong> — correttezza e varietà. Qui ti sono costati i tempi verbali, gli articoli e le preposizioni.<\/li>\n<li><strong>Lessico<\/strong> — parole adatte, non tradotte parola per parola dall'italiano.<\/li>\n<li><strong>Pronuncia e fluidità<\/strong> — farsi capire senza fatica, con pause naturali, non lunghi silenzi.<\/li>\n<\/ul>\n<p>La soglia B2 non chiede perfezione. Chiede che gli errori <em>non ostacolino la comunicazione<\/em> e che non siano sistematici. Un errore isolato non boccia; lo stesso errore ripetuto 15 volte sì.<\/p>","h":"Cosa viene valutato"},{"t":"fix","h":"Due frasi che ti servono subito","items":[["I have been bocciato two times.","I've failed it twice.","“Two times” si capisce, ma “twice” è la forma naturale. “Bocciato” = <em>failed<\/em>.","calque"],["The exam is of 13 minutes.","The exam takes 13 minutes. / It's a 13-minute exam.","Niente “of” per la durata; nota “13-minute” senza -s quando è aggettivo.","prep"]]},{"t":"task","html":"<p>Spiega a voce, in inglese, com'è fatto l'esame come se lo raccontassi a un collega: <em>“The exam has four parts. In the first part…”<\/em>. Usa almeno tre connettori (<em>first, then, after that, finally<\/em>).<\/p>","timer":60,"prep":null,"h":"Allenati adesso"}],"ch":"c0","_text":" Lo Speaking di LanguageCert Communicator B2 dura circa 13 minuti ed è un colloquio a tu per tu con un esaminatore (l'interlocutore), di solito registrato. Le parti sono sempre quattro e sempre nello stesso ordine. Le quattro parti Part 1 · 3 min — domande personali su 4–5 temi diversi (casa, lavoro, tempo libero, cibo…). Risposte brevi ma sviluppate: 2–4 frasi, con un motivo o un esempio. Part 2 · 3 min — due role-play sociali. In uno l'esaminatore apre e tu reagisci; nell'altro devi iniziare tu (proporre, scusarti, chiedere, lamentarti…). Part 3 · 3–4 min — tu e l'esaminatore avete due liste di idee diverse per lo stesso progetto o evento. Dovete confrontarle e decidere insieme . Part 4 · 4 min — ricevi un argomento, hai circa 30 secondi per prendere appunti, parli per 2 minuti, poi rispondi a qualche domanda di approfondimento. Minuto per minuto In sintesi i criteri sono quattro, con lo stesso peso: Svolgimento del compito e coerenza — rispondi a ciò che ti chiedono, con risposte collegate e della lunghezza giusta. Grammatica — correttezza e varietà. Qui ti sono costati i tempi verbali, gli articoli e le preposizioni. Lessico — parole adatte, non tradotte parola per parola dall'italiano. Pronuncia e fluidità — farsi capire senza fatica, con pause naturali, non lunghi silenzi. La soglia B2 non chiede perfezione. Chiede che gli errori non ostacolino la comunicazione e che non siano sistematici. Un errore isolato non boccia; lo stesso errore ripetuto 15 volte sì. Cosa viene valutato Due frasi che ti servono subito I have been bocciato two times. I've failed it twice. “Two times” si capisce, ma “twice” è la forma naturale. “Bocciato” = failed . calque The exam is of 13 minutes. The exam takes 13 minutes. / It's a 13-minute exam. Niente “of” per la durata; nota “13-minute” senza -s quando è aggettivo. prep Spiega a voce, in inglese, com'è fatto l'esame come se lo raccontassi a un collega: “The exam has four parts. In the first part…” . Usa almeno tre connettori ( first, then, after that, finally ). Allenati adesso Sapere esattamente cosa succede in ognuno dei 13 minuti, così niente ti coglie di sorpresa."},{"id":"c0-strategy","n":"0.2","title":"Strategia per il terzo tentativo","sub":"Il contenuto c'è già: si lavora sulla precisione sotto pressione","tags":["strategy","tense","articles","calques"],"min":15,"day":1,"goal":"Trasformare i cinque errori ricorrenti in una checklist mentale da usare durante l'esame.","blocks":[{"t":"p","html":"<p>Le due bocciature non sono arrivate per mancanza di idee ma per <strong>imprecisioni formali sotto pressione<\/strong>. Quindi il piano non è imparare frasi più difficili: è dire cose semplici, <em>corrette<\/em>, e completare ogni compito.<\/p>\n<p>Regola d'oro: <strong>frase semplice e giusta &gt; frase complessa e sbagliata<\/strong>. Una frase corta con il tempo verbale corretto vale più di una frase lunga con tre calchi.<\/p>","h":"Il punto di partenza"},{"t":"list","items":["<strong>Tempo verbale<\/strong> — prima di raccontare, decidi: <em>è finito e ha una data?<\/em> → past simple. <em>Collega il passato a oggi, senza data?<\/em> → present perfect.","<strong>Articoli<\/strong> — sostantivo singolare numerabile = serve <em>a/the/my<\/em>. Mai “I am teacher”.","<strong>Preposizioni<\/strong> — le 15 combinazioni che sbagli sono nella lezione 5.3: ripassale la sera prima.","<strong>Calchi<\/strong> — se una frase “suona” italiana, cambiala in una più semplice.","<strong>Connettori<\/strong> — tieni pronti 4 connettori parlati: <em>Also… · On the other hand… · For example… · So, all in all…<\/em>"],"h":"La checklist dei 5 errori"},{"t":"phrases","h":"Frasi di sicurezza","groups":[{"name":"Autocorreggersi (è un punto a favore, non contro)","items":[["Sorry, I mean…","mi correggo"],["Let me rephrase that.","lo ridico meglio"],["What I'm trying to say is…","quello che intendo è…"]]},{"name":"Se non capisci la domanda","items":[["Sorry, could you repeat the question, please?",""],["Do you mean … ?","verifica"],["Sorry, I'm not sure I understand what you mean by …",""]]}]},{"t":"fix","h":"I tre errori più frequenti delle prove precedenti","items":[["I have gone to London in 2019.","I went to London in 2019.","C'è una data → past simple.","tense"],["I am teacher in a technical school.","I'm a teacher at a technical school.","Articolo con il mestiere; “at” per il luogo di lavoro.","art"],["I am agree.","I agree.","“Agree” è già un verbo: niente “am”.","calque"]]},{"t":"task","html":"<p>Parla per un minuto di <em>“Why are you taking this exam?”<\/em>. Registrati con il telefono, riascolta e conta: quanti verbi al passato sono corretti? Quanti sostantivi hanno l'articolo giusto?<\/p>","timer":60,"prep":null,"h":"Allenati adesso"}],"ch":"c0","_text":" Le due bocciature non sono arrivate per mancanza di idee ma per imprecisioni formali sotto pressione . Quindi il piano non è imparare frasi più difficili: è dire cose semplici, corrette , e completare ogni compito. Regola d'oro: frase semplice e giusta > frase complessa e sbagliata . Una frase corta con il tempo verbale corretto vale più di una frase lunga con tre calchi. Il punto di partenza Tempo verbale — prima di raccontare, decidi: è finito e ha una data? → past simple. Collega il passato a oggi, senza data? → present perfect. Articoli — sostantivo singolare numerabile = serve a/the/my . Mai “I am teacher”. Preposizioni — le 15 combinazioni che sbagli sono nella lezione 5.3: ripassale la sera prima. Calchi — se una frase “suona” italiana, cambiala in una più semplice. Connettori — tieni pronti 4 connettori parlati: Also… · On the other hand… · For example… · So, all in all… La checklist dei 5 errori Frasi di sicurezza Autocorreggersi (è un punto a favore, non contro) Sorry, I mean… mi correggo Let me rephrase that. lo ridico meglio What I'm trying to say is… quello che intendo è… Se non capisci la domanda Sorry, could you repeat the question, please? Do you mean … ? verifica Sorry, I'm not sure I understand what you mean by … I tre errori più frequenti delle prove precedenti I have gone to London in 2019. I went to London in 2019. C'è una data → past simple. tense I am teacher in a technical school. I'm a teacher at a technical school. Articolo con il mestiere; “at” per il luogo di lavoro. art I am agree. I agree. “Agree” è già un verbo: niente “am”. calque Parla per un minuto di “Why are you taking this exam?” . Registrati con il telefono, riascolta e conta: quanti verbi al passato sono corretti? Quanti sostantivi hanno l'articolo giusto? Allenati adesso Trasformare i cinque errori ricorrenti in una checklist mentale da usare durante l'esame."},{"id":"c0-fluency","n":"0.3","title":"Prendere tempo senza bloccarsi","sub":"Frasi per pensare, riformulare e non restare in silenzio","tags":["fluency","strategy"],"min":10,"day":2,"goal":"Avere 10 frasi automatiche che riempiono i secondi di riflessione in modo naturale.","blocks":[{"t":"p","html":"<p>Un silenzio di 4–5 secondi pesa sulla fluidità più di un piccolo errore. Queste frasi ti comprano 2–3 secondi e suonano naturali, a patto di <strong>non usarle a ogni risposta<\/strong>: sceglile a rotazione.<\/p>","h":null},{"t":"phrases","h":"Frasi pronte","groups":[{"name":"Per pensare","items":[["That's a good question. Let me think…",""],["Well, it depends, really.",""],["I've never really thought about it, but…",""],["Hmm, how can I put it…",""]]},{"name":"Per dare opinioni","items":[["Personally, I think…",""],["As far as I'm concerned…",""],["If you ask me…",""],["I'd say that…",""]]},{"name":"Se non trovi una parola","items":[["I can't remember the word, but it's a kind of…","descrivi"],["It's something you use to…","descrivi la funzione"],["It's like a … but smaller.","confronta"]]}]},{"t":"fix","h":"Errori da evitare","items":[["How can I say…","How can I put it…","“How can I say” è un calco di “come posso dire”.","calque"],["Eh… eh… eh…","Well, let me think…","I suoni di esitazione italiani si notano: sostituiscili con “well”.",""]]},{"t":"task","html":"<p>Rispondi a queste tre domande iniziando <em>ogni volta con una frase diversa<\/em> per prendere tempo: <br>1. What's the best age to learn a language? <br>2. Is it better to live in a city or in the countryside? <br>3. What would you change about your job?<\/p>","timer":90,"prep":null,"h":"Allenati adesso"}],"ch":"c0","_text":" Un silenzio di 4–5 secondi pesa sulla fluidità più di un piccolo errore. Queste frasi ti comprano 2–3 secondi e suonano naturali, a patto di non usarle a ogni risposta : sceglile a rotazione. Frasi pronte Per pensare That's a good question. Let me think… Well, it depends, really. I've never really thought about it, but… Hmm, how can I put it… Per dare opinioni Personally, I think… As far as I'm concerned… If you ask me… I'd say that… Se non trovi una parola I can't remember the word, but it's a kind of… descrivi It's something you use to… descrivi la funzione It's like a … but smaller. confronta Errori da evitare How can I say… How can I put it… “How can I say” è un calco di “come posso dire”. calque Eh… eh… eh… Well, let me think… I suoni di esitazione italiani si notano: sostituiscili con “well”. Rispondi a queste tre domande iniziando ogni volta con una frase diversa per prendere tempo: 1. What's the best age to learn a language? 2. Is it better to live in a city or in the countryside? 3. What would you change about your job? Allenati adesso Avere 10 frasi automatiche che riempiono i secondi di riflessione in modo naturale."},{"id":"p1-intro","n":"1.0","title":"La formula della Part 1","sub":"Risposta + motivo + esempio, in 20–30 secondi","tags":["strategy","tense","fluency"],"min":10,"day":1,"goal":"Dare risposte né troppo corte (“Yes, I do.”) né troppo lunghe, con il tempo verbale che la domanda ti suggerisce.","blocks":[{"t":"p","html":"<p>Ogni risposta della Part 1 ha tre pezzi: <strong>A<\/strong>nswer (rispondi subito), <strong>R<\/strong>eason (perché), <strong>E<\/strong>xample (un esempio concreto dalla tua vita). Totale: 2–4 frasi.<\/p>\n<p><em>Do you like cooking?<\/em> → <strong>A<\/strong> <em>Yes, I do, especially at the weekend.<\/em> <strong>R<\/strong> <em>It helps me relax after a busy week at school.<\/em> <strong>E<\/strong> <em>Last Sunday, for example, I made a risotto for the whole family.<\/em><\/p>","h":"A · R · E"},{"t":"p","html":"<p>La domanda ti regala il tempo verbale. Riprendilo nella risposta:<\/p>\n<ul class=\"plain\">\n<li><em>Do you…? / How often…?<\/em> → <strong>present simple<\/strong> (<em>I usually…<\/em>)<\/li>\n<li><em>Have you ever…?<\/em> → <strong>present perfect<\/strong> per dire sì/no, poi <strong>past simple<\/strong> per i dettagli (<em>Yes, I have. I went there in 2018 and…<\/em>)<\/li>\n<li><em>What did you do…? / When was the last time…?<\/em> → <strong>past simple<\/strong><\/li>\n<li><em>Would you like to…? / If you could…<\/em> → <strong>would<\/strong> (<em>I'd love to…<\/em>)<\/li>\n<li><em>Are you going to… / What are your plans…?<\/em> → <strong>going to / present continuous<\/strong><\/li>\n<\/ul>","h":"La domanda ti dà il tempo verbale"},{"t":"fix","h":"Errori da evitare","items":[["Have you ever been to London? — Yes, I have been there in 2019.","Yes, I have. I went there in 2019.","Il “sì” con present perfect, i dettagli con la data al past simple.","tense"],["Yes.","Yes, I do — mainly because…","Una sola parola non mostra il tuo livello.",""],["I like very much cooking.","I really like cooking. / I like cooking very much.","“Very much” non va tra verbo e complemento.","wo"]]},{"t":"task","html":"<p>Rispondi con la formula A·R·E: <br>1. Do you prefer mornings or evenings? <br>2. Have you ever studied abroad? <br>3. What did you do last weekend? <br>4. Would you like to learn another language?<\/p>","timer":120,"prep":null,"h":"Allenati adesso"}],"ch":"p1","_text":" Ogni risposta della Part 1 ha tre pezzi: A nswer (rispondi subito), R eason (perché), E xample (un esempio concreto dalla tua vita). Totale: 2–4 frasi. Do you like cooking? → A Yes, I do, especially at the weekend. R It helps me relax after a busy week at school. E Last Sunday, for example, I made a risotto for the whole family. A · R · E La domanda ti regala il tempo verbale. Riprendilo nella risposta: Do you…? / How often…? → present simple ( I usually… ) Have you ever…? → present perfect per dire sì/no, poi past simple per i dettagli ( Yes, I have. I went there in 2018 and… ) What did you do…? / When was the last time…? → past simple Would you like to…? / If you could… → would ( I'd love to… ) Are you going to… / What are your plans…? → going to / present continuous La domanda ti dà il tempo verbale Errori da evitare Have you ever been to London? — Yes, I have been there in 2019. Yes, I have. I went there in 2019. Il “sì” con present perfect, i dettagli con la data al past simple. tense Yes. Yes, I do — mainly because… Una sola parola non mostra il tuo livello. I like very much cooking. I really like cooking. / I like cooking very much. “Very much” non va tra verbo e complemento. wo Rispondi con la formula A·R·E: 1. Do you prefer mornings or evenings? 2. Have you ever studied abroad? 3. What did you do last weekend? 4. Would you like to learn another language? Allenati adesso Dare risposte né troppo corte (“Yes, I do.”) né troppo lunghe, con il tempo verbale che la domanda ti suggerisce."},{"id":"p1-phone","n":"1.1","title":"Telefono e comunicazione","sub":"Chiamate, messaggi, social","tags":["phone","tech"],"min":15,"day":1,"goal":"Parlare di come comunichi, confrontando telefonate e messaggi.","blocks":[{"t":"qa","items":[{"q":"Do you prefer calling people or sending messages?","a":"It depends on who I'm talking to. With my family I usually call, because it's quicker and more personal. With colleagues, on the other hand, I prefer sending messages, so they can answer when they have time.","tip":"Nota <em>on the other hand<\/em>: un connettore che nel parlato ti sparisce spesso."},{"q":"How much time do you spend on your phone every day?","a":"Probably more than I'd like to admit! I'd say about two hours, mostly for work: I check the school's platform, answer emails and prepare material for my lessons. In the evening I try to leave it in another room."},{"q":"Have you ever lost your phone?","a":"Yes, I have, once. I left it on a train a few years ago and I only noticed when I got home. Luckily, someone handed it in at the station and I got it back the next day.","tip":"Present perfect per il “sì”, poi tutto al past simple."},{"q":"Do you think people use their phones too much?","a":"Yes, I do, especially young people. I see it every day at school: during the break most students are looking at a screen instead of talking to each other. That said, phones are also very useful for studying."},{"q":"How has communication changed since you were a child?","a":"It has changed completely. When I was a child we only had a landline at home and we called our relatives on Sundays. Now we can make video calls for free, anywhere in the world.","tip":"<em>has changed<\/em> (fino a oggi) vs <em>when I was a child we had<\/em> (passato concluso)."}],"h":"Domande d'esame con risposta modello","note":"Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura."},{"t":"vocab","h":"Lessico utile","items":[["landline","telefono fisso"],["to text someone","mandare un messaggio a qualcuno"],["to make a (video) call","fare una (video)chiamata"],["to hand something in","consegnare (un oggetto trovato)"],["to be glued to your phone","essere incollato al telefono"],["notifications","notifiche"]]},{"t":"fix","h":"Errori da evitare","items":[["I make a call to my mother.","I call my mother. / I give my mother a call.","“Make a call” esiste, ma “make a call to” è pesante.","calque"],["I have lost my phone last year.","I lost my phone last year.","“Last year” = tempo concluso → past simple.","tense"],["I send messages at my colleagues.","I send messages to my colleagues.","Send something <strong>to<\/strong> someone.","prep"]]},{"t":"task","html":"<p>Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda.<\/p><ol><li>Who do you talk to most on the phone?<\/li><li>Do you like using social media? Why?<\/li><li>What was your first mobile phone like?<\/li><li>Should children have a smartphone?<\/li><\/ol>","timer":150,"prep":null,"h":"Allenati adesso"}],"ch":"p1","_text":"Do you prefer calling people or sending messages? It depends on who I'm talking to. With my family I usually call, because it's quicker and more personal. With colleagues, on the other hand, I prefer sending messages, so they can answer when they have time. Nota on the other hand : un connettore che nel parlato ti sparisce spesso. How much time do you spend on your phone every day? Probably more than I'd like to admit! I'd say about two hours, mostly for work: I check the school's platform, answer emails and prepare material for my lessons. In the evening I try to leave it in another room. Have you ever lost your phone? Yes, I have, once. I left it on a train a few years ago and I only noticed when I got home. Luckily, someone handed it in at the station and I got it back the next day. Present perfect per il “sì”, poi tutto al past simple. Do you think people use their phones too much? Yes, I do, especially young people. I see it every day at school: during the break most students are looking at a screen instead of talking to each other. That said, phones are also very useful for studying. How has communication changed since you were a child? It has changed completely. When I was a child we only had a landline at home and we called our relatives on Sundays. Now we can make video calls for free, anywhere in the world. has changed (fino a oggi) vs when I was a child we had (passato concluso). Domande d'esame con risposta modello Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura. Lessico utile landline telefono fisso to text someone mandare un messaggio a qualcuno to make a (video) call fare una (video)chiamata to hand something in consegnare (un oggetto trovato) to be glued to your phone essere incollato al telefono notifications notifiche Errori da evitare I make a call to my mother. I call my mother. / I give my mother a call. “Make a call” esiste, ma “make a call to” è pesante. calque I have lost my phone last year. I lost my phone last year. “Last year” = tempo concluso → past simple. tense I send messages at my colleagues. I send messages to my colleagues. Send something to someone. prep Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda. Who do you talk to most on the phone? Do you like using social media? Why? What was your first mobile phone like? Should children have a smartphone? Allenati adesso Parlare di come comunichi, confrontando telefonate e messaggi."},{"id":"p1-manners","n":"1.2","title":"Buone maniere","sub":"Cortesia, regole, differenze culturali","tags":["manners","family"],"min":15,"day":1,"goal":"Dare opinioni su comportamenti educati e maleducati con esempi concreti.","blocks":[{"t":"qa","items":[{"q":"What do you think are good manners?","a":"For me, good manners are about respect: saying please and thank you, arriving on time and listening when other people are speaking. In my job I also think it's important to greet everyone, not just the people you know."},{"q":"Were your parents strict about manners when you were young?","a":"Yes, they were, quite strict. For example, we always had to wait until everyone was sitting at the table before we started eating, and we weren't allowed to use the phone during dinner.","tip":"<em>had to / weren't allowed to<\/em>: obbligo e divieto al passato."},{"q":"Are manners different in other countries?","a":"Definitely. When I was in England, I noticed that people queue very patiently and say sorry all the time, even when it isn't their fault. In Italy we're a bit more relaxed about queuing!"},{"q":"What behaviour do you find rude?","a":"I find it rude when people talk loudly on the phone in public places, like on a bus. Another thing that annoys me is when someone checks their phone while you're talking to them."},{"q":"Do you think young people today are less polite?","a":"Not really. I work with teenagers and most of them are polite, they just show it in a different way. They might not say “good morning” to everyone, but they're often very helpful."}],"h":"Domande d'esame con risposta modello","note":"Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura."},{"t":"vocab","h":"Lessico utile","items":[["to queue (up)","fare la fila"],["rude / impolite","maleducato"],["to greet","salutare"],["to interrupt","interrompere"],["it annoys me when…","mi dà fastidio quando…"],["to be allowed to","avere il permesso di"]]},{"t":"fix","h":"Errori da evitare","items":[["It's educated to say thank you.","It's polite to say thank you.","“Educated” = istruito, non educato!","calque"],["I find rude when people shout.","I find it rude when people shout.","Serve “it” dopo find.","wo"],["When I was young I have learnt good manners.","When I was young, I learnt good manners.","“When I was young” → past simple.","tense"]]},{"t":"task","html":"<p>Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda.<\/p><ol><li>Is it rude to be late in your country?<\/li><li>Who taught you good manners?<\/li><li>Should schools teach manners?<\/li><li>What do you do if someone is rude to you?<\/li><\/ol>","timer":150,"prep":null,"h":"Allenati adesso"}],"ch":"p1","_text":"What do you think are good manners? For me, good manners are about respect: saying please and thank you, arriving on time and listening when other people are speaking. In my job I also think it's important to greet everyone, not just the people you know. Were your parents strict about manners when you were young? Yes, they were, quite strict. For example, we always had to wait until everyone was sitting at the table before we started eating, and we weren't allowed to use the phone during dinner. had to / weren't allowed to : obbligo e divieto al passato. Are manners different in other countries? Definitely. When I was in England, I noticed that people queue very patiently and say sorry all the time, even when it isn't their fault. In Italy we're a bit more relaxed about queuing! What behaviour do you find rude? I find it rude when people talk loudly on the phone in public places, like on a bus. Another thing that annoys me is when someone checks their phone while you're talking to them. Do you think young people today are less polite? Not really. I work with teenagers and most of them are polite, they just show it in a different way. They might not say “good morning” to everyone, but they're often very helpful. Domande d'esame con risposta modello Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura. Lessico utile to queue (up) fare la fila rude / impolite maleducato to greet salutare to interrupt interrompere it annoys me when… mi dà fastidio quando… to be allowed to avere il permesso di Errori da evitare It's educated to say thank you. It's polite to say thank you. “Educated” = istruito, non educato! calque I find rude when people shout. I find it rude when people shout. Serve “it” dopo find. wo When I was young I have learnt good manners. When I was young, I learnt good manners. “When I was young” → past simple. tense Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda. Is it rude to be late in your country? Who taught you good manners? Should schools teach manners? What do you do if someone is rude to you? Allenati adesso Dare opinioni su comportamenti educati e maleducati con esempi concreti."},{"id":"p1-food","n":"1.3","title":"Cibo e bevande","sub":"Abitudini, cucina, ristoranti","tags":["food","family","health"],"min":15,"day":2,"goal":"Descrivere abitudini alimentari e un pasto speciale senza calchi (“make a dinner”, “eat a pizza”…).","blocks":[{"t":"qa","items":[{"q":"What's your favourite food?","a":"I'd say risotto, because it's typical of where I live, in the north-east of Italy. There are so many versions: with mushrooms, with radicchio or with seafood. My favourite is the one my mother makes with pumpkin."},{"q":"Do you prefer eating at home or in restaurants?","a":"Usually at home, because it's cheaper and healthier. But I enjoy going out for a pizza with friends at the weekend, maybe once or twice a month. It's more about spending time together than about the food."},{"q":"Can you cook?","a":"Yes, I can, although I'm not a great cook. I can make simple dishes like pasta, soups and grilled vegetables. When I have more time, at the weekend, I try new recipes that I find online."},{"q":"Has your diet changed in recent years?","a":"Yes, it has. Since I started running more regularly, I've been eating less meat and more fruit and vegetables. I've also cut down on sugar, which was quite hard at the beginning.","tip":"<em>Since<\/em> + past simple, poi present perfect continuous: la struttura “da quando”."},{"q":"Tell me about a special meal you remember.","a":"I remember my parents' fortieth wedding anniversary. We had lunch at a restaurant in the hills, the whole family was there and the food was excellent. What I remember most, though, is my father's speech at the end."}],"h":"Domande d'esame con risposta modello","note":"Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura."},{"t":"vocab","h":"Lessico utile","items":[["to cut down on","ridurre"],["a dish","un piatto (la pietanza)"],["a recipe","una ricetta"],["homemade","fatto in casa"],["to eat out","mangiare fuori"],["a balanced diet","un'alimentazione equilibrata"]]},{"t":"fix","h":"Errori da evitare","items":[["I make a dinner with my friends.","I have dinner with my friends.","Il pasto si “ha”: have breakfast / lunch / dinner (senza articolo).","calque"],["The pasta is my favourite food.","Pasta is my favourite food.","Parlando in generale: niente “the”.","art"],["I'm used to eat at 1 o'clock.","I usually eat at 1 o'clock.","“Be used to” vuole -ing e significa “essere abituato”; per le abitudini usa “usually”.","calque"]]},{"t":"task","html":"<p>Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda.<\/p><ol><li>What did you have for breakfast today?<\/li><li>Is there a dish from your region you'd recommend?<\/li><li>Do you think fast food is a problem?<\/li><li>Who does the cooking in your family?<\/li><\/ol>","timer":150,"prep":null,"h":"Allenati adesso"}],"ch":"p1","_text":"What's your favourite food? I'd say risotto, because it's typical of where I live, in the north-east of Italy. There are so many versions: with mushrooms, with radicchio or with seafood. My favourite is the one my mother makes with pumpkin. Do you prefer eating at home or in restaurants? Usually at home, because it's cheaper and healthier. But I enjoy going out for a pizza with friends at the weekend, maybe once or twice a month. It's more about spending time together than about the food. Can you cook? Yes, I can, although I'm not a great cook. I can make simple dishes like pasta, soups and grilled vegetables. When I have more time, at the weekend, I try new recipes that I find online. Has your diet changed in recent years? Yes, it has. Since I started running more regularly, I've been eating less meat and more fruit and vegetables. I've also cut down on sugar, which was quite hard at the beginning. Since + past simple, poi present perfect continuous: la struttura “da quando”. Tell me about a special meal you remember. I remember my parents' fortieth wedding anniversary. We had lunch at a restaurant in the hills, the whole family was there and the food was excellent. What I remember most, though, is my father's speech at the end. Domande d'esame con risposta modello Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura. Lessico utile to cut down on ridurre a dish un piatto (la pietanza) a recipe una ricetta homemade fatto in casa to eat out mangiare fuori a balanced diet un'alimentazione equilibrata Errori da evitare I make a dinner with my friends. I have dinner with my friends. Il pasto si “ha”: have breakfast / lunch / dinner (senza articolo). calque The pasta is my favourite food. Pasta is my favourite food. Parlando in generale: niente “the”. art I'm used to eat at 1 o'clock. I usually eat at 1 o'clock. “Be used to” vuole -ing e significa “essere abituato”; per le abitudini usa “usually”. calque Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda. What did you have for breakfast today? Is there a dish from your region you'd recommend? Do you think fast food is a problem? Who does the cooking in your family? Allenati adesso Descrivere abitudini alimentari e un pasto speciale senza calchi (“make a dinner”, “eat a pizza”…)."},{"id":"p1-education","n":"1.4","title":"Scuola e studio","sub":"Ricordi di scuola, imparare, formazione","tags":["education","work"],"min":15,"day":2,"goal":"Parlare della tua esperienza di studente e di insegnante, usando bene “used to” e il past simple.","blocks":[{"t":"qa","items":[{"q":"What do you remember about your secondary school?","a":"I went to a technical school, and what I remember most is the lab: we spent hours building small circuits. I wasn't the best student in theory, but I loved the practical part. That's probably why I teach lab subjects today."},{"q":"What subject did you enjoy most at school?","a":"Electronics, without a doubt. I enjoyed understanding how things work. On the other hand, I didn't like history very much, mainly because we had to learn lots of dates by heart."},{"q":"Do you think it's important to keep learning as an adult?","a":"Absolutely. Technology changes so fast that if you stop learning, you fall behind. At the moment, for example, I'm studying for this English exam and I'm also taking a course to get a teaching qualification."},{"q":"Would you like to study something new in the future?","a":"Yes, I'd like to take a course in robotics, because my students are really interested in it. I think it would help me make my lessons more practical and up to date."},{"q":"How is school different today from when you were a student?","a":"The biggest difference is technology. When I was a student we used to write everything by hand, while now students use tablets and online platforms. Teachers also used to be much stricter.","tip":"<em>used to<\/em> + verbo base = abitudine passata che non c'è più."}],"h":"Domande d'esame con risposta modello","note":"Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura."},{"t":"vocab","h":"Lessico utile","items":[["to learn by heart","imparare a memoria"],["to fall behind","restare indietro"],["a qualification","un titolo / una certificazione"],["a technical school","un istituto tecnico / professionale"],["to take / pass / fail an exam","sostenere / superare / non superare un esame"],["marks (UK) / grades (US)","voti"]]},{"t":"fix","h":"Errori da evitare","items":[["I have done an exam yesterday.","I took an exam yesterday.","“Yesterday” → past simple; e l'esame si “take”, non “do” (in parlato UK “do” è tollerato, “take” è più sicuro).","tense"],["I study English since two years.","I've been studying English for two years.","“Da due anni” = present perfect continuous + for.","tense"],["I teach in the school Zanussi.","I teach at the Zanussi school.","Ordine: nome + school; preposizione “at”.","wo"]]},{"t":"task","html":"<p>Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda.<\/p><ol><li>What kind of student were you?<\/li><li>Did you have a favourite teacher? Why?<\/li><li>Is it better to study alone or in a group?<\/li><li>Should school last longer or shorter?<\/li><\/ol>","timer":150,"prep":null,"h":"Allenati adesso"}],"ch":"p1","_text":"What do you remember about your secondary school? I went to a technical school, and what I remember most is the lab: we spent hours building small circuits. I wasn't the best student in theory, but I loved the practical part. That's probably why I teach lab subjects today. What subject did you enjoy most at school? Electronics, without a doubt. I enjoyed understanding how things work. On the other hand, I didn't like history very much, mainly because we had to learn lots of dates by heart. Do you think it's important to keep learning as an adult? Absolutely. Technology changes so fast that if you stop learning, you fall behind. At the moment, for example, I'm studying for this English exam and I'm also taking a course to get a teaching qualification. Would you like to study something new in the future? Yes, I'd like to take a course in robotics, because my students are really interested in it. I think it would help me make my lessons more practical and up to date. How is school different today from when you were a student? The biggest difference is technology. When I was a student we used to write everything by hand, while now students use tablets and online platforms. Teachers also used to be much stricter. used to + verbo base = abitudine passata che non c'è più. Domande d'esame con risposta modello Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura. Lessico utile to learn by heart imparare a memoria to fall behind restare indietro a qualification un titolo / una certificazione a technical school un istituto tecnico / professionale to take / pass / fail an exam sostenere / superare / non superare un esame marks (UK) / grades (US) voti Errori da evitare I have done an exam yesterday. I took an exam yesterday. “Yesterday” → past simple; e l'esame si “take”, non “do” (in parlato UK “do” è tollerato, “take” è più sicuro). tense I study English since two years. I've been studying English for two years. “Da due anni” = present perfect continuous + for. tense I teach in the school Zanussi. I teach at the Zanussi school. Ordine: nome + school; preposizione “at”. wo Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda. What kind of student were you? Did you have a favourite teacher? Why? Is it better to study alone or in a group? Should school last longer or shorter? Allenati adesso Parlare della tua esperienza di studente e di insegnante, usando bene “used to” e il past simple."},{"id":"p1-travel","n":"1.5","title":"Viaggi e trasporti","sub":"Vacanze, mezzi di trasporto, esperienze all'estero","tags":["travel","freetime"],"min":15,"day":2,"goal":"Raccontare viaggi senza confondere past simple e present perfect.","blocks":[{"t":"qa","items":[{"q":"Do you like travelling?","a":"Yes, I love it, although I don't travel as much as I'd like to. I prefer short trips, like a weekend in a city I don't know, rather than long holidays. Last spring, for example, I spent three days in Vienna."},{"q":"How do you usually get to work?","a":"I usually drive, because the school is about twenty kilometres from where I live and the public transport isn't very good. When the weather is nice, I sometimes cycle part of the way."},{"q":"What's the most interesting place you've ever visited?","a":"Probably Edinburgh. I went there about ten years ago with some friends. I loved the old town and the castle, and the people were really friendly. The weather, on the other hand, was terrible!","tip":"Domanda al present perfect (<em>'ve ever visited<\/em>), racconto al past simple (<em>I went… I loved…<\/em>)."},{"q":"Do you prefer travelling alone or with other people?","a":"With other people, definitely. I think travelling is more fun when you can share the experience. Also, it's safer and cheaper, because you can split the costs."},{"q":"Where would you like to go in the future?","a":"I'd love to go to Japan. I'm interested in the culture, and as I practise judo, it would be amazing to train in a dojo there. I hope I'll be able to go in the next few years."}],"h":"Domande d'esame con risposta modello","note":"Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura."},{"t":"vocab","h":"Lessico utile","items":[["a trip / a journey / travel","gita-viaggio breve / tragitto / il viaggiare (non numerabile)"],["to get to","arrivare a"],["to split the costs","dividere le spese"],["sightseeing","visite turistiche"],["a return ticket","biglietto andata e ritorno"],["to go abroad","andare all'estero"]]},{"t":"fix","h":"Errori da evitare","items":[["I have been in Spain last summer.","I went to Spain last summer.","Tempo concluso → past simple; e con i viaggi si usa “go to”.","tense"],["I did a travel to Japan.","I went on a trip to Japan.","“Travel” è non numerabile; si dice a trip / a journey.","calque"],["I arrived to the airport.","I arrived at the airport.","Arrive <strong>at<\/strong> (luogo) / <strong>in<\/strong> (città, nazione). Mai “to”.","prep"]]},{"t":"task","html":"<p>Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda.<\/p><ol><li>What was your last holiday like?<\/li><li>Do you prefer the sea or the mountains?<\/li><li>What do you always take with you when you travel?<\/li><li>Is public transport good where you live?<\/li><\/ol>","timer":150,"prep":null,"h":"Allenati adesso"}],"ch":"p1","_text":"Do you like travelling? Yes, I love it, although I don't travel as much as I'd like to. I prefer short trips, like a weekend in a city I don't know, rather than long holidays. Last spring, for example, I spent three days in Vienna. How do you usually get to work? I usually drive, because the school is about twenty kilometres from where I live and the public transport isn't very good. When the weather is nice, I sometimes cycle part of the way. What's the most interesting place you've ever visited? Probably Edinburgh. I went there about ten years ago with some friends. I loved the old town and the castle, and the people were really friendly. The weather, on the other hand, was terrible! Domanda al present perfect ( 've ever visited ), racconto al past simple ( I went… I loved… ). Do you prefer travelling alone or with other people? With other people, definitely. I think travelling is more fun when you can share the experience. Also, it's safer and cheaper, because you can split the costs. Where would you like to go in the future? I'd love to go to Japan. I'm interested in the culture, and as I practise judo, it would be amazing to train in a dojo there. I hope I'll be able to go in the next few years. Domande d'esame con risposta modello Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura. Lessico utile a trip / a journey / travel gita-viaggio breve / tragitto / il viaggiare (non numerabile) to get to arrivare a to split the costs dividere le spese sightseeing visite turistiche a return ticket biglietto andata e ritorno to go abroad andare all'estero Errori da evitare I have been in Spain last summer. I went to Spain last summer. Tempo concluso → past simple; e con i viaggi si usa “go to”. tense I did a travel to Japan. I went on a trip to Japan. “Travel” è non numerabile; si dice a trip / a journey. calque I arrived to the airport. I arrived at the airport. Arrive at (luogo) / in (città, nazione). Mai “to”. prep Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda. What was your last holiday like? Do you prefer the sea or the mountains? What do you always take with you when you travel? Is public transport good where you live? Allenati adesso Raccontare viaggi senza confondere past simple e present perfect."},{"id":"p1-work","n":"1.6","title":"Lavoro","sub":"Il tuo lavoro, colleghi, ambizioni","tags":["work","education"],"min":15,"day":2,"goal":"Descrivere il lavoro di insegnante in modo chiaro, con articoli e preposizioni corretti.","blocks":[{"t":"qa","items":[{"q":"What do you do?","a":"I'm a teacher. I work at a vocational school in Pordenone, where I teach lab subjects in the electrical and electronics department. Most of my students are between fifteen and nineteen.","tip":"<em>I'm <strong>a<\/strong> teacher · I work <strong>at<\/strong> a school · <strong>in<\/strong> Pordenone<\/em>."},{"q":"What do you like most about your job?","a":"I really like the practical side. When students finally see a circuit working after they've built it themselves, their faces light up. That moment makes all the hard work worth it."},{"q":"Is there anything you find difficult about your job?","a":"Yes. Sometimes it's hard to keep everyone motivated, because the classes are quite mixed. Some students are very interested, while others would rather be somewhere else. I try to use real-life examples to get them involved."},{"q":"How long have you been doing this job?","a":"I've been teaching for several years now, but I only got a permanent position recently, after passing a national competition. Before that, I worked in the private sector as a technician.","tip":"<em>How long have you been…<\/em> → rispondi con present perfect continuous, poi i fatti con data al past simple."},{"q":"Would you like to change your job in the future?","a":"Not really. I'm happy where I am. However, I'd like to take on more responsibility at school, for example coordinating projects with local companies, so that students can do work placements."}],"h":"Domande d'esame con risposta modello","note":"Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura."},{"t":"vocab","h":"Lessico utile","items":[["a vocational school","istituto professionale"],["a permanent position","un posto di ruolo / a tempo indeterminato"],["a work placement / internship","tirocinio / stage"],["colleagues","colleghi"],["to take on responsibility","prendersi responsabilità"],["a competition (public exam)","concorso"]]},{"t":"fix","h":"Errori da evitare","items":[["I work like teacher.","I work as a teacher.","“Like” = simile a; “as” = in qualità di.","calque"],["I teach since 2015.","I've been teaching since 2015.","Azione iniziata nel passato e ancora in corso.","tense"],["I have many works to do.","I have a lot of work to do.","“Work” (lavoro da fare) non è numerabile.","vocab"]]},{"t":"task","html":"<p>Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda.<\/p><ol><li>Why did you choose this job?<\/li><li>What's a typical working day like for you?<\/li><li>Do you prefer working alone or in a team?<\/li><li>What job did you want to do as a child?<\/li><\/ol>","timer":150,"prep":null,"h":"Allenati adesso"}],"ch":"p1","_text":"What do you do? I'm a teacher. I work at a vocational school in Pordenone, where I teach lab subjects in the electrical and electronics department. Most of my students are between fifteen and nineteen. I'm a teacher · I work at a school · in Pordenone . What do you like most about your job? I really like the practical side. When students finally see a circuit working after they've built it themselves, their faces light up. That moment makes all the hard work worth it. Is there anything you find difficult about your job? Yes. Sometimes it's hard to keep everyone motivated, because the classes are quite mixed. Some students are very interested, while others would rather be somewhere else. I try to use real-life examples to get them involved. How long have you been doing this job? I've been teaching for several years now, but I only got a permanent position recently, after passing a national competition. Before that, I worked in the private sector as a technician. How long have you been… → rispondi con present perfect continuous, poi i fatti con data al past simple. Would you like to change your job in the future? Not really. I'm happy where I am. However, I'd like to take on more responsibility at school, for example coordinating projects with local companies, so that students can do work placements. Domande d'esame con risposta modello Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura. Lessico utile a vocational school istituto professionale a permanent position un posto di ruolo / a tempo indeterminato a work placement / internship tirocinio / stage colleagues colleghi to take on responsibility prendersi responsabilità a competition (public exam) concorso Errori da evitare I work like teacher. I work as a teacher. “Like” = simile a; “as” = in qualità di. calque I teach since 2015. I've been teaching since 2015. Azione iniziata nel passato e ancora in corso. tense I have many works to do. I have a lot of work to do. “Work” (lavoro da fare) non è numerabile. vocab Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda. Why did you choose this job? What's a typical working day like for you? Do you prefer working alone or in a team? What job did you want to do as a child? Allenati adesso Descrivere il lavoro di insegnante in modo chiaro, con articoli e preposizioni corretti."},{"id":"p1-freetime","n":"1.7","title":"Tempo libero e sport","sub":"Hobby, judo, corsa, weekend","tags":["freetime","sport","health"],"min":15,"day":3,"goal":"Parlare delle tue passioni con entusiasmo e precisione: è il tema dove puoi brillare.","blocks":[{"t":"qa","items":[{"q":"What do you do in your free time?","a":"I'm quite active. I practise judo, which I've been doing for many years, and I go running two or three times a week. When I want to relax, I like watching films or going for a walk along the river near my house."},{"q":"How did you start doing judo?","a":"I started when I was a child. A friend of mine was going to a judo club and I went with him one day to watch. I liked it so much that I joined the following week, and I've never stopped since."},{"q":"Why do you like running?","a":"Mainly because it clears my mind. After a day at school I need some time on my own, and running is perfect for that. I also like tracking my progress on an app: it keeps me motivated."},{"q":"Do you prefer team sports or individual sports?","a":"I prefer individual sports, although judo is a bit of both: you fight alone, but you train with a group and you depend on your partners. I like the fact that the result depends on you."},{"q":"Is there a new hobby you would like to try?","a":"Yes, I'd like to try photography. I often see beautiful landscapes when I'm running, and it would be nice to be able to take good pictures of them."}],"h":"Domande d'esame con risposta modello","note":"Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura."},{"t":"vocab","h":"Lessico utile","items":[["to practise (UK) / practice (US)","praticare"],["to join a club","iscriversi a una società"],["to train","allenarsi"],["a black belt","cintura nera"],["to clear your mind","svuotare la testa"],["to keep fit","tenersi in forma"]]},{"t":"fix","h":"Errori da evitare","items":[["I do running.","I go running. / I run.","Sport in -ing con “go”: go running, go swimming, go skiing.","calque"],["I practise judo since I was a child.","I've practised judo since I was a child.","Da allora a oggi → present perfect.","tense"],["In the free time I read.","In my free time I read.","Con “free time” si usa il possessivo.","art"]]},{"t":"task","html":"<p>Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda.<\/p><ol><li>How much free time do you have during the week?<\/li><li>What did you do last weekend?<\/li><li>Is sport important for children? Why?<\/li><li>Do you watch sport on TV?<\/li><\/ol>","timer":150,"prep":null,"h":"Allenati adesso"}],"ch":"p1","_text":"What do you do in your free time? I'm quite active. I practise judo, which I've been doing for many years, and I go running two or three times a week. When I want to relax, I like watching films or going for a walk along the river near my house. How did you start doing judo? I started when I was a child. A friend of mine was going to a judo club and I went with him one day to watch. I liked it so much that I joined the following week, and I've never stopped since. Why do you like running? Mainly because it clears my mind. After a day at school I need some time on my own, and running is perfect for that. I also like tracking my progress on an app: it keeps me motivated. Do you prefer team sports or individual sports? I prefer individual sports, although judo is a bit of both: you fight alone, but you train with a group and you depend on your partners. I like the fact that the result depends on you. Is there a new hobby you would like to try? Yes, I'd like to try photography. I often see beautiful landscapes when I'm running, and it would be nice to be able to take good pictures of them. Domande d'esame con risposta modello Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura. Lessico utile to practise (UK) / practice (US) praticare to join a club iscriversi a una società to train allenarsi a black belt cintura nera to clear your mind svuotare la testa to keep fit tenersi in forma Errori da evitare I do running. I go running. / I run. Sport in -ing con “go”: go running, go swimming, go skiing. calque I practise judo since I was a child. I've practised judo since I was a child. Da allora a oggi → present perfect. tense In the free time I read. In my free time I read. Con “free time” si usa il possessivo. art Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda. How much free time do you have during the week? What did you do last weekend? Is sport important for children? Why? Do you watch sport on TV? Allenati adesso Parlare delle tue passioni con entusiasmo e precisione: è il tema dove puoi brillare."},{"id":"p1-home","n":"1.8","title":"Casa e quartiere","sub":"Dove vivi, la tua casa, i vicini","tags":["home","town","family"],"min":15,"day":3,"goal":"Descrivere il posto dove vivi con preposizioni di luogo corrette.","blocks":[{"t":"qa","items":[{"q":"Where do you live?","a":"I live in Brugnera, a small town in the province of Pordenone, in the north-east of Italy. It's a quiet place near the Livenza river, about an hour's drive from Venice."},{"q":"What do you like about the area where you live?","a":"I like the fact that it's peaceful and green. There are lots of paths along the river where I can go running. On the other hand, you need a car for almost everything, because public transport is quite limited."},{"q":"Describe your home.","a":"I live in a detached house with a small garden. It was built in 2007, so it's fairly modern. My favourite room is the living room, because it's bright and it's where the family spends most of the time."},{"q":"Have you ever lived in another town?","a":"No, I haven't. I've always lived in this area. I've thought about moving to a bigger city a few times, but in the end I've always stayed, mainly because my family and friends are here."},{"q":"Would you like to change anything about your neighbourhood?","a":"I'd like more services for young people, like a sports centre or a library that's open in the evening. At the moment, teenagers have to go to Pordenone if they want to do something."}],"h":"Domande d'esame con risposta modello","note":"Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura."},{"t":"vocab","h":"Lessico utile","items":[["a detached / semi-detached house","casa singola / bifamiliare"],["a flat (UK) / an apartment (US)","appartamento"],["the outskirts","la periferia"],["a neighbourhood","quartiere / zona"],["peaceful","tranquillo"],["an hour's drive from","a un'ora di macchina da"]]},{"t":"fix","h":"Errori da evitare","items":[["I live in a little town near to Pordenone.","I live in a small town near Pordenone.","“Near” senza “to”; per le città si preferisce “small”.","prep"],["In my house there is a garden.","My house has a garden. / There's a garden at my house.","Il calco “in my house there is” si capisce, ma suona italiano.","calque"],["I live here from 20 years.","I've lived here for 20 years.","“Da 20 anni” = present perfect + for.","tense"]]},{"t":"task","html":"<p>Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda.<\/p><ol><li>What's your favourite room at home? Why?<\/li><li>Do you know your neighbours well?<\/li><li>Would you prefer to live in the city centre?<\/li><li>What's the best thing about your town?<\/li><\/ol>","timer":150,"prep":null,"h":"Allenati adesso"}],"ch":"p1","_text":"Where do you live? I live in Brugnera, a small town in the province of Pordenone, in the north-east of Italy. It's a quiet place near the Livenza river, about an hour's drive from Venice. What do you like about the area where you live? I like the fact that it's peaceful and green. There are lots of paths along the river where I can go running. On the other hand, you need a car for almost everything, because public transport is quite limited. Describe your home. I live in a detached house with a small garden. It was built in 2007, so it's fairly modern. My favourite room is the living room, because it's bright and it's where the family spends most of the time. Have you ever lived in another town? No, I haven't. I've always lived in this area. I've thought about moving to a bigger city a few times, but in the end I've always stayed, mainly because my family and friends are here. Would you like to change anything about your neighbourhood? I'd like more services for young people, like a sports centre or a library that's open in the evening. At the moment, teenagers have to go to Pordenone if they want to do something. Domande d'esame con risposta modello Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura. Lessico utile a detached / semi-detached house casa singola / bifamiliare a flat (UK) / an apartment (US) appartamento the outskirts la periferia a neighbourhood quartiere / zona peaceful tranquillo an hour's drive from a un'ora di macchina da Errori da evitare I live in a little town near to Pordenone. I live in a small town near Pordenone. “Near” senza “to”; per le città si preferisce “small”. prep In my house there is a garden. My house has a garden. / There's a garden at my house. Il calco “in my house there is” si capisce, ma suona italiano. calque I live here from 20 years. I've lived here for 20 years. “Da 20 anni” = present perfect + for. tense Simulazione rapida: rispondi senza pause lunghe, circa 30 secondi a domanda. What's your favourite room at home? Why? Do you know your neighbours well? Would you prefer to live in the city centre? What's the best thing about your town? Allenati adesso Descrivere il posto dove vivi con preposizioni di luogo corrette."},{"id":"p1-tech","n":"1.9","title":"Tecnologia e internet","sub":"Uso quotidiano, vantaggi, rischi","tags":["tech","education","work"],"min":15,"day":11,"goal":"Esprimere opinioni bilanciate (vantaggi / svantaggi) sulla tecnologia.","blocks":[{"t":"qa","items":[{"q":"How important is technology in your life?","a":"Very important, both at work and at home. I teach electronics, so technology is literally my job. But I try not to depend on it too much in my free time."},{"q":"What piece of technology couldn't you live without?","a":"Probably my laptop. I use it to prepare lessons, correct tests and keep in touch with colleagues. My smartphone is important too, but I could manage without it for a few days."},{"q":"Do you think technology makes people's lives better?","a":"In most ways, yes. It saves us time and gives us access to information. However, it can also make us more isolated, and I think many people find it difficult to switch off."},{"q":"How do you use the internet for learning?","a":"A lot. I watch tutorials when I need to learn something practical, and at the moment I'm using an app to practise my English speaking. I think it's great that you can learn almost anything online for free."},{"q":"Should children use technology at school?","a":"Yes, but with limits. Students need to learn how to use computers properly, because they'll need them for work. But I still think they should write by hand and read real books, too."}],"h":"Domande d'esame con risposta modello","note":"Prova prima a rispondere a voce (20–30 secondi), poi apri il modello. I modelli sono esempi: cambia i dettagli con quelli veri della tua vita, tieni la struttura."},{"t":"vocab","h":"Lessico utile","items":[["to switch off","staccare (anche mentalmente)"],["to keep in touch with","restare in contatto con"],["a device","un dispositivo"],["to download / upload","scaricare / caricare"],["tech-savvy","esperto di tecnologia"],["screen time","tempo davanti agli
