 at 9 o'clock","→ past simple"],["ever · never · already · yet · just · so far","→ present perfect"],["for (+ durata) · since (+ inizio) fino a oggi","→ present perfect (continuous)"],["How long…? (fino a ora)","→ present perfect · When…? → past simple"]]},{"t":"p","html":"<p>Nel racconto il present perfect <em>apre<\/em> o <em>chiude<\/em>, il past simple <em>racconta<\/em>:<\/p>\n<p><em>“<strong>I've been<\/strong> to England three times. The first time <strong>was<\/strong> in 2015. I <strong>went<\/strong> with my school and we <strong>stayed<\/strong> with a family. <strong>Since then<\/strong>, I<strong>'ve always wanted<\/strong> to go back.”<\/em><\/p>","h":"Lo schema “sandwich”"},{"t":"fix","h":"Errori da evitare","items":[["I have visited Rome last year.","I visited Rome last year.","“Last year” = momento finito.","tense"],["I live here since 2007.","I've lived here since 2007.","Dal 2007 fino a oggi.","tense"],["I know her for ten years.","I've known her for ten years.","Verbi di stato (know, be, have) con for/since: present perfect semplice.","tense"],["When have you started judo?","When did you start judo?","“When” chiede un momento → past simple.","tense"],["Did you ever go to London?","Have you ever been to London?","“Ever” nella vita fino a oggi → present perfect. Nota “been to”.","tense"],["I've finished school in 1990.","I finished school in 1990.","Data precisa.","tense"]]},{"t":"qa","items":[{"q":"Have you ever been abroad for work?","a":"Yes, I have. I went to Germany for a training course in 2019. It lasted a week, and I learnt a lot about industrial automation."},{"q":"How long have you been teaching?","a":"I've been teaching for about ten years. I started in a school in Pordenone, and I've been at my current school since I got my permanent position."},{"q":"What did you do last summer?","a":"I spent most of the summer at home, preparing for my exams, but in August we went to the mountains for a week. It was the first real holiday I'd had in two years."}],"h":"Allenamento con risposta modello","note":null},{"t":"task","html":"<p>Racconta in 1 minuto <em>“a place you've visited more than once”<\/em> con lo schema sandwich: apri con present perfect, racconta la prima volta al past simple, chiudi con <em>Since then…<\/em><\/p>","timer":60,"prep":null,"h":"Allenati adesso"}],"ch":"gr","_text":" In italiano il passato prossimo copre due tempi inglesi. Da qui nasce l'errore. La domanda da farti è una sola: Si vede un momento finito (ieri, nel 2019, quando ero piccolo, durante il lockdown)? → Sì: past simple ( I went, I saw, I passed ). → No, conta il risultato oggi o il periodo arriva fino a ora: present perfect ( I've been, I've never seen, I've lived here for… ). La regola in una domanda Le parole spia yesterday · last week · in 2019 · two years ago · when I was… · at 9 o'clock → past simple ever · never · already · yet · just · so far → present perfect for (+ durata) · since (+ inizio) fino a oggi → present perfect (continuous) How long…? (fino a ora) → present perfect · When…? → past simple Nel racconto il present perfect apre o chiude , il past simple racconta : “ I've been to England three times. The first time was in 2015. I went with my school and we stayed with a family. Since then , I 've always wanted to go back.” Lo schema “sandwich” Errori da evitare I have visited Rome last year. I visited Rome last year. “Last year” = momento finito. tense I live here since 2007. I've lived here since 2007. Dal 2007 fino a oggi. tense I know her for ten years. I've known her for ten years. Verbi di stato (know, be, have) con for/since: present perfect semplice. tense When have you started judo? When did you start judo? “When” chiede un momento → past simple. tense Did you ever go to London? Have you ever been to London? “Ever” nella vita fino a oggi → present perfect. Nota “been to”. tense I've finished school in 1990. I finished school in 1990. Data precisa. tense Have you ever been abroad for work? Yes, I have. I went to Germany for a training course in 2019. It lasted a week, and I learnt a lot about industrial automation. How long have you been teaching? I've been teaching for about ten years. I started in a school in Pordenone, and I've been at my current school since I got my permanent position. What did you do last summer? I spent most of the summer at home, preparing for my exams, but in August we went to the mountains for a week. It was the first real holiday I'd had in two years. Allenamento con risposta modello Racconta in 1 minuto “a place you've visited more than once” con lo schema sandwich: apri con present perfect, racconta la prima volta al past simple, chiudi con Since then… Allenati adesso Scegliere in un secondo il tempo giusto con una sola domanda: “c'è un momento finito?”"},{"id":"gr-articles","n":"5.2","title":"Articoli: a, the o niente","sub":"Mestieri, concetti generali, luoghi","tags":["articles","calques"],"min":15,"day":5,"goal":"Eliminare le omissioni di “a/an” e gli usi di “the” in senso generale, i due errori che fai di più.","blocks":[{"t":"list","items":["<strong>A / an<\/strong> con ogni singolare numerabile nominato per la prima volta o con i mestieri: <em>I'm <strong>a<\/strong> teacher · I have <strong>a<\/strong> car · It's <strong>a<\/strong> good idea<\/em>.","<strong>Niente articolo<\/strong> per parlare di qualcosa in generale (plurali e non numerabili): <em><strong>Ø<\/strong> Technology changes fast · I love <strong>Ø<\/strong> pasta · <strong>Ø<\/strong> Teenagers need <strong>Ø<\/strong> space<\/em>.","<strong>The<\/strong> quando sai di quale si parla: <em><strong>the<\/strong> school where I work · <strong>the<\/strong> film we saw yesterday · <strong>the<\/strong> internet<\/em>.","Espressioni fisse senza articolo: <em>at school, at work, at home, in bed, by car, go to school, have lunch, next week, last year<\/em>."],"h":"Le tre regole che bastano"},{"t":"fix","h":"Errori da evitare","items":[["I am electronic technician.","I'm an electronics technician.","Mestiere → a/an.","art"],["The life is difficult.","Life is difficult.","Concetto generale.","art"],["The young people use the social media too much.","Young people use social media too much.","Categorie in generale → niente “the”.","art"],["I go to the work by the car.","I go to work by car.","Espressioni fisse.","art"],["It was very good experience.","It was a very good experience.","“Experience” numerabile (un'esperienza) → a.","art"],["I play the judo.","I do judo.","Sport: niente articolo (e si usa do/play/go).","art"]]},{"t":"task","html":"<p>Descrivi il tuo lavoro in 45 secondi. Poi riascoltati (registrati!) e conta ogni sostantivo singolare: ha il suo <em>a/the/my<\/em>?<\/p>","timer":45,"prep":null,"h":"Allenati adesso"}],"ch":"gr","_text":" A / an con ogni singolare numerabile nominato per la prima volta o con i mestieri: I'm a teacher · I have a car · It's a good idea . Niente articolo per parlare di qualcosa in generale (plurali e non numerabili): Ø Technology changes fast · I love Ø pasta · Ø Teenagers need Ø space . The quando sai di quale si parla: the school where I work · the film we saw yesterday · the internet . Espressioni fisse senza articolo: at school, at work, at home, in bed, by car, go to school, have lunch, next week, last year . Le tre regole che bastano Errori da evitare I am electronic technician. I'm an electronics technician. Mestiere → a/an. art The life is difficult. Life is difficult. Concetto generale. art The young people use the social media too much. Young people use social media too much. Categorie in generale → niente “the”. art I go to the work by the car. I go to work by car. Espressioni fisse. art It was very good experience. It was a very good experience. “Experience” numerabile (un'esperienza) → a. art I play the judo. I do judo. Sport: niente articolo (e si usa do/play/go). art Descrivi il tuo lavoro in 45 secondi. Poi riascoltati (registrati!) e conta ogni sostantivo singolare: ha il suo a/the/my ? Allenati adesso Eliminare le omissioni di “a/an” e gli usi di “the” in senso generale, i due errori che fai di più."},{"id":"gr-questions","n":"5.3","title":"Fare domande (dirette e indirette)","sub":"Per la Part 2 e la Part 3","tags":["functions","negotiation"],"min":10,"day":5,"goal":"Fare domande senza errori d'ordine: servono per interagire nella Part 2 e 3.","blocks":[{"t":"list","items":["Domanda diretta: ausiliare + soggetto + verbo: <em>What time <strong>does<\/strong> the course <strong>start<\/strong>?<\/em>","Domanda indiretta (più cortese): ordine normale, niente do/does: <em>Could you tell me what time the course <strong>starts<\/strong>?<\/em>","Rilanciare nella Part 3: <em>What do you think? · How about you? · Which one do you prefer? · Don't you think…?<\/em>","Question tags per coinvolgere: <em>It's too expensive, <strong>isn't it<\/strong>? · We could try, <strong>couldn't we<\/strong>?<\/em>"],"h":null},{"t":"fix","h":"Errori da evitare","items":[["Where you work?","Where do you work?","Serve l'ausiliare.","wo"],["Do you know where is the station?","Do you know where the station is?","Indiretta: ordine della frase normale.","wo"],["What do you think about?","What do you think (about it)?","“About” da solo in fondo resta sospeso.","calque"]]},{"t":"task","html":"<p>Trasforma in domande indirette cortesi, ad alta voce:<br>1. How much is the ticket?<br>2. When does the museum close?<br>3. Is there a discount for students?<br>4. Where can I park?<\/p>","timer":60,"prep":null,"h":"Allenati adesso"}],"ch":"gr","_text":"Domanda diretta: ausiliare + soggetto + verbo: What time does the course start ? Domanda indiretta (più cortese): ordine normale, niente do/does: Could you tell me what time the course starts ? Rilanciare nella Part 3: What do you think? · How about you? · Which one do you prefer? · Don't you think…? Question tags per coinvolgere: It's too expensive, isn't it ? · We could try, couldn't we ? Errori da evitare Where you work? Where do you work? Serve l'ausiliare. wo Do you know where is the station? Do you know where the station is? Indiretta: ordine della frase normale. wo What do you think about? What do you think (about it)? “About” da solo in fondo resta sospeso. calque Trasforma in domande indirette cortesi, ad alta voce: 1. How much is the ticket? 2. When does the museum close? 3. Is there a discount for students? 4. Where can I park? Allenati adesso Fare domande senza errori d'ordine: servono per interagire nella Part 2 e 3."},{"id":"gr-connectors","n":"5.4","title":"Connettori che restano nel parlato","sub":"Da “moreover” a “what's more”","tags":["connectors","fluency","storytelling"],"min":10,"day":9,"goal":"Sostituire i connettori da scritto con 8 connettori parlati da usare davvero.","blocks":[{"t":"p","html":"<p>Per iscritto usi bene <em>Moreover, In addition, To sum up<\/em>. Parlando spariscono, perché sono lunghi e formali. Tieni invece questi otto, brevi e naturali:<\/p>","h":null},{"t":"vocab","h":"Gli 8 connettori parlati","items":[["Also… / And another thing…","aggiungere"],["What's more… / On top of that…","in più (enfatico)"],["But… / Even so…","contrasto"],["On the other hand…","d'altra parte"],["For example… / For instance…","esempio"],["That's why…","ecco perché"],["So…","quindi / conseguenza"],["So, all in all…","per concludere"]]},{"t":"fix","h":"Errori da evitare","items":[["Moreover the price is too high.","What's more, it's too expensive.","Più naturale nel parlato.","conn"],["In conclusion, to sum up, finally…","So, all in all, …","Un solo connettore per chiudere.","conn"],["Also I like it.","I also like it. / I like it, too.","“Also” va prima del verbo principale.","wo"]]},{"t":"task","html":"<p>Parla per 1 minuto di <em>“the advantages and disadvantages of living in a small town”<\/em> usando almeno 5 degli 8 connettori. Chiedi a qualcuno di contarli.<\/p>","timer":60,"prep":null,"h":"Allenati adesso"}],"ch":"gr","_text":" Per iscritto usi bene Moreover, In addition, To sum up . Parlando spariscono, perché sono lunghi e formali. Tieni invece questi otto, brevi e naturali: Gli 8 connettori parlati Also… / And another thing… aggiungere What's more… / On top of that… in più (enfatico) But… / Even so… contrasto On the other hand… d'altra parte For example… / For instance… esempio That's why… ecco perché So… quindi / conseguenza So, all in all… per concludere Errori da evitare Moreover the price is too high. What's more, it's too expensive. Più naturale nel parlato. conn In conclusion, to sum up, finally… So, all in all, … Un solo connettore per chiudere. conn Also I like it. I also like it. / I like it, too. “Also” va prima del verbo principale. wo Parla per 1 minuto di “the advantages and disadvantages of living in a small town” usando almeno 5 degli 8 connettori. Chiedi a qualcuno di contarli. Allenati adesso Sostituire i connettori da scritto con 8 connettori parlati da usare davvero."},{"id":"gr-prepositions","n":"5.5","title":"Le preposizioni che sbagli","sub":"Le 25 combinazioni che contano","tags":["prepositions","calques"],"min":15,"day":10,"goal":"Fissare le combinazioni verbo/aggettivo + preposizione che compaiono sempre all'esame.","blocks":[{"t":"vocab","h":"La lista (da ripassare la sera prima)","items":[["depend <strong>on<\/strong>","non “from”"],["arrive <strong>at<\/strong> / <strong>in<\/strong>","mai “to”"],["interested <strong>in<\/strong>",""],["good <strong>at<\/strong>","bravo in"],["married <strong>to<\/strong>","sposato con"],["listen <strong>to<\/strong>",""],["wait <strong>for<\/strong>",""],["pay <strong>for<\/strong> something",""],["worried <strong>about<\/strong>",""],["afraid <strong>of<\/strong>",""],["responsible <strong>for<\/strong>",""],["similar <strong>to<\/strong> · different <strong>from<\/strong>",""],["think <strong>about<\/strong> / <strong>of<\/strong>",""],["discuss something","senza “about”!"],["explain something <strong>to<\/strong> someone","non “explain me”"],["<strong>at<\/strong> the weekend (UK) · <strong>on<\/strong> Monday · <strong>in<\/strong> July · <strong>at<\/strong> 8 o'clock","tempo"],["<strong>at<\/strong> school / work / home · <strong>in<\/strong> Pordenone / Italy","luogo"],["<strong>by<\/strong> car / train · <strong>on<\/strong> foot","mezzi"],["<strong>for<\/strong> two years · <strong>since<\/strong> 2015 · two years <strong>ago<\/strong>","durata"]]},{"t":"fix","h":"Errori da evitare","items":[["It depends from the weather.","It depends on the weather.","","prep"],["Can you explain me the rules?","Can you explain the rules to me?","","prep"],["We discussed about the project.","We discussed the project.","","prep"],["I'm good in electronics.","I'm good at electronics.","","prep"],["I'm married with Anna.","I'm married to Anna.","","prep"],["I arrived to Venice at 10.","I arrived in Venice at 10.","","prep"]]},{"t":"task","html":"<p>Rispondi usando la preposizione giusta: <br>1. What are you good at? <br>2. What does your mood depend on? <br>3. What are you worried about at the moment? <br>4. What are your students interested in?<\/p>","timer":90,"prep":null,"h":"Allenati adesso"}],"ch":"gr","_text":"La lista (da ripassare la sera prima) depend on non “from” arrive at / in mai “to” interested in good at bravo in married to sposato con listen to wait for pay for something worried about afraid of responsible for similar to · different from think about / of discuss something senza “about”! explain something to someone non “explain me” at the weekend (UK) · on Monday · in July · at 8 o'clock tempo at school / work / home · in Pordenone / Italy luogo by car / train · on foot mezzi for two years · since 2015 · two years ago durata Errori da evitare It depends from the weather. It depends on the weather. prep Can you explain me the rules? Can you explain the rules to me? prep We discussed about the project. We discussed the project. prep I'm good in electronics. I'm good at electronics. prep I'm married with Anna. I'm married to Anna. prep I arrived to Venice at 10. I arrived in Venice at 10. prep Rispondi usando la preposizione giusta: 1. What are you good at? 2. What does your mood depend on? 3. What are you worried about at the moment? 4. What are your students interested in? Allenati adesso Fissare le combinazioni verbo/aggettivo + preposizione che compaiono sempre all'esame."},{"id":"gr-conditionals","n":"5.6","title":"Would, could, might","sub":"Ipotesi e proposte per Part 3 e 4","tags":["negotiation","tense"],"min":15,"day":11,"goal":"Usare i condizionali per proporre e ipotizzare, senza il “would” dopo “if”.","blocks":[{"t":"list","items":["<strong>Proporre (Part 3)<\/strong>: <em>We <strong>could<\/strong> ask the council. · It <strong>might<\/strong> be cheaper to… · That <strong>would<\/strong> be great.<\/em>","<strong>Ipotesi reali<\/strong>: <em>If it <strong>rains<\/strong>, we<strong>'ll<\/strong> move inside.<\/em> (if + presente, will)","<strong>Ipotesi immaginarie<\/strong>: <em>If I <strong>had<\/strong> more time, I<strong>'d<\/strong> learn the guitar.<\/em> (if + past, would)","<strong>Consiglio<\/strong>: <em>If I <strong>were<\/strong> you, I<strong>'d<\/strong>…<\/em>"],"h":null},{"t":"fix","h":"Errori da evitare","items":[["If I would have time, I would travel more.","If I had time, I'd travel more.","Mai “would” nella parte con if.","tense"],["If it will rain, we stay inside.","If it rains, we'll stay inside.","Il futuro va nell'altra metà.","tense"],["It would be more better.","It would be better.","“Better” è già comparativo.",""]]},{"t":"qa","items":[{"q":"If you could live anywhere in the world, where would you live?","a":"I think I'd live in Scotland for a while. I love the landscapes, and it would be a great way to improve my English. But I don't think I could live there forever — I'd miss the food and the sun!"},{"q":"What would you do if you won a lot of money?","a":"First, I'd help my family. Then I'd probably take a year off to travel, and maybe I'd open a small lab where young people could build their own projects."}],"h":"Allenamento con risposta modello","note":null},{"t":"task","html":"<p>Completa ad alta voce in modo personale: <br>1. If I pass this exam, … <br>2. If I had more free time, … <br>3. If I were the head teacher, … <br>4. We could organise the event outside, but if it…<\/p>","timer":60,"prep":null,"h":"Allenati adesso"}],"ch":"gr","_text":" Proporre (Part 3) : We could ask the council. · It might be cheaper to… · That would be great. Ipotesi reali : If it rains , we 'll move inside. (if + presente, will) Ipotesi immaginarie : If I had more time, I 'd learn the guitar. (if + past, would) Consiglio : If I were you, I 'd … Errori da evitare If I would have time, I would travel more. If I had time, I'd travel more. Mai “would” nella parte con if. tense If it will rain, we stay inside. If it rains, we'll stay inside. Il futuro va nell'altra metà. tense It would be more better. It would be better. “Better” è già comparativo. If you could live anywhere in the world, where would you live? I think I'd live in Scotland for a while. I love the landscapes, and it would be a great way to improve my English. But I don't think I could live there forever — I'd miss the food and the sun! What would you do if you won a lot of money? First, I'd help my family. Then I'd probably take a year off to travel, and maybe I'd open a small lab where young people could build their own projects. Allenamento con risposta modello Completa ad alta voce in modo personale: 1. If I pass this exam, … 2. If I had more free time, … 3. If I were the head teacher, … 4. We could organise the event outside, but if it… Allenati adesso Usare i condizionali per proporre e ipotizzare, senza il “would” dopo “if”."},{"id":"gr-calques","n":"5.7","title":"Calchi dall'italiano: la top 30","sub":"Le frasi che “suonano italiane”","tags":["calques","fluency"],"min":20,"day":11,"goal":"Riconoscere e sostituire le frasi tradotte parola per parola che l'esaminatore nota subito.","blocks":[{"t":"p","html":"<p>Il calco non è un errore di grammatica: è una frase corretta nella forma ma che un inglese non direbbe mai. Qui sotto i più frequenti per un italiano, divisi per tipo. Leggi la colonna verde ad alta voce finché diventa naturale.<\/p>","h":null},{"t":"fix","h":"Verbi: make/do/have/take","items":[["I have 50 years.","I'm 50.","L'età si “è”.","calque"],["I am agree.","I agree.","","calque"],["It makes cold.","It's cold.","","calque"],["I make a photo.","I take a photo.","","calque"],["I make a shower.","I have a shower.","","calque"],["I make a question.","I ask a question.","","calque"],["I do a party.","I have / throw a party.","","calque"],["I take a coffee.","I have a coffee.","","calque"],["I have right.","I'm right.","","calque"],["I have need of…","I need…","","calque"],["It serves to…","It's used for… / It's useful for…","","calque"],["How do you say…? (a una persona)","What's the word for…?","","calque"]]},{"t":"fix","h":"Falsi amici","items":[["Actually I work in a school.","At the moment / Currently I work at a school.","“Actually” = in realtà, non “attualmente”.","calque"],["Eventually I will call you.","I might call you. / If necessary, I'll call you.","“Eventually” = alla fine.","calque"],["I'm very sensible to noise.","I'm very sensitive to noise.","“Sensible” = assennato.","calque"],["A big argument of the lesson.","An important topic of the lesson.","“Argument” = litigio / tesi.","calque"],["My parents are very educated with guests.","My parents are very polite to guests.","“Educated” = istruito.","calque"],["I assisted to the meeting.","I attended the meeting.","“Assist” = aiutare.","calque"],["I'm preoccupied for the exam.","I'm worried about the exam.","","calque"],["The library (dove compri libri)","The bookshop","Library = biblioteca.","calque"]]},{"t":"fix","h":"Espressioni e strutture","items":[["Since two years.","For two years.","","prep"],["In my opinion I think…","I think…","","calque"],["How can I say…","How can I put it…","","calque"],["I'm going to the mountain.","I'm going to the mountains.","Montagna in generale = plurale.","calque"],["It's a problem of money.","It's a money problem. / It's about money.","","calque"],["There are many people that…","Lots of people…","","calque"],["I know him from 2010.","I've known him since 2010.","","tense"],["Good appetite!","Enjoy your meal!","","calque"],["We are in five.","There are five of us.","","calque"],["Also I.","Me too.","","calque"]]},{"t":"task","html":"<p>L'esaminatore dice le frasi in italiano (o leggile tu dalla colonna rossa) e tu dici subito la versione inglese naturale. Giro completo in 2 minuti.<\/p>","timer":120,"prep":null,"h":"Allenati adesso"}],"ch":"gr","_text":" Il calco non è un errore di grammatica: è una frase corretta nella forma ma che un inglese non direbbe mai. Qui sotto i più frequenti per un italiano, divisi per tipo. Leggi la colonna verde ad alta voce finché diventa naturale. Verbi: make/do/have/take I have 50 years. I'm 50. L'età si “è”. calque I am agree. I agree. calque It makes cold. It's cold. calque I make a photo. I take a photo. calque I make a shower. I have a shower. calque I make a question. I ask a question. calque I do a party. I have / throw a party. calque I take a coffee. I have a coffee. calque I have right. I'm right. calque I have need of… I need… calque It serves to… It's used for… / It's useful for… calque How do you say…? (a una persona) What's the word for…? calque Falsi amici Actually I work in a school. At the moment / Currently I work at a school. “Actually” = in realtà, non “attualmente”. calque Eventually I will call you. I might call you. / If necessary, I'll call you. “Eventually” = alla fine. calque I'm very sensible to noise. I'm very sensitive to noise. “Sensible” = assennato. calque A big argument of the lesson. An important topic of the lesson. “Argument” = litigio / tesi. calque My parents are very educated with guests. My parents are very polite to guests. “Educated” = istruito. calque I assisted to the meeting. I attended the meeting. “Assist” = aiutare. calque I'm preoccupied for the exam. I'm worried about the exam. calque The library (dove compri libri) The bookshop Library = biblioteca. calque Espressioni e strutture Since two years. For two years. prep In my opinion I think… I think… calque How can I say… How can I put it… calque I'm going to the mountain. I'm going to the mountains. Montagna in generale = plurale. calque It's a problem of money. It's a money problem. / It's about money. calque There are many people that… Lots of people… calque I know him from 2010. I've known him since 2010. tense Good appetite! Enjoy your meal! calque We are in five. There are five of us. calque Also I. Me too. calque L'esaminatore dice le frasi in italiano (o leggile tu dalla colonna rossa) e tu dici subito la versione inglese naturale. Giro completo in 2 minuti. Allenati adesso Riconoscere e sostituire le frasi tradotte parola per parola che l'esaminatore nota subito."},{"id":"mk-a","n":"6.1","title":"Simulazione A","sub":"Lavoro, cibo, viaggi · scuse e inviti · evento scolastico · una persona","tags":["mock","strategy"],"min":30,"day":12,"goal":"Fare una prova completa nei tempi reali (13 minuti) e trovare i 3 errori su cui lavorare.","blocks":[{"t":"p","html":"<p>Registra tutta la simulazione con il telefono. Non fermarti e non correggerti oltre un “sorry, I mean…”. Leggi solo il compito della parte in corso: il resto della pagina è per dopo. In alternativa, incolla il messaggio “ESERCIZIO 2 — Simulazione completa” nella chat del progetto e fai la prova a voce con Claude.<\/p>","h":"Come usarla"},{"t":"task","html":"<p>L'esaminatore ti fa queste domande, una alla volta. Rispondi in 20–30 secondi ciascuna.<\/p><ol><li>Where are you from, and what's it like there?<\/li><li>How do you usually spend your weekends?<\/li><li>What's the best meal you've had recently?<\/li><li>Have you ever travelled abroad for work or study?<\/li><li>Would you like to change anything about your job?<\/li><\/ol>","timer":180,"prep":null,"h":"Part 1 · Domande personali (3 min)"},{"t":"task","html":"<p><strong>Role-play 1:<\/strong> I'm your friend. I lent you a book and you spilled coffee on it. I'll start.<\/p><p><strong>Role-play 2:<\/strong> You want to invite your neighbour to a barbecue on Sunday. You start.<\/p>","timer":180,"prep":null,"h":"Part 2 · Role-play (3 min)"},{"t":"neg","h":"Part 3 · Discussione (3–4 min)","brief":"Your town wants to organise a festival to attract tourists. You have a budget of €10,000. Discuss the ideas and agree on the best one.","you":["A food festival with local products","An outdoor cinema in the main square","A cycling race"],"exam":["A music festival with local bands","A medieval market","A photography competition"]},{"t":"task","html":"<p>Timer: 30 secondi per gli appunti, poi 2 minuti di parola. Il modello è qui sotto, da aprire solo alla fine.<\/p>","timer":120,"prep":30,"h":"Part 4 · Monologo (4 min)"},{"t":"mono","h":"Part 4 · Il compito e il modello","topic":"Talk about a teacher or coach who was important to you.","prompts":["Who were they?","What did they teach you?","Why do you still remember them?"],"notes":["coach / teacher – name","when & where","one episode","what changed","today"],"model":["The person I'd like to talk about is my electronics teacher at secondary school, Mr Bianchi.","I was about sixteen, and to be honest I wasn't a very motivated student. I liked practical things, but I found the theory boring and I often didn't do my homework.","One day he gave me a project to do on my own: a small alarm circuit for the school lab. At first I thought it was a punishment! But I spent weeks on it, and when it finally worked, he asked me to present it to the whole class.","That moment changed my attitude completely. I realised that theory was simply the way to make things work. After that, my marks improved a lot.","Looking back, I think that's probably why I became a lab teacher. And now, when I see an unmotivated student, I try to do exactly what he did with me: give them something real to build."],"follow":[{"q":"Should teachers be friends with their students?","a":"I don't think they should be friends, but they should be approachable. Students need to feel they can ask for help, but there has to be some distance."},{"q":"What makes a good lesson?","a":"For me, a good lesson has a clear goal, some practical activity and a moment where students have to think for themselves."}]},{"t":"list","items":["<strong>Part 1<\/strong> — Ho risposto sempre con almeno 2 frasi (risposta + motivo/esempio)?","<strong>Part 2<\/strong> — Ho usato la frase funzionale giusta all'inizio (scusa, proposta, richiesta…)?","<strong>Part 3<\/strong> — Ho commentato almeno due idee dell'esaminatore e siamo arrivati a una decisione?","<strong>Part 4<\/strong> — Ho parlato per quasi 2 minuti con UNA storia e le 5 tappe?","<strong>Errori<\/strong> — Riascoltando la registrazione: quanti errori di tempo verbale? articoli? calchi? Scrivi i 3 più frequenti e ripassa la lezione collegata."],"h":"Autovalutazione (dopo aver riascoltato la registrazione)"}],"ch":"mk","_text":" Registra tutta la simulazione con il telefono. Non fermarti e non correggerti oltre un “sorry, I mean…”. Leggi solo il compito della parte in corso: il resto della pagina è per dopo. In alternativa, incolla il messaggio “ESERCIZIO 2 — Simulazione completa” nella chat del progetto e fai la prova a voce con Claude. Come usarla L'esaminatore ti fa queste domande, una alla volta. Rispondi in 20–30 secondi ciascuna. Where are you from, and what's it like there? How do you usually spend your weekends? What's the best meal you've had recently? Have you ever travelled abroad for work or study? Would you like to change anything about your job? Part 1 · Domande personali (3 min) Role-play 1: I'm your friend. I lent you a book and you spilled coffee on it. I'll start. Role-play 2: You want to invite your neighbour to a barbecue on Sunday. You start. Part 2 · Role-play (3 min) Part 3 · Discussione (3–4 min) Your town wants to organise a festival to attract tourists. You have a budget of €10,000. Discuss the ideas and agree on the best one. A food festival with local products An outdoor cinema in the main square A cycling race A music festival with local bands A medieval market A photography competition Timer: 30 secondi per gli appunti, poi 2 minuti di parola. Il modello è qui sotto, da aprire solo alla fine. Part 4 · Monologo (4 min) Part 4 · Il compito e il modello Talk about a teacher or coach who was important to you. Who were they? What did they teach you? Why do you still remember them? coach / teacher – name when & where one episode what changed today The person I'd like to talk about is my electronics teacher at secondary school, Mr Bianchi. I was about sixteen, and to be honest I wasn't a very motivated student. I liked practical things, but I found the theory boring and I often didn't do my homework. One day he gave me a project to do on my own: a small alarm circuit for the school lab. At first I thought it was a punishment! But I spent weeks on it, and when it finally worked, he asked me to present it to the whole class. That moment changed my attitude completely. I realised that theory was simply the way to make things work. After that, my marks improved a lot. Looking back, I think that's probably why I became a lab teacher. And now, when I see an unmotivated student, I try to do exactly what he did with me: give them something real to build. Should teachers be friends with their students? I don't think they should be friends, but they should be approachable. Students need to feel they can ask for help, but there has to be some distance. What makes a good lesson? For me, a good lesson has a clear goal, some practical activity and a moment where students have to think for themselves. Part 1 — Ho risposto sempre con almeno 2 frasi (risposta + motivo/esempio)? Part 2 — Ho usato la frase funzionale giusta all'inizio (scusa, proposta, richiesta…)? Part 3 — Ho commentato almeno due idee dell'esaminatore e siamo arrivati a una decisione? Part 4 — Ho parlato per quasi 2 minuti con UNA storia e le 5 tappe? Errori — Riascoltando la registrazione: quanti errori di tempo verbale? articoli? calchi? Scrivi i 3 più frequenti e ripassa la lezione collegata. Autovalutazione (dopo aver riascoltato la registrazione) Fare una prova completa nei tempi reali (13 minuti) e trovare i 3 errori su cui lavorare."},{"id":"mk-b","n":"6.2","title":"Simulazione B","sub":"Tecnologia, casa, sport · lamentele e consigli · team building · un traguardo","tags":["mock","strategy"],"min":30,"day":13,"goal":"Fare una prova completa nei tempi reali (13 minuti) e trovare i 3 errori su cui lavorare.","blocks":[{"t":"p","html":"<p>Registra tutta la simulazione con il telefono. Non fermarti e non correggerti oltre un “sorry, I mean…”. Leggi solo il compito della parte in corso: il resto della pagina è per dopo. In alternativa, incolla il messaggio “ESERCIZIO 2 — Simulazione completa” nella chat del progetto e fai la prova a voce con Claude.<\/p>","h":"Come usarla"},{"t":"task","html":"<p>L'esaminatore ti fa queste domande, una alla volta. Rispondi in 20–30 secondi ciascuna.<\/p><ol><li>What do you do?<\/li><li>How much do you use technology in your free time?<\/li><li>What do you like about the place where you live?<\/li><li>What sport or activity did you enjoy as a child?<\/li><li>Is there anything you'd like to learn in the next few years?<\/li><\/ol>","timer":180,"prep":null,"h":"Part 1 · Domande personali (3 min)"},{"t":"task","html":"<p><strong>Role-play 1:<\/strong> I'm a shop assistant. You bought a phone case last week and it has already broken. I'll start.<\/p><p><strong>Role-play 2:<\/strong> Your friend wants to start running but doesn't know how. Give some advice. You start.<\/p>","timer":180,"prep":null,"h":"Part 2 · Role-play (3 min)"},{"t":"neg","h":"Part 3 · Discussione (3–4 min)","brief":"Your school wants to make students more aware of environmental issues. Discuss the ideas and choose the two most effective.","you":["A school vegetable garden","A competition to reduce plastic","A visit to a recycling plant"],"exam":["A talk by an environmental scientist","A 'car-free day' for teachers and students","Solar panels built by students"]},{"t":"task","html":"<p>Timer: 30 secondi per gli appunti, poi 2 minuti di parola. Il modello è qui sotto, da aprire solo alla fine.<\/p>","timer":120,"prep":30,"h":"Part 4 · Monologo (4 min)"},{"t":"mono","h":"Part 4 · Il compito e il modello","topic":"Talk about something you achieved that required a lot of effort.","prompts":["What was it?","Why was it difficult?","How did you feel when you achieved it?"],"notes":["what – black belt / exam","when","difficulty","the day","since then"],"model":["I'd like to talk about the day I got my black belt in judo.","I had been training for many years, but the exam was much harder than I expected. You have to show a series of techniques perfectly, and you also have to fight.","The problem was that, a few months before the exam, I injured my shoulder, so I couldn't train properly for several weeks. At one point I thought about giving up and waiting for the next year. But my teacher convinced me to try, and I trained in a different way, focusing on technique instead of strength.","On the day of the exam I was incredibly nervous, but once I started, I just concentrated on one technique at a time. When the examiners told me I had passed, I felt a mix of relief and pride.","Since then, I've always remembered that you don't need perfect conditions to succeed. You need to adapt. And I'm using exactly that lesson now, with this English exam."],"follow":[{"q":"Is it better to succeed easily or after a lot of effort?","a":"After a lot of effort, definitely. You appreciate the result more, and you learn things along the way that are useful later."},{"q":"Do you think competition is good for young people?","a":"In moderation, yes. It teaches them to deal with pressure and to lose, but it shouldn't become the only thing that matters."}]},{"t":"list","items":["<strong>Part 1<\/strong> — Ho risposto sempre con almeno 2 frasi (risposta + motivo/esempio)?","<strong>Part 2<\/strong> — Ho usato la frase funzionale giusta all'inizio (scusa, proposta, richiesta…)?","<strong>Part 3<\/strong> — Ho commentato almeno due idee dell'esaminatore e siamo arrivati a una decisione?","<strong>Part 4<\/strong> — Ho parlato per quasi 2 minuti con UNA storia e le 5 tappe?","<strong>Errori<\/strong> — Riascoltando la registrazione: quanti errori di tempo verbale? articoli? calchi? Scrivi i 3 più frequenti e ripassa la lezione collegata."],"h":"Autovalutazione (dopo aver riascoltato la registrazione)"}],"ch":"mk","_text":" Registra tutta la simulazione con il telefono. Non fermarti e non correggerti oltre un “sorry, I mean…”. Leggi solo il compito della parte in corso: il resto della pagina è per dopo. In alternativa, incolla il messaggio “ESERCIZIO 2 — Simulazione completa” nella chat del progetto e fai la prova a voce con Claude. Come usarla L'esaminatore ti fa queste domande, una alla volta. Rispondi in 20–30 secondi ciascuna. What do you do? How much do you use technology in your free time? What do you like about the place where you live? What sport or activity did you enjoy as a child? Is there anything you'd like to learn in the next few years? Part 1 · Domande personali (3 min) Role-play 1: I'm a shop assistant. You bought a phone case last week and it has already broken. I'll start. Role-play 2: Your friend wants to start running but doesn't know how. Give some advice. You start. Part 2 · Role-play (3 min) Part 3 · Discussione (3–4 min) Your school wants to make students more aware of environmental issues. Discuss the ideas and choose the two most effective. A school vegetable garden A competition to reduce plastic A visit to a recycling plant A talk by an environmental scientist A 'car-free day' for teachers and students Solar panels built by students Timer: 30 secondi per gli appunti, poi 2 minuti di parola. Il modello è qui sotto, da aprire solo alla fine. Part 4 · Monologo (4 min) Part 4 · Il compito e il modello Talk about something you achieved that required a lot of effort. What was it? Why was it difficult? How did you feel when you achieved it? what – black belt / exam when difficulty the day since then I'd like to talk about the day I got my black belt in judo. I had been training for many years, but the exam was much harder than I expected. You have to show a series of techniques perfectly, and you also have to fight. The problem was that, a few months before the exam, I injured my shoulder, so I couldn't train properly for several weeks. At one point I thought about giving up and waiting for the next year. But my teacher convinced me to try, and I trained in a different way, focusing on technique instead of strength. On the day of the exam I was incredibly nervous, but once I started, I just concentrated on one technique at a time. When the examiners told me I had passed, I felt a mix of relief and pride. Since then, I've always remembered that you don't need perfect conditions to succeed. You need to adapt. And I'm using exactly that lesson now, with this English exam. Is it better to succeed easily or after a lot of effort? After a lot of effort, definitely. You appreciate the result more, and you learn things along the way that are useful later. Do you think competition is good for young people? In moderation, yes. It teaches them to deal with pressure and to lose, but it shouldn't become the only thing that matters. Part 1 — Ho risposto sempre con almeno 2 frasi (risposta + motivo/esempio)? Part 2 — Ho usato la frase funzionale giusta all'inizio (scusa, proposta, richiesta…)? Part 3 — Ho commentato almeno due idee dell'esaminatore e siamo arrivati a una decisione? Part 4 — Ho parlato per quasi 2 minuti con UNA storia e le 5 tappe? Errori — Riascoltando la registrazione: quanti errori di tempo verbale? articoli? calchi? Scrivi i 3 più frequenti e ripassa la lezione collegata. Autovalutazione (dopo aver riascoltato la registrazione) Fare una prova completa nei tempi reali (13 minuti) e trovare i 3 errori su cui lavorare."},{"id":"mk-c","n":"6.3","title":"Simulazione C","sub":"Famiglia, media, meteo · richieste e cambi di programma · budget giovani · un luogo","tags":["mock","strategy"],"min":30,"day":14,"goal":"Fare una prova completa nei tempi reali (13 minuti) e trovare i 3 errori su cui lavorare.","blocks":[{"t":"p","html":"<p>Registra tutta la simulazione con il telefono. Non fermarti e non correggerti oltre un “sorry, I mean…”. Leggi solo il compito della parte in corso: il resto della pagina è per dopo. In alternativa, incolla il messaggio “ESERCIZIO 2 — Simulazione completa” nella chat del progetto e fai la prova a voce con Claude.<\/p>","h":"Come usarla"},{"t":"task","html":"<p>L'esaminatore ti fa queste domande, una alla volta. Rispondi in 20–30 secondi ciascuna.<\/p><ol><li>Tell me about your family.<\/li><li>How do you usually keep up with the news?<\/li><li>What's your favourite time of year? Why?<\/li><li>What did you do on your last holiday?<\/li><li>Do you think people are too busy these days?<\/li><\/ol>","timer":180,"prep":null,"h":"Part 1 · Domande personali (3 min)"},{"t":"task","html":"<p><strong>Role-play 1:<\/strong> I'm your colleague. I can't come to the meeting we arranged for tomorrow. I'll start.<\/p><p><strong>Role-play 2:<\/strong> You need to borrow a friend's bike for a week. You start.<\/p>","timer":180,"prep":null,"h":"Part 2 · Role-play (3 min)"},{"t":"neg","h":"Part 3 · Discussione (3–4 min)","brief":"A local company wants to sponsor something for your town's teenagers. Discuss the options and decide together on the best one.","you":["Free summer sports camps","A music recording studio","Scholarships for study abroad"],"exam":["A new public Wi-Fi network","A careers fair with local companies","A community garden"]},{"t":"task","html":"<p>Timer: 30 secondi per gli appunti, poi 2 minuti di parola. Il modello è qui sotto, da aprire solo alla fine.<\/p>","timer":120,"prep":30,"h":"Part 4 · Monologo (4 min)"},{"t":"mono","h":"Part 4 · Il compito e il modello","topic":"Talk about a place where you feel relaxed.","prompts":["Where is it?","What do you do there?","Why does it help you relax?"],"notes":["where","how often / with whom","one memory","why relaxing","conclusion"],"model":["The place where I feel most relaxed is the mountains, in particular a small village in Carnia where my family used to go every summer.","It's about an hour and a half from my house. There isn't much there: a church, a bar, a few houses and lots of woods. We usually go there for a few days in August.","My favourite memory is from last summer. I got up very early, before everyone else, and walked up to a meadow above the village. There was nobody around, just the sound of the cows' bells in the distance. I sat there for almost an hour, just watching the light change on the mountains.","It helps me relax because there's no pressure: no emails, no timetable, and the phone signal is terrible, which is actually a good thing!","So, all in all, it's a simple place, but it's where I really recharge my batteries before the school year starts."],"follow":[{"q":"Do people need to go on holiday to relax?","a":"Not necessarily. I think it's more important to have small moments of rest every day, like a walk or a hobby. Holidays help, but they aren't enough on their own."},{"q":"Is it harder to relax today than in the past?","a":"I think so, because we're always connected. Work can reach us anywhere, at any time, so we have to learn to switch off on purpose."}]},{"t":"list","items":["<strong>Part 1<\/strong> — Ho risposto sempre con almeno 2 frasi (risposta + motivo/esempio)?","<strong>Part 2<\/strong> — Ho usato la frase funzionale giusta all'inizio (scusa, proposta, richiesta…)?","<strong>Part 3<\/strong> — Ho commentato almeno due idee dell'esaminatore e siamo arrivati a una decisione?","<strong>Part 4<\/strong> — Ho parlato per quasi 2 minuti con UNA storia e le 5 tappe?","<strong>Errori<\/strong> — Riascoltando la registrazione: quanti errori di tempo verbale? articoli? calchi? Scrivi i 3 più frequenti e ripassa la lezione collegata."],"h":"Autovalutazione (dopo aver riascoltato la registrazione)"}],"ch":"mk","_text":" Registra tutta la simulazione con il telefono. Non fermarti e non correggerti oltre un “sorry, I mean…”. Leggi solo il compito della parte in corso: il resto della pagina è per dopo. In alternativa, incolla il messaggio “ESERCIZIO 2 — Simulazione completa” nella chat del progetto e fai la prova a voce con Claude. Come usarla L'esaminatore ti fa queste domande, una alla volta. Rispondi in 20–30 secondi ciascuna. Tell me about your family. How do you usually keep up with the news? What's your favourite time of year? Why? What did you do on your last holiday? Do you think people are too busy these days? Part 1 · Domande personali (3 min) Role-play 1: I'm your colleague. I can't come to the meeting we arranged for tomorrow. I'll start. Role-play 2: You need to borrow a friend's bike for a week. You start. Part 2 · Role-play (3 min) Part 3 · Discussione (3–4 min) A local company wants to sponsor something for your town's teenagers. Discuss the options and decide together on the best one. Free summer sports camps A music recording studio Scholarships for study abroad A new public Wi-Fi network A careers fair with local companies A community garden Timer: 30 secondi per gli appunti, poi 2 minuti di parola. Il modello è qui sotto, da aprire solo alla fine. Part 4 · Monologo (4 min) Part 4 · Il compito e il modello Talk about a place where you feel relaxed. Where is it? What do you do there? Why does it help you relax? where how often / with whom one memory why relaxing conclusion The place where I feel most relaxed is the mountains, in particular a small village in Carnia where my family used to go every summer. It's about an hour and a half from my house. There isn't much there: a church, a bar, a few houses and lots of woods. We usually go there for a few days in August. My favourite memory is from last summer. I got up very early, before everyone else, and walked up to a meadow above the village. There was nobody around, just the sound of the cows' bells in the distance. I sat there for almost an hour, just watching the light change on the mountains. It helps me relax because there's no pressure: no emails, no timetable, and the phone signal is terrible, which is actually a good thing! So, all in all, it's a simple place, but it's where I really recharge my batteries before the school year starts. Do people need to go on holiday to relax? Not necessarily. I think it's more important to have small moments of rest every day, like a walk or a hobby. Holidays help, but they aren't enough on their own. Is it harder to relax today than in the past? I think so, because we're always connected. Work can reach us anywhere, at any time, so we have to learn to switch off on purpose. Part 1 — Ho risposto sempre con almeno 2 frasi (risposta + motivo/esempio)? Part 2 — Ho usato la frase funzionale giusta all'inizio (scusa, proposta, richiesta…)? Part 3 — Ho commentato almeno due idee dell'esaminatore e siamo arrivati a una decisione? Part 4 — Ho parlato per quasi 2 minuti con UNA storia e le 5 tappe? Errori — Riascoltando la registrazione: quanti errori di tempo verbale? articoli? calchi? Scrivi i 3 più frequenti e ripassa la lezione collegata. Autovalutazione (dopo aver riascoltato la registrazione) Fare una prova completa nei tempi reali (13 minuti) e trovare i 3 errori su cui lavorare."},{"id":"mk-day","n":"6.4","title":"Il giorno dell'esame","sub":"Checklist della vigi  Part 4 (una persona, un traguardo, un problema risolto): si adattano a quasi ogni argomento. Dormi. La fluidità dipende più dal sonno che da un'ora di studio in più. La sera prima Parla in inglese per 10 minuti prima di entrare (a voce bassa, in macchina, con un podcast). Part 1: prima frase = la domanda rigirata ( Do you like…? → Yes, I really like… ). Poi motivo + esempio. Part 2: la prima parola è la funzione ( Sorry… / Congratulations… / Could you… ). Part 3: chiedi le idee dell'esaminatore prima di difendere le tue. Chiudi con So, shall we go for…? Part 4: nei 30 secondi scrivi 5 parole e PAST . Una storia sola. Se sbagli: Sorry, I mean… e vai avanti. Un errore corretto vale come una frase giusta. Il giorno dell'esame Kit di emergenza Le 6 frasi da avere pronte Sorry, could you repeat that, please? That's a good question. Let me think… I see what you mean, but… What if we combined the two ideas? I'd like to talk about… Looking back, I think… Respira, avvia il timer e di' ad alta voce in inglese cosa farai nelle 4 parti dell'esame, come se lo spiegassi a un amico. Poi chiudi il computer. Allenati adesso Arrivare all'esame con la testa libera e una routine precisa per ogni parte."}],"tags":{"phone":"Telefono e comunicazione","manners":"Buone maniere","food":"Cibo e bevande","education":"Scuola e studio","travel":"Viaggi e trasporti","work":"Lavoro","freetime":"Tempo libero","sport":"Sport","home":"Casa e quartiere","tech":"Tecnologia","shopping":"Acquisti e soldi","weather":"Tempo atmosferico e stagioni","family":"Famiglia e amici","health":"Salute e stile di vita","festivals":"Feste e celebrazioni","media":"Media e notizie","environment":"Ambiente","town":"Città e servizi","events":"Eventi e organizzazione","format":"Formato e valutazione","strategy":"Strategia d'esame","fluency":"Fluidità e prendere tempo","functions":"Funzioni comunicative (Part 2)","negotiation":"Accordo, disaccordo, compromesso","storytelling":"Raccontare una storia","tense":"Tempi verbali" (function(){
const $ = (s, el=document) => el.querySelector(s);
const app = $('#app');
const L = DATA.lessons, CH = DATA.chapters, TG = DATA.tags, DAYS = DATA.days;
const byId = Object.fromEntries(L.map(l => [l.id, l]));
const chById = Object.fromEntries(CH.map(c => [c.id, c]));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TAGFIX = {tense:'tempi verbali', art:'articoli', prep:'preposizioni', calque:'calco', conn:'connettori', wo:'ordine parole', vocab:'lessico'};

// ---------- progress ----------
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem('b2lab-done') || '[]')); } catch(e) {}
function saveDone(){ try { localStorage.setItem('b2lab-done', JSON.stringify([...done])); } catch(e) {} }

// ---------- speech ----------
const tts = ('speechSynthesis' in window);
if (!tts) document.documentElement.classList.add('no-tts');
let voice = null;
function pickVoice(){ if(!tts) return; const v = speechSynthesis.getVoices(); voice = v.find(x=>/en[-_]GB/i.test(x.lang)) || v.find(x=>/^en/i.test(x.lang)) || null; }
if (tts){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text){
  if(!tts) return;
  try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g,'')); u.lang='en-GB'; if(voice) u.voice=voice; u.rate=.95; speechSynthesis.speak(u);}catch(e){}
}
document.addEventListener('click', e => {
  const b = e.target.closest('.say'); if(!b) return;
  e.preventDefault(); e.stopPropagation(); say(b.dataset.text || '');
});
const sayBtn = t => `<button class="say" type="button" data-text="${esc(String(t).replace(/<[^>]+>/g,''))}" aria-label="Ascolta">▶ ascolta</button>`;

// ---------- helpers ----------
const color = chId => `var(--${chById[chId].color})`;
function lcard(l){
  return `<a class="lcard${done.has(l.id)?' done':''}" style="--c:${color(l.ch)}" href="#l-${l.id}">
    <span class="n">${esc(l.n)}</span><span class="t">${esc(l.title)}</span><span class="m">${l.min}′</span>
    <span class="d">${esc(l.sub||'')}</span></a>`;
}
function setTab(v){ document.querySelectorAll('.tabs a').forEach(a=>{ if(a.dataset.view===v) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); }); }
function progressHTML(){
  const n = L.filter(l=>done.has(l.id)).length, pct = Math.round(n/L.length*100);
  return `<div class="progress-line"><span>${n} di ${L.length} lezioni completate</span><div class="bar"><i style="width:${pct}%"></i></div><span>${pct}%</span></div>`;
}

// ---------- views ----------
function viewChapters(){
  setTab('capitoli');
  const strip = `<div><div class="strip">
    <a class="s1" href="#l-p1-intro"><small>Part 1 · 3 min</small><strong>Domande personali</strong><span>4–5 temi, risposte brevi con un esempio</span></a>
    <a class="s2" href="#l-p2-phrases"><small>Part 2 · 3 min</small><strong>Role-play</strong><span>2 situazioni sociali: inizi tu / risponde l'esaminatore</span></a>
    <a class="s3" href="#l-p3-howto"><small>Part 3 · 3–4 min</small><strong>Negoziazione</strong><span>Decidere insieme partendo da idee diverse</span></a>
    <a class="s4" href="#l-p4-structure"><small>Part 4 · 4 min</small><strong>Monologo</strong><span>30″ appunti, 2′ di discorso, domande</span></a>
  </div><div class="strip-legend"><span>0′</span><span>esame: 13 minuti</span><span>13′</span></div></div>`;
  let h = `<section class="hero">
    <h1>Lezioni per lo Speaking B2</h1>
    <p>Tutto il percorso per LanguageCert Communicator B2 (EISOL): ${L.length} lezioni in ${CH.length} capitoli. Scegli un capitolo, filtra per argomento o parti da quanto tempo hai oggi.</p>
    ${strip}
    ${progressHTML()}
  </section><div class="chapters">`;
  for (const c of CH){
    const ls = L.filter(l=>l.ch===c.id);
    const nd = ls.filter(l=>done.has(l.id)).length;
    const mins = ls.reduce((a,l)=>a+l.min,0);
    h += `<section class="chapter" id="ch-${c.id}" style="--c:${color(c.id)}">
      <div class="ch-head"><div class="num">${esc(c.label)}</div><h2>${esc(c.title)}</h2><p>${esc(c.desc)}</p>
      <div class="count">${ls.length} lezioni · ${Math.round(mins/60*10)/10} h · ${nd}/${ls.length} fatte</div></div>
      <div class="lessons">${ls.map(lcard).join('')}</div></section>`;
  }
  app.innerHTML = h + '</div>';
}

function viewTopics(sel){
  setTab('argomenti');
  const count = t => L.filter(l=>l.tags.includes(t)).length;
  let h = `<section class="hero"><h1>Per argomento</h1><p>I temi di vita quotidiana su cui l'esaminatore fa domande, e le abilità da allenare. Tocca un argomento per vedere tutte le lezioni collegate, da ogni capitolo.</p></section>`;
  for (const g of DATA.tagGroups){
    h += `<div class="group-title">${esc(g.title)}</div><div class="chips">` +
      g.tags.map(t => `<a class="chip" href="#t-${t}" aria-current="${t===sel}">${esc(TG[t])} <b>${count(t)}</b></a>`).join('') + `</div>`;
  }
  if (sel && TG[sel]){
    const ls = L.filter(l=>l.tags.includes(sel));
    h += `<h2 class="section-h" id="sel">${esc(TG[sel])}</h2><div class="lessons">${ls.map(lcard).join('')}</div>`;
  } else {
    h += `<p class="empty" style="margin-top:24px">Scegli un argomento qui sopra.</p>`;
  }
  app.innerHTML = h;
  if (sel) { const s = $('#sel'); s && s.scrollIntoView({block:'start'}); }
}

let bucket = '10';
function viewTime(){
  setTab('tempo');
  const total = L.reduce((a,l)=>a+l.min,0);
  let h = `<section class="hero"><h1>Per tempo</h1><p>Due modi di usare il tempo: il percorso di ${DAYS.length} giorni (circa ${Math.round(total/DAYS.length)} minuti al giorno) oppure, se hai solo pochi minuti, scegli una lezione della durata giusta.</p>${progressHTML()}</section>`;
  h += `<h2 class="section-h">Percorso in ${DAYS.length} giorni</h2><div class="days">`;
  for (const d of DAYS){
    const ls = L.filter(l=>l.day===d.n);
    const mins = ls.reduce((a,l)=>a+l.min,0);
    h += `<article class="day"><header><h3>Giorno ${d.n} · ${esc(d.title)}</h3><span class="tot">${mins} min</span></header><p>${esc(d.desc)}</p><ol>` +
      ls.map(l=>`<li class="${done.has(l.id)?'done':''}"><a href="#l-${l.id}" style="--c:${color(l.ch)}"><span class="n">${esc(l.n)}</span><span>${esc(l.title)}</span><span class="m">${l.min}′</span></a></li>`).join('') +
      `</ol></article>`;
  }
  h += '</div>';
  h += `<h2 class="section-h">Ho pochi minuti</h2><div class="buckets" role="group" aria-label="Durata">` +
    [['all','Tutte'],['10','≤ 10 min'],['15','15 min'],['20','20 min'],['30','30+ min']].map(([k,t]) =>
      `<button type="button" data-b="${k}" aria-pressed="${bucket===k}">${t}</button>`).join('') + `</div>`;
  const inB = l => bucket==='all' || (bucket==='10'? l.min<=10 : bucket==='15'? (l.min>10&&l.min<=15) : bucket==='20'? (l.min>15&&l.min<=20) : l.min>20);
  h += `<div class="lessons" id="bk">${L.filter(inB).sort((a,b)=>a.min-b.min).map(lcard).join('')}</div>`;
  app.innerHTML = h;
  app.querySelectorAll('.buckets button').forEach(b => b.onclick = () => { bucket = b.dataset.b; viewTime(); $('#bk').scrollIntoView({block:'nearest'}); });
}

function viewSearch(q){
  const qq = q.toLowerCase();
  const hits = L.filter(l => (l.title+' '+l.sub+' '+l.tags.map(t=>TG[t]).join(' ')+' '+l._text).toLowerCase().includes(qq));
  app.innerHTML = `<section class="hero"><h1>Risultati per “${esc(q)}”</h1><p>${hits.length} lezioni trovate.</p></section><div class="lessons">${hits.map(lcard).join('') || '<p class="empty">Nessuna lezione. Prova con una parola in inglese (es. “apologise”, “holiday”) o in italiano (es. “articoli”).</p>'}</div>`;
}

// ---------- blocks ----------
function blk(b){
  const H = b.h ? `<h2>${esc(b.h)}</h2>` : '';
  switch(b.t){
    case 'p': return `<div class="blk">${H}${b.html}</div>`;
    case 'list': return `<div class="blk">${H}<ul class="plain">${b.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
    case 'qa': return `<div class="blk">${H}${b.note?`<p class="note">${b.note}</p>`:''}<div class="qa">${b.items.map(it=>`<details><summary><span>${esc(it.q)}</span><span class="hint">risposta modello</span></summary><div class="ans"><p>${it.a} ${sayBtn(it.a)}</p>${it.tip?`<p class="tip">${it.tip}</p>`:''}</div></details>`).join('')}</div></div>`;
    case 'phrases': return `<div class="blk">${H}<div class="phr">${b.groups.map(g=>`<div><h3>${esc(g.name)}</h3><ul>${g.items.map(i=>{const [en,it]=Array.isArray(i)?i:[i,'']; return `<li><span class="en">${en}</span>${it?`<span class="it">${it}</span>`:''}${sayBtn(en)}</li>`;}).join('')}</ul></div>`).join('')}</div></div>`;
    case 'fix': return `<div class="blk">${H}<div class="fix">${b.items.map(([w,r,why,tg])=>`<div class="row"><span class="w">${w}</span><span class="r">${r}</span><span class="why">${why||''}${tg?`<span class="tag">${TAGFIX[tg]||tg}</span>`:''}</span></div>`).join('')}</div></div>`;
    case 'vocab': return `<div class="blk">${H}<div style="overflow-x:auto"><table class="vocab">${b.items.map(([en,it])=>`<tr><td>${en}</td><td>${it}</td></tr>`).join('')}</table></div></div>`;
    case 'dlg': return `<div class="blk">${H}<div class="dlg">${b.ctx?`<div class="ctx">${b.ctx}</div>`:''}${b.lines.map(([w,t])=>`<div class="line${w==='You'?' you':''}"><span class="who">${esc(w)}</span><span>${t}</span></div>`).join('')}<div>${sayBtn(b.lines.map(x=>x[1]).join(' '))}</div></div></div>`;
    case 'task': return `<div class="blk">${H}<div class="card-task"><div class="lbl">Esercizio${b.timer?` · ${fmtT(b.timer)}${b.prep?` (+ ${b.prep}″ per pensare)`:''}`:''}</div>${b.html}${b.timer?timerHTML(b.timer,b.prep||0):''}${fbHTML(b.h||'Esercizio', b.html)}</div></div>`;
    case 'neg': return `<div class="blk">${H}<p>${b.brief}</p><div class="split"><div class="sheet"><h3>Le tue idee</h3><ul>${b.you.map(i=>`<li>${i}</li>`).join('')}</ul></div><div class="sheet"><h3>Idee dell'esaminatore</h3><ul>${b.exam.map(i=>`<li>${i}</li>`).join('')}</ul></div></div></div>`;
    case 'mono': return `<div class="blk">${H}<div class="card-task"><div class="lbl">Il compito</div><p><strong>${b.topic}</strong></p>${b.prompts?`<ul class="plain">${b.prompts.map(p=>`<li>${p}</li>`).join('')}</ul>`:''}${timerHTML(120,30)}${fbHTML('Part 4 – monologo', b.topic+' '+(b.prompts||[]).join(' '))}</div>
      <details class="reveal"><summary>Appunti in 30 secondi (esempio)</summary><div class="sheet"><ul>${b.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div></details>
      <details class="reveal"><summary>Monologo modello (circa 2 minuti)</summary><div class="mono-model">${b.model.map(p=>`<p>${p}</p>`).join('')}${sayBtn(b.model.join(' '))}</div></details>
      ${b.follow?`<details class="reveal"><summary>Domande di approfondimento</summary><div class="qa" style="margin-top:6px">${b.follow.map(it=>`<details><summary><span>${esc(it.q)}</span><span class="hint">risposta modello</span></summary><div class="ans"><p>${it.a} ${sayBtn(it.a)}</p></div></details>`).join('')}</div></details>`:''}</div>`;
    default: return '';
  }
}
function fmtT(s){ const m=Math.floor(s/60), r=s%60; return m? (r? `${m}′${r}″` : `${m} min`) : `${r}″`; }
function timerHTML(sec, prep){ return `<div class="timer" data-sec="${sec}" data-prep="${prep}"><button class="btn primary" type="button" data-act="go">Avvia</button><span class="phase">${prep?'pronto':'pronto'}</span><span class="clock">${clock(prep||sec)}</span><span class="tbar"><i></i></span><button class="btn" type="button" data-act="reset">Azzera</button></div>`; }
function clock(s){ s=Math.max(0,Math.ceil(s)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }

let actx=null;
function beep(f=880,d=.18){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.12,actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d); o.start(); o.stop(actx.currentTime+d);}catch(e){} }
const timers = new WeakMap();
document.addEventListener('click', e => {
  const b = e.target.closest('.timer .btn'); if(!b) return;
  const t = b.closest('.timer'); const st = timers.get(t);
  if (b.dataset.act==='reset'){ if(st) clearInterval(st.iv); timers.delete(t); t.className='timer'; $('.clock',t).textContent=clock(+t.dataset.prep||+t.dataset.sec); $('.phase',t).textContent='pronto'; $('.tbar i',t).style.width='0'; $('[data-act=go]',t).textContent='Avvia'; return; }
  if (st && st.running){ clearInterval(st.iv); st.running=false; st.left = st.end - Date.now(); b.textContent='Riprendi'; return; }
  const sec=+t.dataset.sec, prep=+t.dataset.prep;
  let s = st || {phase: prep? 'prep':'talk'};
  const dur = () => (s.phase==='prep'? prep: sec)*1000;
  s.end = Date.now() + (s.left ?? dur()); s.left = undefined; s.running = true; b.textContent='Pausa';
  timers.set(t, s); beep(660,.1);
  const tick = () => {
    const left = (s.end - Date.now())/1000, D = dur()/1000;
    t.classList.toggle('prep', s.phase==='prep');
    $('.phase',t).textContent = s.phase==='prep' ? 'pensa / appunti' : 'parla';
    $('.clock',t).textContent = clock(left);
    $('.tbar i',t).style.width = Math.min(100,(1-left/D)*100)+'%';
    if (left<=0){
      if (s.phase==='prep'){ s.phase='talk'; s.end = Date.now()+sec*1000; beep(990,.25); }
      else { clearInterval(s.iv); s.running=false; t.classList.add('over'); $('.phase',t).textContent='tempo scaduto'; b.textContent='Avvia'; timers.delete(t); beep(520,.4); setTimeout(()=>beep(520,.4),450); }
    }
  };
  tick(); s.iv = setInterval(tick, 250);
});


// ---------- feedback (correzione) ----------
let curLesson = null, sampleFn = null;
const PART = {c0:'Esame in generale', p1:'Part 1 (domande personali)', p2:'Part 2 (role-play)', p3:'Part 3 (negoziazione)', p4:'Part 4 (monologo)', gr:'Grammatica per parlare', mk:'Simulazione completa'};
const CRIT = {
  p1:"Valuta anche: ha risposto subito alla domanda, con un motivo e un esempio (formula A·R·E)? Il tempo verbale segue quello della domanda?",
  p2:"Valuta anche: ha usato la frase funzionale giusta (scusarsi, proporre, chiedere, lamentarsi…) con un registro cortese ma naturale? Ha sviluppato con un motivo o una proposta?",
  p3:"Valuta anche: ha commentato le idee dell'altro, proposto un compromesso e portato verso una decisione? Ha usato frasi di accordo/disaccordo?",
  p4:"Valuta anche: ha raccontato UNA sola storia seguendo le 5 tappe (introduzione, contesto, momento chiave, risultato, riflessione)? I dettagli sono chiari e non eccessivi? I connettori parlati sono presenti?",
  mk:"Valuta come un esaminatore LanguageCert B2 le parti presenti nel testo."
};
function fbHTML(title, taskHtml){
  const ctx = (title+' — '+String(taskHtml||'')).replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,1500);
  return `<div class="fb" data-ctx="${esc(ctx)}">
    <label>La tua risposta (per la correzione)</label>
    <textarea placeholder="Premi il microfono della tastiera del telefono e parla: la risposta viene scritta qui. Oppure scrivila."></textarea>
    <div class="row"><button class="btn primary fb-go" type="button">${sampleFn?'Correggimi':'Copia per la chat di correzione'}</button><span class="hint">${sampleFn?'La correzione arriva qui sotto, in italiano.':'Poi incollala nella chat del progetto EISOL.'}</span></div>
    <div class="fb-out" aria-live="polite"></div></div>`;
}
function buildPrompt(ctx, answer){
  const ch = curLesson ? curLesson.ch : 'p1';
  return `Sei un esaminatore e coach per l'esame LanguageCert / EISOL Communicator B2 Speaking. Lo studente è Pierluigi, italiano, al terzo tentativo: bocciato due volte non per le idee ma per imprecisioni formali sotto pressione.
I suoi errori ricorrenti, da controllare per primi: (1) tempi verbali, soprattutto past simple vs present perfect; (2) articoli; (3) preposizioni; (4) calchi dall'italiano; (5) connettori che spariscono nel parlato. Nella Part 4 anche la coerenza della storia.

Parte d'esame: ${PART[ch]||'Speaking'}
Lezione: ${curLesson ? curLesson.n+' '+curLesson.title : ''}
Compito: ${ctx}

Trascrizione della risposta parlata (fatta con la dettatura del telefono: ignora punteggiatura e maiuscole, e non contare come errori le parole palesemente sbagliate dal riconoscimento vocale):
<<<
${answer}
>>>

${CRIT[ch]||''}
Regole: segnala AL MASSIMO 3 errori, i più importanti, con priorità a quelli della lista. Non fare elenchi esaustivi. Sii diretto e pratico. Spiegazioni in italiano, frasi corrette in inglese naturale B2 (non molto più difficili di quello che ha detto).
Rispondi SOLO con un oggetto JSON con questa forma:
{"corretta": "la sua risposta riscritta corretta in inglese, mantenendo il suo contenuto e il suo stile",
 "errori": [{"sbagliato": "frase o pezzo come l'ha detto", "corretto": "versione corretta", "perche": "spiegazione breve in italiano", "tipo": "tempi|articoli|preposizioni|calco|connettori|altro"}],
 "bene": "una cosa fatta bene, in italiano, una frase",
 "livello": "A2|B1|B1+|B2",
 "focus": "l'unica cosa su cui concentrarsi la prossima volta, in italiano, una frase"}`;
}
const TIPO = {tempi:'tempi verbali · ricorrente', articoli:'articoli · ricorrente', preposizioni:'preposizioni · ricorrente', calco:'calco · ricorrente', connettori:'connettori · ricorrente', altro:'altro'};
function renderFb(r){
  const errs = Array.isArray(r.errori) ? r.errori.slice(0,3) : [];
  return `<div class="fb-card">
    <div><h4>Versione corretta</h4><p class="corr">${esc(r.corretta||'')} ${sayBtn(r.corretta||'')}</p></div>
    <div><h4>Errori principali</h4>${errs.length?`<div class="fix">${errs.map(e=>`<div class="row"><span class="w">${esc(e.sbagliato||'')}</span><span class="r">${esc(e.corretto||'')}</span><span class="why">${esc(e.perche||'')}<span class="tag">${esc(TIPO[e.tipo]||e.tipo||'')}</span></span></div>`).join('')}</div>`:'<p>Nessun errore importante. Ottimo.</p>'}</div>
    ${r.bene?`<div><h4>Fatto bene</h4><p>${esc(r.bene)}</p></div>`:''}
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h4 style="margin:0">Livello orientativo</h4><span class="lvl">${esc(r.livello||'?')}</span></div>
    ${r.focus?`<div class="focus"><h4>Prossima volta</h4><p>${esc(r.focus)}</p></div>`:''}
  </div>`;
}
const FB_ERR = {not_granted:'Correzione non autorizzata. Usa “Copia per la chat di correzione”.', sampling_disabled:'Claude non è disponibile qui. Usa “Copia per la chat di correzione”.', rate_limited:'Troppe richieste o limite di utilizzo raggiunto. Riprova tra poco.', session_expired:'Accedi di nuovo a Claude e riprova.', prompt_too_large:'Risposta troppo lunga: correggine una parte alla volta.', refused:'La correzione non è andata a buon fine. Riformula e riprova.', invalid_json:'Risposta non leggibile. Premi di nuovo “Correggimi”.'};
function setCopyMode(){
  document.querySelectorAll('.fb-go').forEach(x=>{ x.textContent='Copia per la chat di correzione'; x.nextElementSibling.textContent='Poi incollala nella chat del progetto EISOL.'; });
}
async function copyText(t, ta){
  try { await navigator.clipboard.writeText(t); return true; }
  catch(e){ ta.value = t; ta.select(); return false; }
}
document.addEventListener('click', async e => {
  const b = e.target.closest('.fb-go'); if(!b) return;
  const box = b.closest('.fb'), ta = $('textarea',box), out = $('.fb-out',box);
  const ans = ta.value.trim();
  if (ans.length < 15){ out.innerHTML = '<p class="status">Prima detta o scrivi la tua risposta (almeno una frase).</p>'; return; }
  const prompt = buildPrompt(box.dataset.ctx, ans);
  if (!sampleFn){
    const ok = await copyText(prompt, ta);
    out.innerHTML = `<p class="status">${ok?'Copiato. Ora incollalo nella chat del progetto EISOL B2 e invia: riceverai la correzione.':'Non riesco a copiare in automatico: ho messo il testo nel riquadro già selezionato. Copialo e incollalo nella chat del progetto.'}</p>`;
    return;
  }
  b.disabled = true; out.innerHTML = '<p class="status">Sto correggendo… (di solito 10–30 secondi)</p>';
  try {
    const r = await sampleFn.json(prompt);
    out.innerHTML = renderFb(r || {});
  } catch(err){
    const code = err && err.code;
    if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){ sampleFn = null; setCopyMode(); }
    if (code === 'cancelled') { out.innerHTML = ''; }
    else out.innerHTML = `<p class="status">${FB_ERR[code] || 'Qualcosa non ha funzionato. Riprova tra qualche secondo.'}</p>`;
  } finally { b.disabled = false; }
});
if (window.claude && typeof window.claude.use === 'function'){
  window.claude.use('sample').then(fn => {
    if (!fn) return; sampleFn = fn;
    document.querySelectorAll('.fb-go').forEach(x=>{ x.textContent='Correggimi'; x.nextElementSibling.textContent='La correzione arriva qui sotto, in italiano.'; });
  }).catch(()=>{});
}

function viewLesson(id){
  const l = byId[id]; if(!l) return viewChapters();
  curLesson = l;
  const c = chById[l.ch];
  const idx = L.indexOf(l), prev = L[idx-1], next = L[idx+1];
  setTab(null);
  app.innerHTML = `<article class="lesson" style="--c:${color(l.ch)}">
    <div class="crumbs"><a href="#capitoli">Capitoli</a>›<a href="#capitoli" data-ch="${c.id}">${esc(c.title)}</a></div>
    <header class="lhead"><div class="num">${esc(c.label)} · LEZIONE ${esc(l.n)}</div><h1>${esc(l.title)}</h1>
      <div class="meta"><span class="pill">${l.min} min</span><span class="pill">Giorno ${l.day}</span>${l.tags.map(t=>`<a class="pill" href="#t-${t}">${esc(TG[t])}</a>`).join('')}</div></header>
    <div class="goal"><b>Obiettivo</b>${l.goal}</div>
    ${l.blocks.map(blk).join('')}
    <div class="lfoot"><button class="btn${done.has(l.id)?'':' primary'}" type="button" id="markdone">${done.has(l.id)?'✓ Completata · annulla':'Segna come completata'}</button>
      <div class="nav">${prev?`<a class="btn" href="#l-${prev.id}">← ${esc(prev.n)}</a>`:''}${next?`<a class="btn" href="#l-${next.id}">${esc(next.n)} ${esc(next.title)} →</a>`:''}</div></div>
  </article>`;
  $('#markdone').onclick = () => { done.has(l.id) ? done.delete(l.id) : done.add(l.id); saveDone(); viewLesson(id); };
  const chLink = app.querySelector('[data-ch]'); chLink.onclick = e => { e.preventDefault(); location.hash='capitoli'; setTimeout(()=>{ const s=$('#ch-'+c.id); s&&s.scrollIntoView(); },30); };
  window.scrollTo(0,0);
}

// ---------- router ----------
function route(){
  if (tts) try{ speechSynthesis.cancel(); }catch(e){}
  const h = location.hash.replace(/^#/, '');
  if (h.startsWith('l-')) return viewLesson(h.slice(2));
  if (h.startsWith('t-')) return viewTopics(h.slice(2));
  if (h==='argomenti') return viewTopics(null);
  if (h==='tempo') return viewTime();
  viewChapters(); if (h.startsWith('ch-')){ const s=$('#'+h); s&&s.scrollIntoView(); } else window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
const q = $('#q'); let qt;
q.addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(() => { q.value.trim().length>1 ? viewSearch(q.value.trim()) : route(); }, 180); });
route();
})();
</script>
