at time the gym opens?","non: what time does the gym open"],["Do you know if there's a discount for teachers?",""],["I'd like to know how much the course costs.",""]]},{"name":"Chiarire","items":[["Sorry, did you say fifteen or fifty?",""],["So, just to check, …","riepilogare"],["Could you spell that, please?",""]]}]},{"t":"dlg","h":"Role-play A · inizia l'esaminatore","ctx":"I'm a receptionist at a sports centre. You phone to ask about swimming courses. I'll start.","lines":[["Examiner","Good morning, City Sports Centre. How can I help?"],["You","Good morning. I'm calling about your adult swimming courses. Could you tell me when they start?"],["Examiner","The next course starts on the fifteenth of October."],["You","Sorry, did you say the fifteenth or the fifth?"],["Examiner","The fifteenth. Tuesday and Thursday evenings."],["You","Great. And could you tell me how much it costs? Is there a discount if I sign up for the whole year?"],["Examiner","Yes, it's ten per cent off for the full year."],["You","Perfect. So, just to check: Tuesdays and Thursdays, from the fifteenth, with ten per cent off. Thank you very much."]]},{"t":"dlg","h":"Role-play B · inizi tu","ctx":"You're at a train station in England. Ask for information about getting to the airport. You start.","lines":[["You","Excuse me, could you tell me the quickest way to get to the airport?"],["Examiner","Sure. There's a direct train every thirty minutes from platform four."],["You","Do you know if I can buy the ticket on the train?"],["Examiner","You can, but it's more expensive. The machines are over there."],["You","Thanks. And how long does the journey take?"],["Examiner","About twenty-five minutes."],["You","Great, thanks for your help."]]},{"t":"fix","h":"Errori da evitare","items":[["Could you tell me what time does the gym open?","Could you tell me what time the gym opens?","Nella domanda indiretta l'ordine torna quello della frase affermativa.","wo"],["How much costs the course?","How much does the course cost?","Domanda diretta: serve “does”.","wo"]]},{"t":"task","html":"<p>Leggi la situazione, pensa 10 secondi, poi recita <em>entrambe<\/em> le parti ad alta voce (o chiedi a qualcuno di fare l'esaminatore). Ogni role-play dura circa 90 secondi.<\/p><ol><li>Phone a language school to ask about evening English courses. You start.<\/li><li>I'm a tourist in your town. I'm asking you for a good restaurant. I'll start.<\/li><li>You want to know the rules for bringing a bike on the train. Ask the ticket office. You start.<\/li><\/ol>","timer":90,"prep":10,"h":"Allenati adesso"}],"ch":"p2","_text":"Frasi pronte Domande indirette (più cortesi) Could you tell me what time the gym opens? non: what time does the gym open Do you know if there's a discount for teachers? I'd like to know how much the course costs. Chiarire Sorry, did you say fifteen or fifty? So, just to check, … riepilogare Could you spell that, please? Role-play A · inizia l'esaminatore I'm a receptionist at a sports centre. You phone to ask about swimming courses. I'll start. Examiner Good morning, City Sports Centre. How can I help? You Good morning. I'm calling about your adult swimming courses. Could you tell me when they start? Examiner The next course starts on the fifteenth of October. You Sorry, did you say the fifteenth or the fifth? Examiner The fifteenth. Tuesday and Thursday evenings. You Great. And could you tell me how much it costs? Is there a discount if I sign up for the whole year? Examiner Yes, it's ten per cent off for the full year. You Perfect. So, just to check: Tuesdays and Thursdays, from the fifteenth, with ten per cent off. Thank you very much. Role-play B · inizi tu You're at a train station in England. Ask for information about getting to the airport. You start. You Excuse me, could you tell me the quickest way to get to the airport? Examiner Sure. There's a direct train every thirty minutes from platform four. You Do you know if I can buy the ticket on the train? Examiner You can, but it's more expensive. The machines are over there. You Thanks. And how long does the journey take? Examiner About twenty-five minutes. You Great, thanks for your help. Errori da evitare Could you tell me what time does the gym open? Could you tell me what time the gym opens? Nella domanda indiretta l'ordine torna quello della frase affermativa. wo How much costs the course? How much does the course cost? Domanda diretta: serve “does”. wo Leggi la situazione, pensa 10 secondi, poi recita entrambe le parti ad alta voce (o chiedi a qualcuno di fare l'esaminatore). Ogni role-play dura circa 90 secondi. Phone a language school to ask about evening English courses. You start. I'm a tourist in your town. I'm asking you for a good restaurant. I'll start. You want to know the rules for bringing a bike on the train. Ask the ticket office. You start. Allenati adesso Fare domande indirette e cortesi e chiedere chiarimenti."},{"id":"p3-howto","n":"3.0","title":"Come si vince la Part 3","sub":"Valutare, confrontare, cedere, decidere","tags":["negotiation","strategy","format"],"min":10,"day":6,"goal":"Seguire uno schema in 4 fasi per arrivare a una decisione in 3–4 minuti, senza monologhi.","blocks":[{"t":"p","html":"<p>Tu e l'esaminatore avete un obiettivo comune (organizzare un evento, spendere un budget…) e due liste diverse. Non vince chi ha le idee migliori: vince chi <strong>interagisce<\/strong>, cioè ascolta, commenta le idee dell'altro, propone e arriva a un accordo.<\/p>","h":null},{"t":"list","items":["<strong>1. Apri e presenta (30″)<\/strong> — <em>So, we need to decide… I've got a few ideas. What about you?<\/em>","<strong>2. Valuta le idee dell'altro (1′)<\/strong> — commenta almeno due sue idee, con un motivo: <em>That's a good idea because… / I'm not sure about…, because…<\/em>","<strong>3. Confronta e negozia (1′30″)<\/strong> — <em>Your idea is cheaper, but mine would…<\/em> · proponi un compromesso: <em>What if we combined…?<\/em>","<strong>4. Decidi e riassumi (30″)<\/strong> — <em>So, shall we go for…? · Great, so we've agreed on…<\/em>"],"h":"Le 4 fasi"},{"t":"fix","h":"Errori da evitare","items":[["I am agree with you.","I agree with you.","Errore classico: “agree” è un verbo.","calque"],["In my opinion I think that…","In my opinion, … / I think…","Doppione: scegli uno dei due.","calque"],["It's a good idea, but it costs too much money, it's far, and people don't like it, and…","It's a good idea, but I'm worried about the cost.","Un motivo chiaro vale più di una lista. Lascia spazio all'esaminatore.",""]]},{"t":"task","html":"<p>Senza compagno: prendi due idee qualsiasi (<em>a picnic<\/em> vs <em>a restaurant dinner<\/em>) e fai a voce alta le 4 fasi da solo, recitando anche le battute dell'esaminatore.<\/p>","timer":180,"prep":null,"h":"Allenati adesso"}],"ch":"p3","_text":" Tu e l'esaminatore avete un obiettivo comune (organizzare un evento, spendere un budget…) e due liste diverse. Non vince chi ha le idee migliori: vince chi interagisce , cioè ascolta, commenta le idee dell'altro, propone e arriva a un accordo. 1. Apri e presenta (30″) — So, we need to decide… I've got a few ideas. What about you? 2. Valuta le idee dell'altro (1′) — commenta almeno due sue idee, con un motivo: That's a good idea because… / I'm not sure about…, because… 3. Confronta e negozia (1′30″) — Your idea is cheaper, but mine would… · proponi un compromesso: What if we combined…? 4. Decidi e riassumi (30″) — So, shall we go for…? · Great, so we've agreed on… Le 4 fasi Errori da evitare I am agree with you. I agree with you. Errore classico: “agree” è un verbo. calque In my opinion I think that… In my opinion, … / I think… Doppione: scegli uno dei due. calque It's a good idea, but it costs too much money, it's far, and people don't like it, and… It's a good idea, but I'm worried about the cost. Un motivo chiaro vale più di una lista. Lascia spazio all'esaminatore. Senza compagno: prendi due idee qualsiasi ( a picnic vs a restaurant dinner ) e fai a voce alta le 4 fasi da solo, recitando anche le battute dell'esaminatore. Allenati adesso Seguire uno schema in 4 fasi per arrivare a una decisione in 3–4 minuti, senza monologhi."},{"id":"p3-phrases","n":"3.1","title":"Frasi per negoziare","sub":"Accordo, disaccordo, proposte, decisioni","tags":["negotiation","connectors","fluency"],"min":15,"day":6,"goal":"Avere 2 frasi pronte per ogni momento della negoziazione, dal più morbido al più deciso.","blocks":[{"t":"phrases","h":"Frasi pronte","groups":[{"name":"Aprire","items":[["So, we need to decide on…",""],["Shall I start? / Would you like to start?",""],["Let's look at the options.",""]]},{"name":"Chiedere l'opinione dell'altro","items":[["What do you think about…?",""],["How do you feel about…?",""],["Which of your ideas do you like best?",""]]},{"name":"Essere d'accordo","items":[["That's a great idea.",""],["I couldn't agree more.","d'accordissimo"],["Good point — I hadn't thought of that.",""],["Yes, and on top of that…","aggiungere"]]},{"name":"Essere in parte d'accordo","items":[["I see what you mean, but…",""],["That's true, although…",""],["You've got a point, but have you considered…?",""]]},{"name":"Non essere d'accordo (con garbo)","items":[["I'm not sure that's the best option, because…",""],["I'm afraid I don't really agree.",""],["I see your point, but I think… would work better.",""],["The problem with that is…",""]]},{"name":"Proporre un compromesso","items":[["What if we combined the two ideas?",""],["How about a compromise? We could…",""],["Maybe we could do both, if…",""],["OK, I'm happy to go with your idea if we also…",""]]},{"name":"Decidere e riassumere","items":[["So, shall we go for…?",""],["Are we agreed, then?",""],["So, to sum up, we've decided to…",""]]}]},{"t":"fix","h":"Errori da evitare","items":[["I don't agree with you about this thing.","I don't really agree with that.","“This thing” = calco di “questa cosa”.","calque"],["According to me…","In my view… / I think…","“According to” si usa per gli altri, non per sé.","calque"],["We could make a party.","We could have / throw a party.","Una festa si “have” o “throw”.","calque"]]},{"t":"task","html":"<p>Rispondi a queste proposte dell'esaminatore usando <em>ogni volta<\/em> un gruppo diverso (accordo, accordo parziale, disaccordo, compromesso):<br>1. “Let's hire a famous chef.”<br>2. “I think we should do it on a Sunday.”<br>3. “We could ask each student to pay €20.”<br>4. “Why don't we invite the local newspaper?”<\/p>","timer":120,"prep":null,"h":"Allenati adesso"}],"ch":"p3","_text":"Frasi pronte Aprire So, we need to decide on… Shall I start? / Would you like to start? Let's look at the options. Chiedere l'opinione dell'altro What do you think about…? How do you feel about…? Which of your ideas do you like best? Essere d'accordo That's a great idea. I couldn't agree more. d'accordissimo Good point — I hadn't thought of that. Yes, and on top of that… aggiungere Essere in parte d'accordo I see what you mean, but… That's true, although… You've got a point, but have you considered…? Non essere d'accordo (con garbo) I'm not sure that's the best option, because… I'm afraid I don't really agree. I see your point, but I think… would work better. The problem with that is… Proporre un compromesso What if we combined the two ideas? How about a compromise? We could… Maybe we could do both, if… OK, I'm happy to go with your idea if we also… Decidere e riassumere So, shall we go for…? Are we agreed, then? So, to sum up, we've decided to… Errori da evitare I don't agree with you about this thing. I don't really agree with that. “This thing” = calco di “questa cosa”. calque According to me… In my view… / I think… “According to” si usa per gli altri, non per sé. calque We could make a party. We could have / throw a party. Una festa si “have” o “throw”. calque Rispondi a queste proposte dell'esaminatore usando ogni volta un gruppo diverso (accordo, accordo parziale, disaccordo, compromesso): 1. “Let's hire a famous chef.” 2. “I think we should do it on a Sunday.” 3. “We could ask each student to pay €20.” 4. “Why don't we invite the local newspaper?” Allenati adesso Avere 2 frasi pronte per ogni momento della negoziazione, dal più morbido al più deciso."},{"id":"p3-schoolday","n":"3.2","title":"Festa di fine anno a scuola","sub":"Decidere come celebrare la fine dell'anno scolastico","tags":["negotiation","events","education"],"min":20,"day":6,"goal":"Negoziare un evento scolastico commentando le idee dell'altro prima di proporre le tue.","blocks":[{"t":"neg","h":"Il compito","brief":"Your school wants to organise an event to celebrate the end of the school year. You have a budget of €1,500. Discuss the ideas and decide together on <strong>one<\/strong> event.","you":["A trip to an amusement park","A sports tournament with parents","A concert with student bands"],"exam":["A dinner in a local restaurant","An exhibition of the students' projects","A day at the beach"]},{"t":"dlg","h":"Discussione modello (circa 3 minuti)","ctx":null,"lines":[["Examiner","So, we need to decide how to celebrate the end of the school year. What ideas have you got?"],["You","Well, I was thinking about a sports tournament with parents, or a concert with student bands. But first, what are your ideas?"],["Examiner","I thought about an exhibition of the students' projects, or maybe a day at the beach."],["You","I really like the idea of an exhibition, because students could show what they've learnt during the year. The beach, on the other hand, might be difficult, because it's quite far and we'd need to pay for coaches."],["Examiner","That's true. But students love going to the beach at the end of the year."],["You","I see what you mean, but I think the transport would use up most of the budget. What if we combined the exhibition with the concert? In the afternoon, visitors could see the projects, and in the evening the student bands could play."],["Examiner","That's an interesting idea. Would parents come?"],["You","I think so, especially if their children are performing. And it would be cheap, because we could do it at school. We could spend the money on a sound system and some food."],["Examiner","OK, I'm convinced. So, shall we go for the exhibition and the concert?"],["You","Yes. So, to sum up, we've agreed on an exhibition in the afternoon and a concert in the evening, at school, with food for everyone."]]},{"t":"list","items":["Chiede subito le idee dell'esaminatore (<em>But first, what are your ideas?<\/em>): interazione.","Commenta due idee dell'altro con un motivo (<em>because… / might be difficult, because…<\/em>).","Il disaccordo è morbido (<em>I see what you mean, but…<\/em>) e arriva con una proposta (<em>What if we combined…?<\/em>).","Chiusura con riepilogo al present perfect: <em>we've agreed on…<\/em>"],"h":"Cosa notare nel modello"},{"t":"task","html":"<p>Rifai la stessa discussione, ma questa volta prova a convincere l'esaminatore a scegliere la <em>gita al parco divertimenti<\/em>. Recita entrambe le parti oppure falla con Claude in modalità vocale.<\/p>","timer":210,"prep":20,"h":"Ora tocca a te"}],"ch":"p3","_text":"Il compito Your school wants to organise an event to celebrate the end of the school year. You have a budget of €1,500. Discuss the ideas and decide together on one event. A trip to an amusement park A sports tournament with parents A concert with student bands A dinner in a local restaurant An exhibition of the students' projects A day at the beach Discussione modello (circa 3 minuti) Examiner So, we need to decide how to celebrate the end of the school year. What ideas have you got? You Well, I was thinking about a sports tournament with parents, or a concert with student bands. But first, what are your ideas? Examiner I thought about an exhibition of the students' projects, or maybe a day at the beach. You I really like the idea of an exhibition, because students could show what they've learnt during the year. The beach, on the other hand, might be difficult, because it's quite far and we'd need to pay for coaches. Examiner That's true. But students love going to the beach at the end of the year. You I see what you mean, but I think the transport would use up most of the budget. What if we combined the exhibition with the concert? In the afternoon, visitors could see the projects, and in the evening the student bands could play. Examiner That's an interesting idea. Would parents come? You I think so, especially if their children are performing. And it would be cheap, because we could do it at school. We could spend the money on a sound system and some food. Examiner OK, I'm convinced. So, shall we go for the exhibition and the concert? You Yes. So, to sum up, we've agreed on an exhibition in the afternoon and a concert in the evening, at school, with food for everyone. Chiede subito le idee dell'esaminatore ( But first, what are your ideas? ): interazione. Commenta due idee dell'altro con un motivo ( because… / might be difficult, because… ). Il disaccordo è morbido ( I see what you mean, but… ) e arriva con una proposta ( What if we combined…? ). Chiusura con riepilogo al present perfect: we've agreed on… Cosa notare nel modello Rifai la stessa discussione, ma questa volta prova a convincere l'esaminatore a scegliere la gita al parco divertimenti . Recita entrambe le parti oppure falla con Claude in modalità vocale. Ora tocca a te Negoziare un evento scolastico commentando le idee dell'altro prima di proporre le tue."},{"id":"p3-teambuilding","n":"3.3","title":"Giornata di team building","sub":"Un'attività per i colleghi","tags":["negotiation","work","events"],"min":20,"day":7,"goal":"Proporre, obiettare e fare concessioni in un contesto di lavoro.","blocks":[{"t":"neg","h":"Il compito","brief":"Your company (or school) wants to organise a team-building day for 30 staff members to improve relationships between colleagues. Discuss the options and choose the best one.","you":["A cooking class","A hiking day in the mountains","A volunteering day in the community"],"exam":["An escape room","A sailing trip","A training workshop with a speaker"]},{"t":"dlg","h":"Discussione modello (circa 3 minuti)","ctx":null,"lines":[["Examiner","Right, we need to choose an activity for the team-building day. Would you like to start?"],["You","Sure. I think a hiking day in the mountains would be great, because people could talk while walking and enjoy the fresh air. What do you think?"],["Examiner","It sounds nice, but not everyone is fit enough for a long walk."],["You","Good point, I hadn't thought of that. We could choose an easy path, though. What about your ideas?"],["Examiner","I like the escape room. You really have to work together to get out."],["You","That's true, it's perfect for teamwork. The only problem is that most escape rooms are for groups of five or six, so we'd need to book several rooms, and people would be split up."],["Examiner","Hmm, you're right. What about the cooking class?"],["You","I like it a lot. Everybody can take part, it doesn't matter how fit you are, and at the end we eat together, which is the best way to get to know people."],["Examiner","OK, I agree. Although I'd still like something a bit more active."],["You","How about a compromise? We could do a short walk in the morning and the cooking class in the afternoon."],["Examiner","Perfect. Let's do that."]]},{"t":"list","items":["Accetta l'obiezione (<em>Good point, I hadn't thought of that<\/em>) senza abbandonare l'idea.","Critica l'idea dell'altro in modo costruttivo (<em>The only problem is that…<\/em>).","Usa condizionali: <em>we'd need to…, people would be…<\/em>","Il compromesso arriva quando l'esaminatore insiste."],"h":"Cosa notare nel modello"},{"t":"task","html":"<p>Stesso compito, nuova regola: il budget è di soli €500. Quale attività diventa la migliore? Discutila in 3 minuti.<\/p>","timer":210,"prep":20,"h":"Ora tocca a te"}],"ch":"p3","_text":"Il compito Your company (or school) wants to organise a team-building day for 30 staff members to improve relationships between colleagues. Discuss the options and choose the best one. A cooking class A hiking day in the mountains A volunteering day in the community An escape room A sailing trip A training workshop with a speaker Discussione modello (circa 3 minuti) Examiner Right, we need to choose an activity for the team-building day. Would you like to start? You Sure. I think a hiking day in the mountains would be great, because people could talk while walking and enjoy the fresh air. What do you think? Examiner It sounds nice, but not everyone is fit enough for a long walk. You Good point, I hadn't thought of that. We could choose an easy path, though. What about your ideas? Examiner I like the escape room. You really have to work together to get out. You That's true, it's perfect for teamwork. The only problem is that most escape rooms are for groups of five or six, so we'd need to book several rooms, and people would be split up. Examiner Hmm, you're right. What about the cooking class? You I like it a lot. Everybody can take part, it doesn't matter how fit you are, and at the end we eat together, which is the best way to get to know people. Examiner OK, I agree. Although I'd still like something a bit more active. You How about a compromise? We could do a short walk in the morning and the cooking class in the afternoon. Examiner Perfect. Let's do that. Accetta l'obiezione ( Good point, I hadn't thought of that ) senza abbandonare l'idea. Critica l'idea dell'altro in modo costruttivo ( The only problem is that… ). Usa condizionali: we'd need to…, people would be… Il compromesso arriva quando l'esaminatore insiste. Cosa notare nel modello Stesso compito, nuova regola: il budget è di soli €500. Quale attività diventa la migliore? Discutila in 3 minuti. Ora tocca a te Proporre, obiettare e fare concessioni in un contesto di lavoro."},{"id":"p3-charity","n":"3.4","title":"Raccolta fondi benefica","sub":"Raccogliere soldi per un'associazione locale","tags":["negotiation","events","town"],"min":20,"day":10,"goal":"Confrontare vantaggi e svantaggi (costo, partecipazione, organizzazione) con comparativi corretti.","blocks":[{"t":"neg","h":"Il compito","brief":"Your town wants to raise money for the local hospital's children's ward. Discuss the ideas and decide which event would raise the most money.","you":["A charity run","A second-hand book sale","A quiz night"],"exam":["A dinner with a local celebrity","A raffle with prizes from local shops","A car wash organised by students"]},{"t":"dlg","h":"Discussione modello (circa 3 minuti)","ctx":null,"lines":[["Examiner","We need to raise money for the children's ward. Which idea do you like best?"],["You","Personally, I'd go for a charity run. Lots of people run these days, and each runner could pay an entry fee. How do you feel about that?"],["Examiner","It's a good idea, but organising a run is complicated. You need permission to close the roads."],["You","That's true, it's more complicated than the other options. What about your raffle idea? How would it work?"],["Examiner","Local shops donate prizes, and we sell tickets for five euros."],["You","I like it, because it's cheap to organise and shops get some publicity. But I'm not sure it would raise as much money as the run."],["Examiner","Maybe not, but more people would take part. Not everyone runs."],["You","You've got a point. What if we did both? We could sell raffle tickets at the finish line of the run, so people who come to watch can also help."],["Examiner","That's clever. Let's do that, and keep it simple: a short run in the park, so we don't need to close any roads."],["You","Great. So we've decided on a charity run in the park, with a raffle at the end."]]},{"t":"list","items":["Comparativi: <em>more complicated than<\/em>, <em>as much money as<\/em>.","Domanda di chiarimento sull'idea altrui (<em>How would it work?<\/em>): ottima interazione.","L'esaminatore risolve il tuo problema e tu lo accetti: la decisione è davvero condivisa."],"h":"Cosa notare nel modello"},{"t":"task","html":"<p>Stessa situazione: questa volta sostieni il <em>quiz night<\/em> e trova due motivi per cui è migliore della lotteria.<\/p>","timer":210,"prep":20,"h":"Ora tocca a te"}],"ch":"p3","_text":"Il compito Your town wants to raise money for the local hospital's children's ward. Discuss the ideas and decide which event would raise the most money. A charity run A second-hand book sale A quiz night A dinner with a local celebrity A raffle with prizes from local shops A car wash organised by students Discussione modello (circa 3 minuti) Examiner We need to raise money for the children's ward. Which idea do you like best? You Personally, I'd go for a charity run. Lots of people run these days, and each runner could pay an entry fee. How do you feel about that? Examiner It's a good idea, but organising a run is complicated. You need permission to close the roads. You That's true, it's more complicated than the other options. What about your raffle idea? How would it work? Examiner Local shops donate prizes, and we sell tickets for five euros. You I like it, because it's cheap to organise and shops get some publicity. But I'm not sure it would raise as much money as the run. Examiner Maybe not, but more people would take part. Not everyone runs. You You've got a point. What if we did both? We could sell raffle tickets at the finish line of the run, so people who come to watch can also help. Examiner That's clever. Let's do that, and keep it simple: a short run in the park, so we don't need to close any roads. You Great. So we've decided on a charity run in the park, with a raffle at the end. Comparativi: more complicated than , as much money as . Domanda di chiarimento sull'idea altrui ( How would it work? ): ottima interazione. L'esaminatore risolve il tuo problema e tu lo accetti: la decisione è davvero condivisa. Cosa notare nel modello Stessa situazione: questa volta sostieni il quiz night e trova due motivi per cui è migliore della lotteria. Ora tocca a te Confrontare vantaggi e svantaggi (costo, partecipazione, organizzazione) con comparativi corretti."},{"id":"p3-town","n":"3.5","title":"Il budget del comune per i giovani","sub":"Come spendere €20.000 per i ragazzi","tags":["negotiation","town","freetime"],"min":20,"day":10,"goal":"Sostenere un'opinione con esempi concreti e arrivare a una priorità.","blocks":[{"t":"neg","h":"Il compito","brief":"Your town council has €20,000 to spend on something for teenagers. Discuss the options and agree on the best way to spend the money.","you":["A new skate park","Free coding and robotics courses","Longer opening hours for the library"],"exam":["A youth centre with a café","A free bus service on Saturday nights","New equipment for the sports hall"]},{"t":"dlg","h":"Discussione modello (circa 3 minuti)","ctx":null,"lines":[["Examiner","So, how do you think we should spend the money?"],["You","I think free coding and robotics courses would be really useful, because they give young people skills for the future. I see it with my students — they love this kind of thing. What's your view?"],["Examiner","I think a youth centre would be better. Teenagers need somewhere to meet."],["You","I agree that they need a place to meet, that's a real problem in small towns. But €20,000 isn't enough to build and run a centre, is it?"],["Examiner","Maybe not a new building, but we could use an old one."],["You","That's a good point. In that case, we could hold the coding courses in the youth centre. Then it's not just a place to hang out, but also somewhere to learn."],["Examiner","I like that. And what about the Saturday night bus?"],["You","It's important for safety, but I think it would cost a lot every year, so it's not a one-off expense. Maybe the council could look at it next year."],["Examiner","Fair enough. So, the youth centre with courses?"],["You","Yes, let's go for that."]]},{"t":"list","items":["Esempio personale (<em>I see it with my students<\/em>): rende l'opinione credibile.","Question tag per coinvolgere: <em>isn't enough…, is it?<\/em>","Rifiuto motivato di una terza idea (<em>it's not a one-off expense<\/em>)."],"h":"Cosa notare nel modello"},{"t":"task","html":"<p>Riprova la discussione sostenendo lo <em>skate park<\/em>. Obiettivo: usa almeno 3 frasi diverse della lezione 3.1.<\/p>","timer":210,"prep":20,"h":"Ora tocca a te"}],"ch":"p3","_text":"Il compito Your town council has €20,000 to spend on something for teenagers. Discuss the options and agree on the best way to spend the money. A new skate park Free coding and robotics courses Longer opening hours for the library A youth centre with a café A free bus service on Saturday nights New equipment for the sports hall Discussione modello (circa 3 minuti) Examiner So, how do you think we should spend the money? You I think free coding and robotics courses would be really useful, because they give young people skills for the future. I see it with my students — they love this kind of thing. What's your view? Examiner I think a youth centre would be better. Teenagers need somewhere to meet. You I agree that they need a place to meet, that's a real problem in small towns. But €20,000 isn't enough to build and run a centre, is it? Examiner Maybe not a new building, but we could use an old one. You That's a good point. In that case, we could hold the coding courses in the youth centre. Then it's not just a place to hang out, but also somewhere to learn. Examiner I like that. And what about the Saturday night bus? You It's important for safety, but I think it would cost a lot every year, so it's not a one-off expense. Maybe the council could look at it next year. Examiner Fair enough. So, the youth centre with courses? You Yes, let's go for that. Esempio personale ( I see it with my students ): rende l'opinione credibile. Question tag per coinvolgere: isn't enough…, is it? Rifiuto motivato di una terza idea ( it's not a one-off expense ). Cosa notare nel modello Riprova la discussione sostenendo lo skate park . Obiettivo: usa almeno 3 frasi diverse della lezione 3.1. Ora tocca a te Sostenere un'opinione con esempi concreti e arrivare a una priorità."},{"id":"p3-exchange","n":"3.6","title":"Accoglienza studenti stranieri","sub":"Programma per un gruppo di studenti inglesi","tags":["negotiation","education","travel"],"min":20,"day":12,"goal":"Pianificare un programma mettendo in ordine di priorità, con il futuro e i condizionali.","blocks":[{"t":"neg","h":"Il compito","brief":"A group of 20 British students is coming to your school for three days. Plan the programme together. You can choose <strong>three<\/strong> activities.","you":["A guided tour of Venice","A day in the school labs with Italian students","A pizza-making workshop"],"exam":["A visit to a local factory","A hike in the Dolomites","An evening with Italian families"]},{"t":"dlg","h":"Discussione modello (circa 3 minuti)","ctx":null,"lines":[["Examiner","We can only choose three activities. Where shall we start?"],["You","I think the most important thing is that they spend time with Italian students, so I'd definitely include a day in the labs. They could build a small project together."],["Examiner","Yes, I agree with that. I'd also include an evening with Italian families."],["You","That's a lovely idea. They'd see real Italian life, and it doesn't cost anything. So that's two. For the third one, I'd suggest Venice — they can't come all this way and not see it!"],["Examiner","Venice is beautiful, but it's very crowded and expensive. What about a visit to a local factory? There are some famous companies near here."],["You","Hmm, I see your point, and it would be interesting for technical students. But I think for teenagers Venice would be more memorable."],["Examiner","Maybe we could do the factory in the morning and a short walk in Venice in the afternoon?"],["You","That might be a bit tiring, but if the factory is on the way, why not? OK, let's go for that."]]},{"t":"list","items":["Organizzazione chiara: <em>So that's two. For the third one…<\/em>","Doppio ragionamento: riconosce il punto dell'altro e poi difende il suo (<em>I see your point… But…<\/em>).","Accetta con condizione: <em>if the factory is on the way, why not?<\/em>"],"h":"Cosa notare nel modello"},{"t":"task","html":"<p>Nuova versione: il gruppo resta solo un giorno e il budget è minimo. Scegli <em>una<\/em> attività con l'esaminatore.<\/p>","timer":210,"prep":20,"h":"Ora tocca a te"}],"ch":"p3","_text":"Il compito A group of 20 British students is coming to your school for three days. Plan the programme together. You can choose three activities. A guided tour of Venice A day in the school labs with Italian students A pizza-making workshop A visit to a local factory A hike in the Dolomites An evening with Italian families Discussione modello (circa 3 minuti) Examiner We can only choose three activities. Where shall we start? You I think the most important thing is that they spend time with Italian students, so I'd definitely include a day in the labs. They could build a small project together. Examiner Yes, I agree with that. I'd also include an evening with Italian families. You That's a lovely idea. They'd see real Italian life, and it doesn't cost anything. So that's two. For the third one, I'd suggest Venice — they can't come all this way and not see it! Examiner Venice is beautiful, but it's very crowded and expensive. What about a visit to a local factory? There are some famous companies near here. You Hmm, I see your point, and it would be interesting for technical students. But I think for teenagers Venice would be more memorable. Examiner Maybe we could do the factory in the morning and a short walk in Venice in the afternoon? You That might be a bit tiring, but if the factory is on the way, why not? OK, let's go for that. Organizzazione chiara: So that's two. For the third one… Doppio ragionamento: riconosce il punto dell'altro e poi difende il suo ( I see your point… But… ). Accetta con condizione: if the factory is on the way, why not? Cosa notare nel modello Nuova versione: il gruppo resta solo un giorno e il budget è minimo. Scegli una attività con l'esaminatore. Ora tocca a te Pianificare un programma mettendo in ordine di priorità, con il futuro e i condizionali."},{"id":"p3-club","n":"3.7","title":"L'anniversario della società sportiva","sub":"Celebrare 50 anni di un club","tags":["negotiation","sport","events","festivals"],"min":20,"day":8,"goal":"Negoziare con lessico dello sport e degli eventi, mantenendo l'interazione.","blocks":[{"t":"neg","h":"Il compito","brief":"Your local sports club is celebrating its 50th anniversary. Discuss how to celebrate and choose the two best ideas.","you":["An open day with free lessons for children","A photo exhibition about the club's history","A match against a famous team"],"exam":["A gala dinner for members","A club T-shirt for everyone","A video with interviews with old members"]},{"t":"dlg","h":"Discussione modello (circa 3 minuti)","ctx":null,"lines":[["Examiner","Fifty years is a big anniversary. What do you think we should do?"],["You","I think an open day with free lessons for children would be perfect. It's a celebration, but it also brings new members to the club. What do you think?"],["Examiner","I like that. I also like the idea of a gala dinner for members."],["You","It would be nice, but it might be expensive, and not everyone would come. How about combining it with the history? We could make a video with interviews with old members and show it during a simple dinner at the club."],["Examiner","That's a great idea. People love seeing old photos and videos."],["You","Exactly. Some of the founders are still alive, so it would be really moving to hear their stories."],["Examiner","OK, so the open day and the dinner with the video?"],["You","Yes, I think that's the best combination: one event for the community and one for the members."]]},{"t":"list","items":["Ogni idea ha uno scopo (<em>it also brings new members<\/em>): il “perché” è ciò che l'esaminatore vuole sentire.","Chiusura con giustificazione finale: <em>one event for the community and one for the members<\/em>."],"h":"Cosa notare nel modello"},{"t":"task","html":"<p>Immagina che sia il tuo club di judo. Rifai la discussione aggiungendo un'idea tua (per esempio un torneo o uno stage con un maestro famoso).<\/p>","timer":210,"prep":20,"h":"Ora tocca a te"}],"ch":"p3","_text":"Il compito Your local sports club is celebrating its 50th anniversary. Discuss how to celebrate and choose the two best ideas. An open day with free lessons for children A photo exhibition about the club's history A match against a famous team A gala dinner for members A club T-shirt for everyone A video with interviews with old members Discussione modello (circa 3 minuti) Examiner Fifty years is a big anniversary. What do you think we should do? You I think an open day with free lessons for children would be perfect. It's a celebration, but it also brings new members to the club. What do you think? Examiner I like that. I also like the idea of a gala dinner for members. You It would be nice, but it might be expensive, and not everyone would come. How about combining it with the history? We could make a video with interviews with old members and show it during a simple dinner at the club. Examiner That's a great idea. People love seeing old photos and videos. You Exactly. Some of the founders are still alive, so it would be really moving to hear their stories. Examiner OK, so the open day and the dinner with the video? You Yes, I think that's the best combination: one event for the community and one for the members. Ogni idea ha uno scopo ( it also brings new members ): il “perché” è ciò che l'esaminatore vuole sentire. Chiusura con giustificazione finale: one event for the community and one for the members . Cosa notare nel modello Immagina che sia il tuo club di judo. Rifai la discussione aggiungendo un'idea tua (per esempio un torneo o uno stage con un maestro famoso). Ora tocca a te Negoziare con lessico dello sport e degli eventi, mantenendo l'interazione."},{"id":"p4-structure","n":"4.0","title":"Lo schema del monologo","sub":"Una storia semplice in 5 tappe","tags":["storytelling","connectors","tense","strategy"],"min":15,"day":8,"goal":"Avere uno schema fisso che regge 2 minuti, così la testa pensa al contenuto e non alla struttura.","blocks":[{"t":"p","html":"<p>Nelle prove precedenti il problema della Part 4 era la <strong>coerenza<\/strong>: dettagli poco chiari o troppi. La soluzione è raccontare <em>una sola storia<\/em>, semplice, in 5 tappe. Ogni tappa dura circa 20–25 secondi.<\/p>","h":null},{"t":"list","items":["<strong>1. Introduzione<\/strong> — di cosa parli, in una frase. <em>I'd like to talk about my first judo teacher, who had a big influence on my life.<\/em>","<strong>2. Contesto<\/strong> — quando, dove, chi (past simple / past continuous). <em>I met him when I was nine. I was a shy child and…<\/em>","<strong>3. Il momento chiave<\/strong> — cosa è successo (past simple + connettori di sequenza). <em>One day… Then… Suddenly… In the end…<\/em>","<strong>4. Come ti sei sentito / risultato<\/strong> — <em>I felt… · Thanks to that, I…<\/em>","<strong>5. Riflessione oggi<\/strong> — perché conta ancora (present perfect / present simple). <em>Since then, I've always… · Looking back, I think…<\/em>"],"h":"Le 5 tappe"},{"t":"phrases","h":"Connettori da parlato (non da tema scritto)","groups":[{"name":"Iniziare","items":[["I'd like to talk about…",""],["The person I've chosen is…",""],["This happened about ten years ago.",""]]},{"name":"Sequenza","items":[["At first…",""],["After that… / Then…",""],["A few days later…",""],["In the end…","alla fine (di una storia)"],["Eventually…","alla fine, dopo tempo/fatica"]]},{"name":"Aggiungere e contrastare","items":[["What's more…",""],["On top of that…",""],["However… / Even so…",""],["The funny thing is…",""]]},{"name":"Chiudere","items":[["Looking back, I think…",""],["That's why… is so important to me.",""],["So, all in all…",""],["And that's how…",""]]}]},{"t":"fix","h":"Errori da evitare","items":[["Moreover, furthermore, in addition…","What's more… / Also… / On top of that…","I connettori da scrittura suonano rigidi nel parlato: usa quelli colloquiali.","conn"],["I remember when I have met him.","I remember when I met him.","Un evento passato preciso → past simple.","tense"],["In the end of the story…","At the end of the story… / In the end, …","“At the end of” + qualcosa; “in the end” = alla fine, finalmente.","prep"]]},{"t":"p","html":"<p class=\"note\">Nei monologhi modello delle lezioni 4.2–4.8 persone ed episodi sono esempi costruiti su un insegnante di elettronica che fa judo e corre. Sostituiscili con le tue storie vere: si raccontano meglio.<\/p>","h":null},{"t":"task","html":"<p>Usa le 5 tappe per raccontare <em>“the last time you learnt something new”<\/em>. Non preoccuparti del contenuto: conta di aver toccato tutte e 5 le tappe.<\/p>","timer":120,"prep":30,"h":"Allenati adesso"}],"ch":"p4","_text":" Nelle prove precedenti il problema della Part 4 era la coerenza : dettagli poco chiari o troppi. La soluzione è raccontare una sola storia , semplice, in 5 tappe. Ogni tappa dura circa 20–25 secondi. 1. Introduzione — di cosa parli, in una frase. I'd like to talk about my first judo teacher, who had a big influence on my life. 2. Contesto — quando, dove, chi (past simple / past continuous). I met him when I was nine. I was a shy child and… 3. Il momento chiave — cosa è successo (past simple + connettori di sequenza). One day… Then… Suddenly… In the end… 4. Come ti sei sentito / risultato — I felt… · Thanks to that, I… 5. Riflessione oggi — perché conta ancora (present perfect / present simple). Since then, I've always… · Looking back, I think… Le 5 tappe Connettori da parlato (non da tema scritto) Iniziare I'd like to talk about… The person I've chosen is… This happened about ten years ago. Sequenza At first… After that… / Then… A few days later… In the end… alla fine (di una storia) Eventually… alla fine, dopo tempo/fatica Aggiungere e contrastare What's more… On top of that… However… / Even so… The funny thing is… Chiudere Looking back, I think… That's why… is so important to me. So, all in all… And that's how… Errori da evitare Moreover, furthermore, in addition… What's more… / Also… / On top of that… I connettori da scrittura suonano rigidi nel parlato: usa quelli colloquiali. conn I remember when I have met him. I remember when I met him. Un evento passato preciso → past simple. tense In the end of the story… At the end of the story… / In the end, … “At the end of” + qualcosa; “in the end” = alla fine, finalmente. prep Nei monologhi modello delle lezioni 4.2–4.8 persone ed episodi sono esempi costruiti su un insegnante di elettronica che fa judo e corre. Sostituiscili con le tue storie vere: si raccontano meglio. Usa le 5 tappe per raccontare “the last time you learnt something new” . Non preoccuparti del contenuto: conta di aver toccato tutte e 5 le tappe. Allenati adesso Avere uno schema fisso che regge 2 minuti, così la testa pensa al contenuto e non alla struttura."},{"id":"p4-notes","n":"4.1","title":"Appunti in 30 secondi","sub":"Cosa scrivere (e cosa no) prima di parlare","tags":["storytelling","strategy","fluency"],"min":10,"day":8,"goal":"Usare i 30 secondi per decidere la storia, non per scrivere frasi.","blocks":[{"t":"p","html":"<p>In 30 secondi si scrivono <strong>5–7 parole chiave<\/strong>, una per tappa, più 2 connettori. Mai frasi intere: le leggeresti e perderesti fluidità.<\/p>\n<p>Ordine delle decisioni: <strong>(1)<\/strong> scegli UNA storia concreta, la prima che viene in mente; <strong>(2)<\/strong> scrivi le 5 parole chiave; <strong>(3)<\/strong> scrivi in un angolo il tempo verbale principale (<em>PAST<\/em>) come promemoria.<\/p>","h":"Il metodo"},{"t":"p","html":"<div class=\"split\"><div class=\"sheet\"><h3>Appunti che funzionano<\/h3><ul><li>judo teacher – Luciano<\/li><li>age 9, shy<\/li><li>1st competition – lost – his words<\/li><li>confidence ↑<\/li><li>now: my students<\/li><li><em>PAST · Looking back<\/em><\/li><\/ul><\/div>\n<div class=\"sheet\"><h3>Appunti che bloccano<\/h3><ul><li>“The person that I want to describe is my teacher of judo, because he…”<\/li><li>(frase lunga, tempo finito, e contiene due errori)<\/li><\/ul><\/div><\/div>","h":"Esempio"},{"t":"fix","h":"Errori da evitare","items":[["Scegliere l'esempio “migliore” e perdere 20 secondi.","Scegli il primo esempio vero che ti viene in mente.","Una storia vera si racconta meglio di una storia perfetta.",""],["Raccontare tre persone / tre viaggi.","Una sola persona, un solo viaggio.","Tre storie = dettagli confusi. Una storia = coerenza.",""]]},{"t":"task","html":"<p>Per ciascun argomento, scrivi gli appunti in 30 secondi (usa il timer). Non parlare: allena solo gli appunti.<br>1. A time you helped someone.<br>2. Your favourite place to relax.<br>3. A decision that changed your life.<\/p>","timer":30,"prep":null,"h":"Allenati adesso"}],"ch":"p4","_text":" In 30 secondi si scrivono 5–7 parole chiave , una per tappa, più 2 connettori. Mai frasi intere: le leggeresti e perderesti fluidità. Ordine delle decisioni: (1) scegli UNA storia concreta, la prima che viene in mente; (2) scrivi le 5 parole chiave; (3) scrivi in un angolo il tempo verbale principale ( PAST ) come promemoria. Il metodo Appunti che funzionano judo teacher – Luciano age 9, shy 1st competition – lost – his words confidence ↑ now: my students PAST · Looking back Appunti che bloccano “The person that I want to describe is my teacher of judo, because he…” (frase lunga, tempo finito, e contiene due errori) Esempio Errori da evitare Scegliere l'esempio “migliore” e perdere 20 secondi. Scegli il primo esempio vero che ti viene in mente. Una storia vera si racconta meglio di una storia perfetta. Raccontare tre persone / tre viaggi. Una sola persona, un solo viaggio. Tre storie = dettagli confusi. Una storia = coerenza. Per ciascun argomento, scrivi gli appunti in 30 secondi (usa il timer). Non parlare: allena solo gli appunti. 1. A time you helped someone. 2. Your favourite place to relax. 3. A decision that changed your life. Allenati adesso Usare i 30 secondi per decidere la storia, non per scrivere frasi."},{"id":"p4-person","n":"4.2","title":"Una persona che ti ha influenzato","sub":"Descrivere una persona e il suo impatto","tags":["storytelling","sport","family"],"min":20,"day":8,"goal":"Descrivere una persona attraverso <em>un episodio<\/em>, non con una lista di aggettivi.","blocks":[{"t":"mono","h":"Il monologo","topic":"Talk about a person who has had an important influence on your life.","prompts":["Who is this person?","How did you meet them?","What did they do that influenced you?","Why are they still important to you?"],"notes":["judo teacher – Luciano","age 9 – shy","1st competition – lost – “you didn't lose, you learnt”","confidence ↑, never stopped","now: I say the same to my students","PAST → Looking back"],"model":["I'd like to talk about my first judo teacher, Luciano, who probably had the biggest influence on my life after my parents.","I met him when I was about nine. At that time I was a very shy child, and my parents thought that a sport would help me. <mark>At first<\/mark> I didn't really enjoy it, because I was afraid of making mistakes in front of the others.","The moment I remember best is my first competition. I was really nervous, and I lost my first fight in less than a minute. I was so upset that I wanted to go home immediately. <mark>But then<\/mark> Luciano sat down next to me and said: “You didn't lose, you learnt something.” <mark>Then<\/mark> he explained exactly what I had done wrong, calmly, without shouting.","It sounds simple, <mark>but<\/mark> it changed the way I saw mistakes. <mark>After that<\/mark>, I started to enjoy training much more, and I became more confident at school too.","<mark>Looking back<\/mark>, I think he taught me much more than judo. He showed me that a good teacher is patient and believes in you. <mark>What's more<\/mark>, now that I'm a teacher myself, I often say the same thing to my students when they fail a test. <mark>So, all in all<\/mark>, he's still an important person for me, even though I haven't seen him for many years."],"follow":[{"q":"Do you think teachers today have the same influence on young people?","a":"Yes, I think they can, although it's harder, because young people have many other influences, like social media. But a teacher who really listens can still make a big difference."},{"q":"Is it better to have a strict teacher or a relaxed one?","a":"I'd say a teacher should be clear and consistent rather than strict. Students need rules, but they also need to feel they can make mistakes without being judged."}]},{"t":"fix","h":"Attenzione a…","items":[["He has taught me a lot when I was a child.","He taught me a lot when I was a child.","“When I was a child” → past simple.","tense"],["He was a person very patient.","He was a very patient person.","L'aggettivo va prima del nome.","wo"]]}],"ch":"p4","_text":"Il monologo Talk about a person who has had an important influence on your life. Who is this person? How did you meet them? What did they do that influenced you? Why are they still important to you? judo teacher – Luciano age 9 – shy 1st competition – lost – “you didn't lose, you learnt” confidence ↑, never stopped now: I say the same to my students PAST → Looking back I'd like to talk about my first judo teacher, Luciano, who probably had the biggest influence on my life after my parents. I met him when I was about nine. At that time I was a very shy child, and my parents thought that a sport would help me. At first I didn't really enjoy it, because I was afraid of making mistakes in front of the others. The moment I remember best is my first competition. I was really nervous, and I lost my first fight in less than a minute. I was so upset that I wanted to go home immediately. But then Luciano sat down next to me and said: “You didn't lose, you learnt something.” Then he explained exactly what I had done wrong, calmly, without shouting. It sounds simple, but it changed the way I saw mistakes. After that , I started to enjoy training much more, and I became more confident at school too. Looking back , I think he taught me much more than judo. He showed me that a good teacher is patient and believes in you. What's more , now that I'm a teacher myself, I often say the same thing to my students when they fail a test. So, all in all , he's still an important person for me, even though I haven't seen him for many years. Do you think teachers today have the same influence on young people? Yes, I think they can, although it's harder, because young people have many other influences, like social media. But a teacher who really listens can still make a big difference. Is it better to have a strict teacher or a relaxed one? I'd say a teacher should be clear and consistent rather than strict. Students need rules, but they also need to feel they can make mistakes without being judged. Attenzione a… He has taught me a lot when I was a child. He taught me a lot when I was a child. “When I was a child” → past simple. tense He was a person very patient. He was a very patient person. L'aggettivo va prima del nome. wo Descrivere una persona attraverso un episodio , non con una lista di aggettivi."},{"id":"p4-achievement","n":"4.3","title":"Un traguardo di cui vai fiero","sub":"Raccontare un successo e il percorso","tags":["storytelling","work","education"],"min":20,"day":9,"goal":"Raccontare un successo mostrando il percorso (difficoltà → sforzo → risultato).","blocks":[{"t":"mono","h":"Il monologo","topic":"Talk about an achievement you are proud of.","prompts":["What did you achieve?","When was it?","What difficulties did you have?","How did you feel?"],"notes":["concorso – permanent teacher","last year – long preparation","work + study at night","results online – shouting!","since then – more confident","PAST → Since then"],"model":["The achievement I'm most proud of is passing the national teachers' competition, which gave me a permanent position at my school.","<mark>At that time<\/mark> I was already teaching, but on temporary contracts, so every September I didn't know where I would work. The competition was the only way to get a stable job.","The preparation was really hard. I was working full-time, so I had to study in the evenings and at weekends for several months. <mark>On top of that<\/mark>, the exam included a written test and a practical lesson in front of a committee, which made me very nervous.","<mark>In the end<\/mark>, the day the results came out, I was at home and I checked the website about twenty times. When I finally saw my name on the list, I shouted so loudly that my neighbour came to ask if everything was OK!","<mark>Since then<\/mark>, my life has become much more stable. I can plan my lessons over several years and work on long-term projects with my colleagues. <mark>Looking back<\/mark>, I think I'm proud not only of the result, but of the fact that I didn't give up when I was tired. <mark>That's why<\/mark> I'm using the same approach for this English exam."],"follow":[{"q":"Is it important to set goals in life?","a":"I think so. Goals give you direction and help you stay motivated, but they need to be realistic, otherwise you just get frustrated."},{"q":"Do you think people today give up too easily?","a":"Sometimes, yes. Everything is so fast now that people expect immediate results. But I also see many young people who work really hard for what they want."}]},{"t":"fix","h":"Attenzione a…","items":[["I'm proud to have passed it.","I'm proud that I passed it. / I'm proud of passing it.","Entrambe corrette; scegline una e usala sempre.",""],["When I have seen my name…","When I saw my name…","Momento preciso nel passato.","tense"]]}],"ch":"p4","_text":"Il monologo Talk about an achievement you are proud of. What did you achieve? When was it? What difficulties did you have? How did you feel? concorso – permanent teacher last year – long preparation work + study at night results online – shouting! since then – more confident PAST → Since then The achievement I'm most proud of is passing the national teachers' competition, which gave me a permanent position at my school. At that time I was already teaching, but on temporary contracts, so every September I didn't know where I would work. The competition was the only way to get a stable job. The preparation was really hard. I was working full-time, so I had to study in the evenings and at weekends for several months. On top of that , the exam included a written test and a practical lesson in front of a committee, which made me very nervous. In the end , the day the results came out, I was at home and I checked the website about twenty times. When I finally saw my name on the list, I shouted so loudly that my neighbour came to ask if everything was OK! Since then , my life has become much more stable. I can plan my lessons over several years and work on long-term projects with my colleagues. Looking back , I think I'm proud not only of the result, but of the fact that I didn't give up when I was tired. That's why I'm using the same approach for this English exam. Is it important to set goals in life? I think so. Goals give you direction and help you stay motivated, but they need to be realistic, otherwise you just get frustrated. Do you think people today give up too easily? Sometimes, yes. Everything is so fast now that people expect immediate results. But I also see many young people who work really hard for what they want. Attenzione a… I'm proud to have passed it. I'm proud that I passed it. / I'm proud of passing it. Entrambe corrette; scegline una e usala sempre. When I have seen my name… When I saw my name… Momento preciso nel passato. tense Raccontare un successo mostrando il percorso (difficoltà → sforzo → risultato)."},{"id":"p4-difficult","n":"4.4","title":"Una situazione difficile","sub":"Un problema e come l'hai risolto","tags":["storytelling","travel","strategy"],"min":20,"day":9,"goal":"Raccontare un problema in modo lineare: situazione → problema → soluzione → lezione imparata.","blocks":[{"t":"mono","h":"Il monologo","topic":"Talk about a difficult situation you had to deal with.","prompts":["What was the situation?","Why was it difficult?","What did you do?","What did you learn from it?"],"notes":["school trip – Munich","student lost – station","phone, police, calm","found – 40 min","lesson: plan B, stay calm","PAST → I learnt"],"model":["I'd like to talk about a difficult situation I had a few years ago, during a school trip to Munich.","I was one of the teachers in charge of a group of about forty students. On the last day we were at the central station, waiting for the train home, <mark>when<\/mark> we realised that one student was missing.","<mark>At first<\/mark> I thought he was just in the toilet or buying something, <mark>but<\/mark> after ten minutes he still wasn't there, and he wasn't answering his phone. The train was leaving in less than an hour, so I was really worried. <mark>Then<\/mark> I asked my colleague to stay with the group, and I went to the station police.","They were very helpful. They made an announcement in English and German, and about forty minutes later the student appeared. He had got on the wrong underground line and his phone battery was dead. We caught the train with five minutes to spare!","<mark>Looking back<\/mark>, I learnt two things. <mark>First<\/mark>, it's essential to stay calm, because the students look at you to understand how serious the situation is. <mark>Second<\/mark>, you always need a plan B. <mark>Since then<\/mark>, on every trip, I give all the students a card with my number and a meeting point."],"follow":[{"q":"How do you usually react when something goes wrong?","a":"I try to stay calm and think about the next step. Getting angry or panicking doesn't solve anything, although of course I don't always manage it!"},{"q":"Are school trips worth the effort?","a":"Definitely. Students learn a lot, not only about the places, but about being independent. And they remember those trips for years."}]},{"t":"fix","h":"Attenzione a…","items":[["He had took the wrong line.","He had taken the wrong line.","Past perfect = had + participio.","tense"],["I was very worried for him.","I was very worried about him.","Worried <strong>about<\/strong>.","prep"]]}],"ch":"p4","_text":"Il monologo Talk about a difficult situation you had to deal with. What was the situation? Why was it difficult? What did you do? What did you learn from it? school trip – Munich student lost – station phone, police, calm found – 40 min lesson: plan B, stay calm PAST → I learnt I'd like to talk about a difficult situation I had a few years ago, during a school trip to Munich. I was one of the teachers in charge of a group of about forty students. On the last day we were at the central station, waiting for the train home, when we realised that one student was missing. At first I thought he was just in the toilet or buying something, but after ten minutes he still wasn't there, and he wasn't answering his phone. The train was leaving in less than an hour, so I was really worried. Then I asked my colleague to stay with the group, and I went to the station police. They were very helpful. They made an announcement in English and German, and about forty minutes later the student appeared. He had got on the wrong underground line and his phone battery was dead. We caught the train with five minutes to spare! Looking back , I learnt two things. First , it's essential to stay calm, because the students look at you to understand how serious the situation is. Second , you always need a plan B. Since then , on every trip, I give all the students a card with my number and a meeting point. How do you usually react when something goes wrong? I try to stay calm and think about the next step. Getting angry or panicking doesn't solve anything, although of course I don't always manage it! Are school trips worth the effort? Definitely. Students learn a lot, not only about the places, but about being independent. And they remember those trips for years. Attenzione a… He had took the wrong line. He had taken the wrong line. Past perfect = had + participio. tense I was very worried for him. I was very worried about him. Worried about . prep Raccontare un problema in modo lineare: situazione → problema → soluzione → lezione imparata."},{"id":"p4-place","n":"4.5","title":"Un luogo speciale","sub":"Descrivere un posto e cosa significa per te","tags":["storytelling","home","environment","sport"],"min":20,"day":12,"goal":"Descrivere un luogo con dettagli sensoriali, senza perdere il filo della storia.","blocks":[{"t":"mono","h":"Il monologo","topic":"Talk about a place that is special to you.","prompts":["Where is it?","How often do you go there?","What do you do there?","Why is it special?"],"notes":["river path – Livenza","5 min from home","run 2–3 times/week, seasons","the day I saw a deer / mist","clears my mind","PRESENT + one PAST memory"],"model":["The place I'd like to talk about is a path along the Livenza river, just five minutes from my house.","It isn't a famous place at all. It's a simple dirt path between the fields and the water, with trees on both sides. I go there two or three times a week, usually to run, but sometimes just for a walk with my family.","What I love about it is that it changes with the seasons. In autumn the trees turn yellow and red, and in winter, early in the morning, there's often a thick mist over the water, which looks almost magical. I remember one morning last winter, when I was running in the fog, a deer suddenly jumped across the path right in front of me. I stopped, and for a few seconds we just looked at each other.","<mark>Apart from<\/mark> the beauty, it's special because it's where I think. When I have a problem at work or a difficult decision to make, I go for a run there, and I usually come back with a clearer head.","<mark>So, all in all<\/mark>, it's a very ordinary place, <mark>but<\/mark> for me it's the perfect way to switch off. I've lived near it for years and I've never got bored of it."],"follow":[{"q":"Is it important for towns to have green spaces?","a":"Very. Green spaces are good for people's physical and mental health, and they're free, so everyone can use them."},{"q":"Do people spend less time outdoors than in the past?","a":"I think so, especially children. When I was young we played outside all afternoon, while now many kids spend their free time indoors, in front of a screen."}]},{"t":"fix","h":"Attenzione a…","items":[["I go there since many years.","I've been going there for years.","Da anni → present perfect continuous + for.","tense"],["It's near to my house.","It's near my house. / It's close to my house.","Near senza “to”; close vuole “to”.","prep"]]}],"ch":"p4","_text":"Il monologo Talk about a place that is special to you. Where is it? How often do you go there? What do you do there? Why is it special? river path – Livenza 5 min from home run 2–3 times/week, seasons the day I saw a deer / mist clears my mind PRESENT + one PAST memory The place I'd like to talk about is a path along the Livenza river, just five minutes from my house. It isn't a famous place at all. It's a simple dirt path between the fields and the water, with trees on both sides. I go there two or three times a week, usually to run, but sometimes just for a walk with my family. What I love about it is that it changes with the seasons. In autumn the trees turn yellow and red, and in winter, early in the morning, there's often a thick mist over the water, which looks almost magical. I remember one morning last winter, when I was running in the fog, a deer suddenly jumped across the path right in front of me. I stopped, and for a few seconds we just looked at each other. Apart from the beauty, it's special because it's where I think. When I have a problem at work or a difficult decision to make, I go for a run there, and I usually come back with a clearer head. So, all in all , it's a very ordinary place, but for me it's the perfect way to switch off. I've lived near it for years and I've never got bored of it. Is it important for towns to have green spaces? Very. Green spaces are good for people's physical and mental health, and they're free, so everyone can use them. Do people spend less time outdoors than in the past? I think so, especially children. When I was young we played outside all afternoon, while now many kids spend their free time indoors, in front of a screen. Attenzione a… I go there since many years. I've been going there for years. Da anni → present perfect continuous + for. tense It's near to my house. It's near my house. / It's close to my house. Near senza “to”; close vuole “to”. prep Descrivere un luogo con dettagli sensoriali, senza perdere il filo della storia."},{"id":"p4-skill","n":"4.6","title":"Imparare una nuova abilità","sub":"Un'abilità imparata da adulto","tags":["storytelling","education","tech"],"min":20,"day":13,"goal":"Raccontare un processo di apprendimento con connettori di sequenza e il present perfect per i risultati.","blocks":[{"t":"mono","h":"Il monologo","topic":"Talk about a skill you learnt as an adult.","prompts":["What skill was it?","Why did you decide to learn it?","How did you learn it?","How useful has it been?"],"notes":["3D printing / design","school lab – new printer","online tutorials + trial & error","first print – disaster","now: students' projects","PAST → has been useful"],"model":["I'd like to talk about 3D design and printing, which I learnt a few years ago.","The reason was quite practical. Our school bought a 3D printer for the lab, but nobody really knew how to use it, so it stayed in a corner for months. I thought it was a shame, so I decided to learn.","<mark>At first<\/mark> I watched lots of online tutorials in the evenings, and <mark>then<\/mark> I started experimenting. My first print was a complete disaster: the plastic came out like spaghetti and I had to throw everything away! <mark>But<\/mark> little by little I understood how to set the temperature and the speed, and <mark>eventually<\/mark> I managed to print a simple box for an electronic circuit.","It has been really useful. Now my students design cases for their own projects, and they're much more motivated when they can take home something they've made. <mark>What's more<\/mark>, it has helped me understand how they feel when they learn something new and make mistakes.","<mark>So<\/mark>, the lesson for me is that you're never too old to learn, and that mistakes are part of the process."],"follow":[{"q":"Is it easier to learn new skills today than in the past?","a":"In a way, yes, because there are so many free resources online. But it's also easy to get distracted, so you need more discipline."},{"q":"What skill would you like to learn next?","a":"I'd like to speak English more fluently, of course! After that, maybe playing the guitar, which I've always wanted to do."}]},{"t":"fix","h":"Attenzione a…","items":[["I learnt it alone.","I taught myself. / I learnt it on my own.","“Da solo” = on my own / by myself.","calque"],["Eventually I will try.","I might try at some point.","“Eventually” = alla fine, non “eventualmente”.","calque"]]}],"ch":"p4","_text":"Il monologo Talk about a skill you learnt as an adult. What skill was it? Why did you decide to learn it? How did you learn it? How useful has it been? 3D printing / design school lab – new printer online tutorials + trial & error first print – disaster now: students' projects PAST → has been useful I'd like to talk about 3D design and printing, which I learnt a few years ago. The reason was quite practical. Our school bought a 3D printer for the lab, but nobody really knew how to use it, so it stayed in a corner for months. I thought it was a shame, so I decided to learn. At first I watched lots of online tutorials in the evenings, and then I started experimenting. My first print was a complete disaster: the plastic came out like spaghetti and I had to throw everything away! But little by little I understood how to set the temperature and the speed, and eventually I managed to print a simple box for an electronic circuit. It has been really useful. Now my students design cases for their own projects, and they're much more motivated when they can take home something they've made. What's more , it has helped me understand how they feel when they learn something new and make mistakes. So , the lesson for me is that you're never too old to learn, and that mistakes are part of the process. Is it easier to learn new skills today than in the past? In a way, yes, because there are so many free resources online. But it's also easy to get distracted, so you need more discipline. What skill would you like to learn next? I'd like to speak English more fluently, of course! After that, maybe playing the guitar, which I've always wanted to do. Attenzione a… I learnt it alone. I taught myself. / I learnt it on my own. “Da solo” = on my own / by myself. calque Eventually I will try. I might try at some point. “Eventually” = alla fine, non “eventualmente”. calque Raccontare un processo di apprendimento con connettori di sequenza e il present perfect per i risultati."},{"id":"p4-journey","n":"4.7","title":"Un viaggio memorabile","sub":"Raccontare un viaggio, un imprevisto e un ricordo","tags":["storytelling","travel","freetime"],"min":20,"day":13,"goal":"Raccontare un viaggio scegliendo UN momento centrale, senza elenchi di luoghi.","blocks":[{"t":"mono","h":"Il monologo","topic":"Talk about a journey or trip you remember well.","prompts":["Where did you go?","Who did you go with?","What happened?","Why do you remember it?"],"notes":["Dolomites – hut","2 friends – summer","storm – afternoon","stayed in hut, strangers, cards","sunrise next morning","PAST → still talk about it"],"model":["I'd like to talk about a trip to the Dolomites that I did with two friends a few summers ago.","We had planned a two-day hike, and the idea was to sleep in a mountain hut halfway along the route. The first morning was perfect: blue sky, no wind, amazing views.","<mark>However<\/mark>, in the afternoon the weather changed very quickly. Dark clouds came in and <mark>then<\/mark> a violent storm started, with thunder and heavy rain. Luckily, we were only about twenty minutes from the hut, so we ran the last part and arrived completely soaked.","The hut was full of other hikers who had had the same problem. There was no signal, so instead of looking at our phones, we spent the evening playing cards and talking with people from Germany and Austria. It was one of the most fun evenings I can remember.","The next morning the sky was clear again, and we watched the sunrise over the mountains. <mark>Looking back<\/mark>, I remember that trip not for the views, but for the storm and the evening in the hut. We still talk about it every time we meet."],"follow":[{"q":"Do you prefer planned trips or spontaneous ones?","a":"I like to plan the basics, like transport and where to sleep, but I prefer to leave some free time for surprises. Often the best moments are the ones you didn't plan."},{"q":"Is it important to disconnect from technology on holiday?","a":"I think it is, at least for a few hours a day. That evening in the hut showed me how much better conversations are without phones."}]},{"t":"fix","h":"Attenzione a…","items":[["We did a trip in the Dolomites.","We went on a trip to the Dolomites.","Go on a trip <strong>to<\/strong>.","calque"],["We arrived at the hut completely wet like chickens.","We arrived at the hut completely soaked.","Niente modi di dire tradotti: “soaked (to the skin)”.","calque"]]}],"ch":"p4","_text":"Il monologo Talk about a journey or trip you remember well. Where did you go? Who did you go with? What happened? Why do you remember it? Dolomites – hut 2 friends – summer storm – afternoon stayed in hut, strangers, cards sunrise next morning PAST → still talk about it I'd like to talk about a trip to the Dolomites that I did with two friends a few summers ago. We had planned a two-day hike, and the idea was to sleep in a mountain hut halfway along the route. The first morning was perfect: blue sky, no wind, amazing views. However , in the afternoon the weather changed very quickly. Dark clouds came in and then a violent storm started, with thunder and heavy rain. Luckily, we were only about twenty minutes from the hut, so we ran the last part and arrived completely soaked. The hut was full of other hikers who had had the same problem. There was no signal, so instead of looking at our phones, we spent the evening playing cards and talking with people from Germany and Austria. It was one of the most fun evenings I can remember. The next morning the sky was clear again, and we watched the sunrise over the mountains. Looking back , I remember that trip not for the views, but for the storm and the evening in the hut. We still talk about it every time we meet. Do you prefer planned trips or spontaneous ones? I like to plan the basics, like transport and where to sleep, but I prefer to leave some free time for surprises. Often the best moments are the ones you didn't plan. Is it important to disconnect from technology on holiday? I think it is, at least for a few hours a day. That evening in the hut showed me how much better conversations are without phones. Attenzione a… We did a trip in the Dolomites. We went on a trip to the Dolomites. Go on a trip to . calque We arrived at the hut completely wet like chickens. We arrived at the hut completely soaked. Niente modi di dire tradotti: “soaked (to the skin)”. calque Raccontare un viaggio scegliendo UN momento centrale, senza elenchi di luoghi."},{"id":"p4-change","n":"4.8","title":"Un cambiamento importante","sub":"Come la tecnologia ha cambiato il tuo lavoro","tags":["storytelling","tech","work"],"min":20,"day":14,"goal":"Confrontare passato e presente (used to / now) e dare un'opinione bilanciata.","blocks":[{"t":"mono","h":"Il monologo","topic":"Talk about how technology has changed your job or daily life.","prompts":["What was it like before?","What has changed?","Give an example.","Is the change positive or negative?"],"notes":["teaching then vs now","used to: paper, blackboard","now: platform, simulators","example: lockdown lessons","+ / − balance","used to → have changed"],"model":["I'd like to talk about how technology has changed my job as a teacher.","When I started teaching, we <mark>used to<\/mark> do almost everything on paper. We wrote on the blackboard, students copied the circuits into their notebooks, and we recorded marks in a paper register.","Now things are completely different. We have an online register, students receive materials on a digital platform, and in the lab we use simulation software before building a circuit, which saves time and components.","The clearest example was during the lockdown in 2020. From one day to the next, we had to teach online. <mark>At first<\/mark> it was chaotic, and I spent whole nights learning how to use video-conferencing tools. <mark>But in the end<\/mark> we managed, and many of those tools are still useful today.","<mark>On the whole<\/mark>, I think the change has been positive: lessons are more interactive and students can study at their own pace. <mark>On the other hand<\/mark>, I've noticed that students find it harder to concentrate for a long time, and they sometimes trust the simulator more than their own reasoning. <mark>So<\/mark>, technology is a great tool, but it doesn't replace a good teacher."],"follow":[{"q":"Will technology replace teachers in the future?","a":"I don't think so. It can replace some tasks, like correcting simple tests, but students still need someone who motivates them and understands their problems."},{"q":"Are older people disadvantaged by technology?","a":"Sometimes, yes, especially with public services that are only online. I think there should always be an alternative, like a phone number or an office."}]},{"t":"fix","h":"Attenzione a…","items":[["Before, I was used to write on the blackboard.","I used to write on the blackboard.","Abitudine passata = used to + verbo base.","tense"],["During the lockdown we have taught online.","During the lockdown we taught online.","Periodo concluso → past simple.","tense"]]}],"ch":"p4","_text":"Il monologo Talk about how technology has changed your job or daily life. What was it like before? What has changed? Give an example. Is the change positive or negative? teaching then vs now used to: paper, blackboard now: platform, simulators example: lockdown lessons + / − balance used to → have changed I'd like to talk about how technology has changed my job as a teacher. When I started teaching, we used to do almost everything on paper. We wrote on the blackboard, students copied the circuits into their notebooks, and we recorded marks in a paper register. Now things are completely different. We have an online register, students receive materials on a digital platform, and in the lab we use simulation software before building a circuit, which saves time and components. The clearest example was during the lockdown in 2020. From one day to the next, we had to teach online. At first it was chaotic, and I spent whole nights learning how to use video-conferencing tools. But in the end we managed, and many of those tools are still useful today. On the whole , I think the change has been positive: lessons are more interactive and students can study at their own pace. On the other hand , I've noticed that students find it harder to concentrate for a long time, and they sometimes trust the simulator more than their own reasoning. So , technology is a great tool, but it doesn't replace a good teacher. Will technology replace teachers in the future? I don't think so. It can replace some tasks, like correcting simple tests, but students still need someone who motivates them and understands their problems. Are older people disadvantaged by technology? Sometimes, yes, especially with public services that are only online. I think there should always be an alternative, like a phone number or an office. Attenzione a… Before, I was used to write on the blackboard. I used to write on the blackboard. Abitudine passata = used to + verbo base. tense During the lockdown we have taught online. During the lockdown we taught online. Periodo concluso → past simple. tense Confrontare passato e presente (used to / now) e dare un'opinione bilanciata."},{"id":"gr-tenses","n":"5.1","title":"Past simple o present perfect?","sub":"L'errore n. 1 quando racconti","tags":["tense","storytelling"],"min":20,"day":3,"goal":"Scegliere in un secondo il tempo giusto con una sola domanda: “c'è un momento finito?”","blocks":[{"t":"p","html":"<p>In italiano il passato prossimo copre due tempi inglesi. Da qui nasce l'errore. La domanda da farti è una sola:<\/p>\n<p><strong>Si vede un momento finito (ieri, nel 2019, quando ero piccolo, durante il lockdown)?<\/strong><br>\n→ Sì: <strong>past simple<\/strong> (<em>I went, I saw, I passed<\/em>).<br>\n→ No, conta il risultato oggi o il periodo arriva fino a ora: <strong>present perfect<\/strong> (<em>I've been, I've never seen, I've lived here for…<\/em>).<\/p>","h":"La regola in una domanda"},{"t":"vocab","h":"Le parole spia","items":[["yesterday · last week · in 2019 · two years ago · when I was… ·
